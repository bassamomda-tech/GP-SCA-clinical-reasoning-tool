MG.render({
  icon:"⚡",
  title:"Shingles (herpes zoster)",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Shingles: find the eye, ear and spreading cases first, then decide who needs an antiviral",
  stemSub:"One page for herpes zoster in primary care. Check the face, the ear and the immune system before anything else. Decide on an antiviral by timing and risk rather than giving it to everyone. Treat pain early and properly, because post-herpetic neuralgia is the complication most patients will live with. Explain who the rash can infect. Finally, check eligibility for Shingrix, which widened in 2023 and again in 2025.",
  guideline:"Aciclovir, valaciclovir and famciclovir SPCs · BNF · UKHSA Green Book ch.28a (2025) · UKHSA VZV PEP guidance (Mar 2026) · NHS England Pharmacy First shingles pathway · NICE CG173 (2013, updated 2020) · RCOG GTG 13 (2015)",
  meta:[
    {t:"SPCs and BNF · antiviral doses"},
    {t:"Green Book ch.28a · Shingrix"},

  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Danger sites</b><small>eye, ear, spreading</small></a><a href='#antiviral'><b>Antiviral</b><small>72 hours, or up to a week</small></a><a href='#pain'><b>Pain</b><small>treat early, watch for PHN</small></a><a href='#vaccine'><b>Shingrix</b><small>check current eligibility</small></a></div>",
  quickSub:"The six points that change what you do today. Each one is traced to a named primary source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Tip of the nose, a red eye or a facial palsy? Same-day action", html:"Rash in the ophthalmic division, especially on the <b>tip, side or root of the nose (Hutchinson's sign)</b>, increases the risk of eye involvement. Ophthalmic zoster needs an oral antiviral today. Ask about visual change, eye pain, photophobia and red eye: Hutchinson's sign means a low threshold for urgent ophthalmic assessment, but the referral urgency is set by eye symptoms and examination. Arrange <b>same-day ophthalmology assessment</b> for a red or painful eye, reduced vision, photophobia, corneal or uveal involvement, marked eyelid swelling, difficulty examining the eye, significant immunosuppression or diagnostic uncertainty. Ear vesicles with a <b>facial palsy</b> (Ramsay Hunt) need an antiviral and same-day ENT or acute specialist discussion. Disseminated disease, neurological symptoms, or severe immunosuppression with systemic illness or extensive disease need same-day hospital assessment."},
    {tone:"cream", h:"Not everyone needs an antiviral", html:"Within <b>72 hours</b> of rash onset, offer an antiviral where the patient meets the <b>NHS England Pharmacy First criteria</b> (<b>over 50</b>, <b>immunosuppressed</b>, a rash off the trunk such as the <b>neck, limbs or perineum</b>, or <b>moderate or severe</b> pain or rash) or has a high-risk site or clinical risk factor. Any zoster in the ophthalmic division gets an oral antiviral while the rash is active; ophthalmic and otic disease are treated whenever active. After 72 hours (up to about a week), <b>consider</b> treatment if new vesicles are still appearing, or there is severe pain, significant rash, immunosuppression, ophthalmic or otic involvement or a high risk of complications; older age (70 and over) supports, but does not decide, that judgement. A young healthy adult with mild truncal shingles on day 5 usually needs analgesia and advice only."},
    {tone:"cream", h:"Doses: aciclovir, valaciclovir or famciclovir for 7 days", html:"<b>Aciclovir 800 mg five times daily</b> (about every 4 hours, missing the night dose), or <b>valaciclovir 1 g three times daily</b>, or <b>famciclovir 500 mg three times daily</b>, each for 7 days. Valaciclovir and famciclovir are easier to take. Check creatinine or eGFR where there is CKD, frailty, dehydration, older age or relevant comorbidity, and <b>dose-adjust all three</b> using the current SPC or local formulary. Aciclovir and valaciclovir <b>accumulate in renal impairment</b> and can cause confusion, hallucinations, tremor, agitation or drowsiness."},
    {tone:"amber", h:"Treat the pain properly, and name post-herpetic neuralgia early", html:"Pain that lasts <b>90 days or more</b> after the rash is post-herpetic neuralgia. It is more likely with older age and with severe acute pain or rash. Start with regular simple analgesia. If there is clear neuropathic pain or allodynia, consider <b>amitriptyline, duloxetine, gabapentin or pregabalin</b> after reviewing renal function, falls risk, sedation and interactions (NICE CG173 covers neuropathic pain generally, not acute zoster specifically). <b>Do not prescribe systemic corticosteroids routinely to prevent PHN</b>."},
    {tone:"blue", h:"Who can catch it: chickenpox, not shingles", html:"A person with shingles is infectious to susceptible contacts while vesicles are present, until all lesions have crusted. Transmission is mainly by direct contact with blister fluid, and can give <b>chickenpox</b> (not shingles) to someone who is not immune; the risk is low when a localised rash is fully covered. Shingles on an <b>exposed site</b> (for example the face) or <b>disseminated</b> shingles carries more risk; an <b>immunosuppressed</b> patient may shed virus for longer, so precautions and specialist advice matter. Susceptible pregnant, immunosuppressed and neonatal contacts need <b>urgent assessment through virology, health protection, paediatric or obstetric pathways</b>."},
    {tone:"green", h:"Shingrix: two doses and a wider offer", html:"Shingrix replaced Zostavax for the whole programme on 1 September 2023. It is offered to adults as they <b>turn 65 or 70</b>. Anyone aged 70 to 79 who missed it stays eligible until their <b>80th birthday</b>. Since <b>1 September 2025</b>, it is also offered to all <b>severely immunosuppressed adults aged 18 and over</b>. A past episode of shingles does not rule someone out. Routine age cohorts are being phased towards age 60 and eligibility has changed recently, so check the <a href='https://www.gov.uk/government/publications/shingles-herpes-zoster-the-green-book-chapter-28a'>current Green Book chapter 28a</a> and the latest NHS England programme letter, including how long to wait after an episode."}
  ],
  pathwaySub:"The consultation in five moves. Step one is where most of the harm happens if it is missed.",
  pathway:[
    {title:"Look for the danger sites", html:"Examine the nose, the eye, the ear canal and the facial nerve. Ask about vision, eye pain and hearing. Establish immune status, using the Green Book chapter 28a definition of severe immunosuppression (for example chemotherapy, transplant, biologics, high-dose steroids, HIV), and whether the rash is spreading beyond one or two neighbouring dermatomes."},
    {title:"Confirm it is zoster", html:"Look for one-sided pain or tingling followed by clustered blisters on a red base in a dermatome, stopping at the midline. The diagnosis is clinical. Take a <b>PCR swab from the base of a fresh vesicle</b> (not just dry crust) only when it is atypical, in an immunosuppressed patient, or when herpes simplex is a real possibility."},
    {title:"Decide on the antiviral", html:"Check the day of rash onset and the risk features. If an antiviral is indicated, choose a drug the patient can take reliably, adjust for eGFR, and start it today. If one is not indicated, explain why."},
    {title:"Treat the pain and set up the review", html:"Use regular simple analgesia. Consider a neuropathic agent if there is clear neuropathic pain or allodynia, after reviewing renal function, falls risk, sedation and interactions. Warn about post-herpetic neuralgia and agree when the patient should come back."},
    {title:"Protect others, then prevent the next episode", html:"Advise covering the rash and avoiding people who are not immune. Identify susceptible pregnant, immunosuppressed or newborn contacts and arrange urgent assessment through virology, health protection, paediatric or obstetric pathways. Check Shingrix eligibility and plan it for after recovery, timed as the Green Book advises."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: the eye, the ear and the immune system", sub:"Most shingles settles at home. These presentations need action the same day, whatever the day of the rash.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Herpes zoster ophthalmicus", html:"The ophthalmic division of the trigeminal nerve is involved: rash on the forehead, upper eyelid and scalp. Vesicles on the <b>tip, side or root of the nose</b> (Hutchinson's sign, the nasociliary branch) increase the risk of ocular involvement and should prompt a low threshold for urgent ophthalmic assessment, but the referral urgency is determined by ocular symptoms and examination. Any zoster affecting the ophthalmic division should receive an <b>oral antiviral</b>, regardless of the precise day of onset if the rash remains active. Ask specifically about visual change, eye pain, photophobia and red eye. Arrange <b>same-day ophthalmology assessment</b> for a red or painful eye, reduced vision, photophobia, corneal involvement, anterior uveitis/iritis, marked eyelid swelling, difficulty examining the eye, significant immunosuppression or diagnostic uncertainty. A quiet eye with no visual symptoms may be managed with urgent optometry or ophthalmology advice according to the local pathway.", src:"College of Optometrists CMG: herpes zoster ophthalmicus"},
         {tone:"red", h:"🔴 Ramsay Hunt syndrome", html:"Ear pain with vesicles in the ear canal or on the pinna, or on the palate, with a <b>lower motor neurone facial palsy</b>. There may also be vertigo, tinnitus or hearing loss. Ask about hearing loss, vertigo and tinnitus. Start an antiviral and <b>discuss with ENT or the acute specialist team the same day</b>. Check whether the eye closes; if not, use eye lubrication and protection. The evidence for antivirals and steroids is limited, but early specialist-directed treatment is standard practice because of the potential for persistent facial weakness. Ear vesicles without a facial palsy are not Ramsay Hunt syndrome, but otic zoster is still treated while active.", src:"Cochrane: Uscategui 2008 (CD006851 antivirals; CD006852 steroids in Ramsay Hunt syndrome)"},
         {tone:"red", h:"🔴 Disseminated or severe disease, or severe immunosuppression", html:"Arrange <b>same-day hospital assessment</b> for: disseminated or multidermatomal rash; new lesions continuing rapidly despite oral treatment; systemic illness; visceral symptoms (respiratory, abdominal or neurological); severe immunosuppression with extensive disease; inability to take oral treatment, or concern about absorption or adherence; suspected ocular, neurological or visceral involvement. Hospital-based IV aciclovir may be required, according to the hospital infection/microbiology or specialist protocol. Disseminated disease in an immunosuppressed patient needs infection-control precautions and hospital or specialist input.", src:"Aciclovir SPC · RCOG GTG 13 (2015)"},
         {tone:"red", h:"🔴 Neurological features", html:"Confusion, drowsiness, severe headache, neck stiffness, seizures, limb weakness or new focal signs during or after shingles suggest <b>encephalitis, meningitis, myelitis or VZV vasculopathy</b> (stroke). Arrange same-day hospital assessment.", src:"Dworkin et al., Clin Infect Dis 2007 (international)"},
         {tone:"amber", h:"🟠 Pregnancy", html:"Maternal shingles is reactivation of latent VZV and is not generally associated with the fetal risks seen with primary chickenpox. Treat according to clinical severity and site; aciclovir can be used when clinically indicated. Do not use famciclovir routinely in pregnancy. Seek obstetric advice for severe, disseminated, ophthalmic or complicated disease. The mother is still infectious to susceptible people until the lesions have crusted.", src:"RCOG GTG 13 (2015)"},
         {tone:"amber", h:"🟠 Secondary bacterial infection", html:"Spreading redness, warmth, pus, honey-coloured crusting or fever. Treat as impetigo or cellulitis using the antimicrobial prescribing guidance in NICE NG153 (impetigo) and NICE NG141 (cellulitis). Swab if the picture is unclear or it is not responding.", src:"NICE NG153 (2020) · NICE NG141 (2019)"}
       ]},
       {b:"why", html:"Shingles is common and usually self-limiting, so it is easy to treat every case the same way. The serious outcomes cluster in a few groups: the eye (keratitis, uveitis, loss of vision), the facial nerve, the immunosuppressed patient whose infection spreads to skin and organs, and the older patient whose pain never settles. Asking about these first stops the routine case from hiding the dangerous one."}
     ]},

    {id:"confirm", nav:"Diagnose", title:"Is it zoster? Recognising the rash and its mimics", sub:"The diagnosis is clinical. Tests are reserved for the cases where the answer would change management.",
     blocks:[
       {b:"table", head:["Stage","What you see or hear","What it means"], rows:[
         ["<b>Prodrome</b>","Burning, tingling, itching or deep ache in one dermatome, often for 2–3 days before the rash. It may be mistaken for angina, renal colic, a disc problem or a dental abscess.","Consider shingles in unexplained one-sided pain in an older adult. Re-examine the skin in a day or two."],
         ["<b>Active rash</b>","Red papules become grouped clear blisters on a red base in one dermatome, stopping at the midline. A few scattered lesions outside the dermatome can occur.","The antiviral clock runs from <b>rash onset</b>, not from the start of the pain."],
         ["<b>Crusting</b>","Blisters turn cloudy, burst and crust, usually over 7–10 days.","Once all lesions are crusted, the patient is no longer infectious."],
         ["<b>Healing</b>","Crusts separate over 2–4 weeks, sometimes leaving scars or pigment change.","Pain beyond the rash is common. Pain lasting 90 days or more is post-herpetic neuralgia."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 When to swab", html:"Take a <b>viral PCR swab</b> (PCR is preferred) from the base of a fresh blister, not just dry crust, if the rash is atypical, crosses the midline, involves several dermatomes, occurs in an immunosuppressed patient, or could be herpes simplex. Do not wait for the result before starting treatment when an antiviral is indicated.", src:"Dworkin et al., Clin Infect Dis 2007 (international)"},
         {tone:"blue", h:"🔍 Look-alikes", html:"<b>Zosteriform herpes simplex</b> (recurs at the same site, often around the mouth, buttocks or genitals), contact dermatitis, insect bites, impetigo, early cellulitis and bullous skin disease. Recurrent 'shingles' in the same place is more often herpes simplex, so swab it.", src:"Dworkin et al., Clin Infect Dis 2007 (international)"},
         {tone:"amber", h:"🩸 Think about the immune system", html:"<b>Multidermatomal or recurrent herpes zoster</b> is listed as an <b>HIV indicator condition</b>. Offer a fourth-generation HIV test in younger adults, recurrent or multidermatomal zoster, severe zoster, or when other clinical or epidemiological features suggest HIV. Not every uncomplicated episode in an older adult needs an HIV test. Also consider other causes of immunosuppression, including blood cancers and drug treatment.", src:"BHIVA/BASHH/BIA adult HIV testing guidelines 2020"},
         {tone:"cream", h:"🧒 Children", html:"Shingles in children is usually mild. It is more common after chickenpox in early infancy or in the womb. Shingles in a young child with no such history, or severe disease, raises the question of immunosuppression. Seek paediatric advice rather than treating it as routine."}
       ]}
     ]},

    {id:"antiviral", nav:"Antiviral", title:"Who gets an antiviral, which one, and for how long", sub:"Antivirals shorten viral shedding and speed healing when started early. Their effect on post-herpetic neuralgia is modest. The indication depends on timing and risk.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Within 72 h", tone:"cream", title:"Treat if any of these apply", when:"rash started within the last 72 hours", fromLabel:"from rash onset",
          html:"Aged <b>over 50</b> · <b>immunosuppressed</b> · <b>non-truncal rash</b> (for example the neck, limbs or perineum) · <b>moderate or severe pain</b> · <b>moderate or severe rash</b> (confluent lesions). These are the NHS England Pharmacy First criteria, not a universal evidence threshold; also treat a high-risk site or clinical risk factor. In ophthalmic zoster, Ramsay Hunt syndrome, pregnancy, severe immunosuppression or atypical disease, follow the relevant specialist pathway (see Red flags)."},
         {step:"Up to 1 week", tone:"amber", title:"Still consider treatment if", when:"rash started 3–7 days ago", fromLabel:"later presentation",
          html:"Consider treatment if <b>new vesicles are still appearing</b> or there is <b>severe pain</b>, <b>significant rash</b>, <b>immunosuppression</b>, <b>ophthalmic or otic involvement</b> or a <b>high risk of complications</b>. Older age (70 or over) is a factor supporting clinical judgement, not an absolute indication. Ophthalmic zoster and Ramsay Hunt syndrome are treated whenever they present while active."},
         {step:"Otherwise", tone:"green", title:"No antiviral needed", when:"healthy adult under 50, mild truncal rash, or past the window", fromLabel:"explain why",
          html:"Offer analgesia and skin care, safety-net for eye or ear symptoms, and arrange review if the pain escalates. Once all lesions have crusted, the likely benefit of starting an antiviral is small, except after specialist discussion in complicated disease."}
       ]},
       {b:"table", head:["Drug","Dose for shingles in adults","Practical points"], rows:[
         ["<b>Aciclovir</b>","<b>800 mg five times daily</b> at about 4-hourly intervals, omitting the night-time dose, for <b>7 days</b>","Cheapest. Hard to take reliably. Renal adjustment for herpes zoster: creatinine clearance 10–25 mL/min, 800 mg three times daily; below 10 mL/min, 800 mg twice daily (SPC)."],
         ["<b>Valaciclovir</b>","<b>1 g three times daily</b> for <b>7 days</b>","A prodrug of aciclovir with better absorption. Immunosuppressed: 1 g three times daily for at least 7 days and for 2 days after the lesions crust (SPC). Reduce the dose in renal impairment (BNF)."],
         ["<b>Famciclovir</b>","<b>500 mg three times daily</b> for <b>7 days</b>","An alternative where adherence is a concern. Immunosuppressed patients may need a longer course: dose per BNF. Adjust in renal impairment (BNF). Do not prescribe automatically in pregnancy: use aciclovir or valaciclovir."]
       ]},
       {b:"warn", html:"<b>Neurotoxicity in renal impairment.</b> Aciclovir and valaciclovir are cleared by the kidneys. In older or dehydrated patients, or those with CKD, they can build up and cause confusion, hallucinations, agitation, tremor or drowsiness, which can be mistaken for encephalitis. Check creatinine or eGFR before prescribing where there is CKD, frailty, dehydration, older age or relevant comorbidity. Dose-adjust <b>all three agents</b> (aciclovir, valaciclovir and famciclovir) according to the current SPC or local formulary, and advise good fluid intake."},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"💊 What antivirals do and do not do", html:"In trials, starting within 72 hours shortened new lesion formation, viral shedding and time to healing, and reduced acute pain. The reduction in post-herpetic neuralgia is smaller and less consistent. This is why antivirals are aimed at people with a higher risk of complications rather than given to everyone.", src:"Dworkin et al., Clin Infect Dis 2007 (international)"},
         {tone:"cream", h:"🏪 Community pharmacy", html:"In England, adults aged 18 and over can be assessed and treated for shingles under the <b>Pharmacy First</b> clinical pathway, using the same criteria. Ophthalmic-division rash, known or suspected pregnancy and severe immunosuppression are outside the pharmacy PGD and are referred on: severely immunosuppressed patients, or immunosuppressed patients with a widespread rash or systemic illness, go urgently to A&amp;E.", src:"NHS England Pharmacy First shingles pathway and aciclovir PGD (v1.1, October 2025) · aciclovir SPC"},
         {tone:"amber", h:"🟠 Topical antivirals", html:"Topical aciclovir cream is licensed for cold sores (herpes simplex of the lips and face), not for shingles. It has no place in herpes zoster.", src:"Aciclovir cream SPC"},
         {tone:"blue", h:"🧾 Immunosuppressed but well", html:"For a well patient with localised disease, treat promptly with an oral antiviral, contact the specialist team, arrange close review, and keep a low threshold for hospital assessment if the rash spreads or systemic symptoms develop. Treating until all lesions have crusted is reasonable, but the duration should be specialist-led if the disease is extensive, progressive or visceral.", src:"Valaciclovir SPC · famciclovir SPC"}
       ]}
     ]},

    {id:"pain", nav:"Pain", title:"Pain now: the acute phase", sub:"Acute zoster pain can be severe, and severe acute pain is itself a risk factor for post-herpetic neuralgia. Treat it early and properly.",
     blocks:[
       {b:"table", head:["Pain","Option","Notes"], rows:[
         ["<b>Mild to moderate</b>","Regular paracetamol, with or without an NSAID if there is no contraindication","Regular dosing works better than taking it only when needed. Avoid NSAIDs in CKD, older or frail patients, peptic ulcer disease, anticoagulation or heart failure."],
         ["<b>Moderate to severe, nociceptive</b>","Consider a short course of codeine if appropriate","Keep it short and prescribe a laxative where appropriate. Avoid long repeat opioid prescriptions."],
         ["<b>Burning, shooting, electric or allodynic</b>","<b>Amitriptyline, duloxetine, gabapentin or pregabalin</b>","For clear neuropathic pain or allodynia. NICE CG173 applies principally to neuropathic pain management, not a specific acute-zoster protocol. Review renal function, falls risk, sedation and interactions first. Start low and titrate. Gabapentin and pregabalin need renal dose adjustment and are Class C controlled drugs, so counsel on misuse and dependence. Dose per BNF."],
         ["<b>Severe pain needing short-term rescue</b>","Tramadol, as acute rescue only","Short-term acute rescue only, not long-term treatment (NICE CG173). Watch for serotonin syndrome if combined with amitriptyline or duloxetine."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🟠 Oral steroids", html:"A 2013 Cochrane review found moderate-certainty evidence that oral corticosteroids given during acute zoster <b>do not prevent post-herpetic neuralgia</b>. The 2023 update judged the evidence very low certainty, neither supporting nor refuting their use. Do not prescribe systemic corticosteroids routinely to prevent post-herpetic neuralgia. Steroids may be considered in selected complicated presentations, such as Ramsay Hunt syndrome, only with specialist advice and alongside antiviral treatment where appropriate.", src:"Cochrane: Han 2013; Jiang 2023 (CD005582)"},
         {tone:"green", h:"✅ Skin care", html:"Keep the rash clean and dry, and wear loose cotton clothing. A cool compress can ease discomfort. A non-adherent dressing protects the rash and reduces spread. Avoid topical antibiotics and heavy creams on open blisters.", src:"Clinical practice; covering the rash per RCOG GTG 13 (2015)"}
       ]},
       {b:"warn", html:"<b>Renal dosing and interactions.</b> Prescribe a laxative with codeine where appropriate. Avoid NSAIDs in CKD, older or frail patients, peptic ulcer disease, anticoagulation or heart failure. Gabapentin and pregabalin need renal dose adjustment, as do all three antivirals. Review sedative burden and driving risk, and avoid combining serotonergic drugs (tramadol, amitriptyline, duloxetine) without considering serotonin-toxicity risk. Review older people early for falls, sedation and renal toxicity."},
       {b:"say", html:"Shingles pain can be a mix of ordinary soreness and nerve pain, which feels like burning, stabbing or electric shocks, or like the skin can't bear clothes touching it. Painkillers like paracetamol help the first kind but not the second. If it's the nerve type, there are tablets that work on the nerves. Getting on top of it early matters, because bad pain now makes long-lasting pain more likely."}
     ]},

    {id:"phn", nav:"PHN", title:"Post-herpetic neuralgia: when the pain outlasts the rash", sub:"The most common long-term complication. It is more likely with older age, severe acute pain, a severe rash, a painful prodrome and ophthalmic involvement.",
     blocks:[
       {b:"kv", rows:[
         ["Definition","Pain in the affected dermatome that persists <b>90 days or more</b> after the rash began. Some sources count pain beyond 30 days as subacute zoster pain."],
         ["Character","Constant burning or aching, paroxysmal shooting pain, and <b>allodynia</b> (light touch or clothing is painful). Itch can be prominent."],
         ["Course","Many cases improve over months. A minority, mostly older people, have pain for years, with a significant impact on sleep, mood and independence."],
         ["What to ask","Sleep, mood and suicidal thoughts, function and falls, and the pain's effect on appetite and weight in older people."]
       ]},
       {b:"ladder", steps:[
         {step:"First line", tone:"cream", title:"One oral neuropathic agent", when:"established PHN", fromLabel:"NICE CG173",
          html:"Offer a choice of <b>amitriptyline, duloxetine, gabapentin or pregabalin</b>. Choose by comorbidity, interactions, falls risk and preference. Amitriptyline is off-label for neuropathic pain, and needs caution in older people, heart disease and glaucoma. Gabapentin and pregabalin carry a risk of dependence and misuse, and need renal dose adjustment. Review early for benefit and side effects."},
         {step:"Switch", tone:"cream", title:"Try another of the four", when:"not effective or not tolerated", fromLabel:"do not stack blindly",
          html:"If the first drug does not work at a tolerated dose, offer one of the other three. Consider switching again if the second and third also fail. Combining neuropathic agents is not routine primary-care management and is usually a specialist decision."},
         {step:"Localised", tone:"green", title:"Topical options", when:"small area, or oral drugs unwanted", fromLabel:"on healed skin only",
          html:"NICE CG173 suggests considering <b>capsaicin cream</b> for localised neuropathic pain in people who wish to avoid oral treatment or cannot tolerate it. The 0.075% cream is licensed for PHN once the lesions have healed (SPC). <b>Lidocaine 5% medicated plasters</b> are licensed for PHN (SPC), but they are not among the CG173 recommended options. Use them only as your local formulary allows."},
         {step:"Refer", tone:"amber", title:"Specialist pain service", when:"severe or refractory pain", fromLabel:"do not escalate opioids",
          html:"Refer when pain is severe, limiting daily life or not controlled after trying the first-line options, or earlier if the patient is at risk (depression, falls, polypharmacy). Do not start long-term strong opioids in primary care for this pain."}
       ]},
       {b:"why", html:"PHN is a neuropathic pain, and nociceptive analgesics such as paracetamol and NSAIDs do little for it. The patients most at risk are often older adults on several medicines. They are exactly the group most likely to be harmed by sedating tricyclics, gabapentinoids and opioids, so doses need to start low, go up slowly and be reviewed on purpose."}
     ]},

    {id:"infect", nav:"Contacts", title:"Infectivity, contacts and post-exposure prophylaxis", sub:"Shingles cannot be caught from shingles. A person who has never had chickenpox can catch chickenpox from blister fluid.",
     blocks:[
       {b:"table", head:["Source of exposure","Infectious risk","Advice"], rows:[
         ["<b>Localised shingles on a covered site</b> (for example the chest) in an immunocompetent patient","<b>Low</b> when fully covered, but not zero","Infectious while vesicles are present; keep the rash covered until all lesions have crusted. Normal work and school are usually possible."],
         ["<b>Exposed site</b> (for example ophthalmic or facial shingles)","Treated as <b>infectious</b>, because shedding is greater and the rash is harder to cover","Avoid contact with susceptible pregnant women, newborns and immunosuppressed people until crusted."],
         ["<b>Disseminated shingles</b>, or shingles in an <b>immunosuppressed</b> patient","Disseminated disease is treated as <b>infectious</b>; an immunosuppressed patient may shed virus for longer","As above. Use infection-control precautions and seek specialist advice; in hospital, isolate a patient with disseminated disease."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🏫 School and work", html:"There is no need to exclude a child from school or nursery for shingles, unless the rash is weeping and cannot be covered. Healthcare workers with shingles should follow occupational health advice, particularly if they work with high-risk patients.", src:"UKHSA: Health protection in children and young people settings (exclusion table)"},
         {tone:"amber", h:"🤰 A pregnant contact", html:"If a pregnant woman has had a significant exposure to shingles and has <b>no reliable history of chickenpox</b>, check her <b>VZV IgG</b> urgently. She needs urgent assessment through the local virology, health protection or obstetric pathway; this is not a GP-led automatic prescription. Under current UKHSA PEP guidance, <b>oral antivirals are the first-choice prophylaxis</b> for non-immune contacts at any stage of pregnancy, replacing VZIG (aciclovir 800 mg four times daily from day 7 to day 14 after exposure). Check the exact regimen and timing with UKHSA or virology, particularly if the exposure was significant or immune status is uncertain.", src:"UKHSA VZV PEP guidance (Mar 2026) · RCOG GTG 13 (2015)"},
         {tone:"amber", h:"🛡️ An immunosuppressed contact", html:"Susceptible immunosuppressed contacts are offered antiviral prophylaxis, normally taken from day 7 to day 14 after exposure. Those with a VZV IgG of <b>150 mIU/mL or above</b> on a quantitative assay are unlikely to benefit. Arrange urgent assessment with the patient's specialist team, virology or health protection, determine VZV immunity where appropriate, and follow the current UKHSA PEP guidance for timing and antiviral choice.", src:"UKHSA VZV PEP guidance (Mar 2026)"},
         {tone:"red", h:"👶 A newborn contact", html:"A baby whose mother develops <b>chickenpox (not shingles)</b> from 7 days before to 7 days after delivery, or a neonate exposed to chickenpox or shingles in the first week of life, needs <b>same-day paediatric and virology advice</b>. Maternal shingles around delivery does not carry the same risk, because the baby has the mother's antibody. For these neonates, varicella immunoglobulin is still recommended, alongside antivirals for the highest-risk group. A neonate exposed around delivery or in the first week of life should not be managed solely through routine primary care.", src:"UKHSA VZV PEP guidance (Mar 2026)"}
       ]},
       {b:"say", html:"You can't give anyone shingles, but the fluid in the blisters can give chickenpox to someone who has never had it. Keep the rash covered until it has all scabbed over. Until then, keep away from anyone pregnant, newborn babies, and people whose immune system is weak. If you've been close to someone like that, let me know, because they may need tablets to protect them."}
     ]},

    {id:"special", nav:"Special groups", title:"Pregnancy, immunosuppression and older people", sub:"Groups where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Shingles in a pregnant woman", html:"Maternal shingles is reactivation of latent VZV and is not generally associated with the fetal risks seen with primary chickenpox. Treat according to clinical severity and site without waiting for obstetric review; aciclovir (or valaciclovir) can be used when clinically indicated, and famciclovir should not be prescribed automatically. Seek obstetric advice for severe, disseminated, ophthalmic or complicated disease. Aciclovir exposure in pregnancy has not been linked to an increase in malformations.", src:"RCOG GTG 13 (2015) · UKTIS aciclovir monograph"},
         {tone:"red", h:"🛡️ Severe immunosuppression", html:"Use the <a href='https://www.gov.uk/government/publications/shingles-herpes-zoster-the-green-book-chapter-28a'>Green Book chapter 28a definition</a> of severe immunosuppression rather than a short list. Low-dose stable corticosteroids are not necessarily sufficient; hydroxychloroquine alone is not severe immunosuppression; primary antibody deficiency alone is not necessarily an indication for early Shingrix unless associated with T-cell deficiency; rituximab, mycophenolate, combination therapy and recent chemotherapy need particular attention. The risk of dissemination, organ involvement and prolonged shedding is higher. Treat at any stage while the disease is active. Well with localised disease: oral antiviral, contact the specialist team and review closely. Disseminated, visceral, neurological or systemically unwell: same-day hospital assessment, where IV aciclovir may be given under the hospital protocol.", src:"Valaciclovir SPC · Green Book ch.28a (2025)"},
         {tone:"amber", h:"👵 Older people", html:"Older people have the highest risk of post-herpetic neuralgia and of antiviral neurotoxicity. Check eGFR before prescribing. Choose analgesics with falls, cognition and polypharmacy in mind. Review at 1–2 weeks rather than leaving the patient to come back.", src:"Aciclovir SPC · NICE CG173 (2013, updated 2020)"},
         {tone:"blue", h:"🧾 Renal impairment", html:"Check creatinine or eGFR before prescribing where there is CKD, frailty, dehydration, older age or relevant comorbidity. Adjust aciclovir, valaciclovir and famciclovir for creatinine clearance, using the current SPC or local formulary. Maintain hydration. Stop the drug and review if new confusion develops.", src:"Aciclovir SPC · BNF"}
       ]}
     ]},

    {id:"vaccine", nav:"Shingrix", title:"Prevention: the Shingrix programme", sub:"A recombinant adjuvanted vaccine given as two doses. It is non-live, so it can be given to immunosuppressed people.",
     blocks:[
       {b:"table", head:["Group","Eligibility","Second dose"], rows:[
         ["<b>Immunocompetent adults</b>","Current cohorts: those <b>turning 65 or 70</b> (programme from 1 September 2023); check the current Green Book and latest NHS England programme letter. Adults aged <b>70 to 79</b> who were eligible but missed it remain eligible until their <b>80th birthday</b>. Eligibility is being extended in phases towards everyone from age 60.","<b>6–12 months</b> after the first dose (a longer operational interval than the licensed minimum of 8 weeks)."],
         ["<b>Severely immunosuppressed adults</b>","All aged <b>18 and over</b> from <b>1 September 2025</b> (previously from age 50). There is no upper age limit. The Green Book chapter defines severe immunosuppression.","<b>8 weeks to 6 months</b> after the first dose, so protection builds quickly. The licensed minimum interval is 8 weeks; if the second dose is delayed, do not restart the course."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✅ After an episode of shingles", html:"A previous episode does not exclude anyone. Do not vaccinate during the acute illness; offer after recovery when symptoms have resolved. Shingrix is non-live, does not cause shingles, and is not used for treatment or post-exposure prophylaxis; a recent antiviral course is unlikely to reduce the response. Check the <b>current Green Book chapter</b> for how long to wait after an episode before the first dose, because the advice can differ by immune status. Vaccination reduces the chance of a further episode, which is more common in older and immunosuppressed people.", src:"Green Book ch.28a (2025)"},
         {tone:"blue", h:"💉 Zostavax", html:"The live vaccine, Zostavax, has not been used in the NHS programme since Shingrix replaced it for all cohorts from 1 September 2023. Someone who had Zostavax and later becomes severely immunosuppressed is offered two doses of Shingrix. For anyone else who had Zostavax, check the current Green Book chapter.", src:"UKHSA shingles programme letter (2023) · Green Book ch.28a (2025)"},
         {tone:"blue", h:"🔎 Where to check eligibility", html:"Eligibility has changed several times since 2023, and JCVI advised in November 2024 that the offer be extended to people aged 80 and over. Check whether this has been adopted in England. Routine cohorts are being phased towards age 60. Check the current <a href='https://www.gov.uk/government/publications/shingles-herpes-zoster-the-green-book-chapter-28a'><b>Green Book chapter 28a</b></a> and the latest UKHSA and NHS England programme letters rather than relying on memory.", src:"Green Book ch.28a (2025) · UKHSA programme letter (2025)"},
         {tone:"cream", h:"🩺 Practical", html:"Use the consultation about acute shingles to check eligibility. Plan the first dose for after recovery, timed as the Green Book advises, and put a recall in place for the second dose at the right interval for the patient's immune status. The licensed minimum interval is 8 weeks; the operational programme interval may be longer. If the second dose is delayed, do not restart the course.", src:"Green Book ch.28a (2025)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"Most patients stay in primary care. These do not.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day: hospital eye service", html:"Ophthalmic zoster with a red or painful eye, reduced vision, photophobia, corneal involvement or iritis. The College of Optometrists advises same-day GP antiviral treatment for suspected HZO, with mild cases co-managed and more severe ocular involvement referred to ophthalmology. Refer the same day for a red or painful eye, reduced vision, photophobia, corneal involvement, anterior uveitis/iritis, marked eyelid swelling, difficulty examining the eye, significant immunosuppression or diagnostic uncertainty. Hutchinson's sign is a risk marker that lowers the threshold; a quiet eye with no visual symptoms may be managed with urgent optometry or ophthalmology advice via the local pathway.", src:"College of Optometrists CMG: herpes zoster ophthalmicus"},
         {tone:"red", h:"Same day: ENT", html:"Ramsay Hunt syndrome: ear vesicles with a facial palsy, often with vertigo, tinnitus or hearing loss. Discuss with ENT or the acute specialist team the same day; protect the eye if it does not close.", src:"Cochrane: Uscategui 2008 (CD006851, CD006852)"},
         {tone:"red", h:"Same day: medical admission", html:"Disseminated or multidermatomal zoster · new lesions continuing rapidly despite oral treatment · systemic illness or visceral symptoms · severe immunosuppression with extensive disease · encephalitis, meningitis, myelitis or stroke features · unable to take oral antivirals or fluids, or concern about absorption or adherence. IV aciclovir, if needed, is hospital-based.", src:"Aciclovir SPC · Dworkin et al., Clin Infect Dis 2007 (international)"},
         {tone:"red", h:"Same day: paediatrics or virology", html:"A baby whose mother develops chickenpox (not shingles) from 7 days before to 7 days after delivery, or a neonate exposed to chickenpox or shingles in the first week of life.", src:"UKHSA VZV PEP guidance (Mar 2026)"},
         {tone:"amber", h:"Urgent: obstetrics or virology advice", html:"A pregnant woman with severe, disseminated, ophthalmic or complicated shingles (start treatment when indicated rather than waiting), or a susceptible pregnant contact needing urgent assessment for post-exposure prophylaxis under current UKHSA guidance.", src:"RCOG GTG 13 (2015) · UKHSA VZV PEP guidance (Mar 2026)"},
         {tone:"amber", h:"Routine: pain service", html:"Post-herpetic neuralgia that is not controlled after trying the NICE CG173 first-line options, or where treatment is limited by side effects or comorbidity.", src:"NICE CG173 (2013, updated 2020)"},
         {tone:"green", h:"Stays in primary care", html:"Uncomplicated shingles, with or without an antiviral, plus analgesia, contact advice, early review of pain and a Shingrix check.", src:"NHS England Pharmacy First shingles pathway and aciclovir PGD (v1.1, October 2025) · aciclovir SPC"}
       ]},
       {b:"say", html:"Most shingles settles over two to four weeks. There are three things I want you to watch for: your eye, your ear and face, and the rash spreading or you feeling very unwell. If your eye gets red or painful or your sight changes, if your face droops, or if you get a bad headache or feel confused, you need to be seen the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 74-year-old man with CKD stage 3b, on day 2 of a painful blistering rash over his left forehead and upper eyelid. He mentions a few spots on the tip of his nose. His wife is caring for their daughter, who is 30 weeks pregnant and has never had chickenpox.", src:"College of Optometrists CMG: herpes zoster ophthalmicus"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises <b>ophthalmic zoster with Hutchinson's sign</b>. Asks about vision, eye pain and photophobia, and arranges <b>same-day eye assessment</b> if there are eye signs. Starts an antiviral today with a <b>renally adjusted dose</b> and warns about confusion. Plans pain relief with <b>PHN risk</b> in mind. Explains infectivity and identifies the <b>pregnant, non-immune contact</b> who needs urgent VZV IgG and possible antiviral prophylaxis. Offers <b>Shingrix</b> after recovery if eligible. Safety-nets clearly.", src:"Green Book ch.28a (2025) · UKHSA VZV PEP guidance (Mar 2026) · aciclovir SPC"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>UKHSA — Shingles (herpes zoster): the Green Book, chapter 28a (updated August 2025)</b><br><a href="https://www.gov.uk/government/publications/shingles-herpes-zoster-the-green-book-chapter-28a" rel="noopener">gov.uk — Green Book chapter 28a</a><span class="rd"> — Shingrix schedule, second-dose intervals (licensed minimum 8 weeks), definition of severe immunosuppression, vaccination after recovery from an episode, phased move of routine cohorts towards age 60</span></li>'+
         '<li><b>UKHSA/NHS England — Shingles vaccination programme: expansion of Shingrix eligibility to all severely immunosuppressed adults aged 18 and over (letter, 2025)</b><br><a href="https://www.gov.uk/government/publications/expansion-of-shingrix-vaccine-eligibility-to-all-those-who-are-severely-immunosuppressed-and-aged-18-years-and-over-letter" rel="noopener">gov.uk — 2025 programme letter</a><span class="rd"> — eligibility from 1 September 2025, second dose 8 weeks to 6 months</span></li>'+
         '<li><b>UKHSA/NHS England — Shingles vaccination programme changes from September 2023 (letter)</b><br><a href="https://www.gov.uk/government/publications/shingles-vaccination-programme-changes-from-september-2023-letter" rel="noopener">gov.uk — 2023 programme letter</a><span class="rd"> — Shingrix replaces Zostavax, cohorts turning 65 and 70, phased move to age 60</span></li>'+
         '<li><b>UKHSA — Guidelines on post-exposure prophylaxis (PEP) for varicella or shingles (updated March 2026)</b><br><a href="https://www.gov.uk/government/publications/post-exposure-prophylaxis-for-chickenpox-and-shingles" rel="noopener">gov.uk — VZV PEP guidance</a><span class="rd"> — antivirals as first-choice PEP, day 7–14 timing, the 150 mIU/mL threshold, neonates</span></li>'+
         '<li><b>RCOG — Chickenpox in Pregnancy, Green-top Guideline No. 13 (January 2015)</b><br><a href="https://www.rcog.org.uk/guidance/browse-all-guidance/green-top-guidelines/chickenpox-in-pregnancy-green-top-guideline-no-13/" rel="noopener">rcog.org.uk — GTG 13</a><span class="rd"> — which zoster exposures count as infectious, pregnancy advice</span></li>'+
         '<li><b>UKHSA — Health protection in children and young people settings: exclusion table</b><br><a href="https://www.gov.uk/government/publications/health-protection-in-schools-and-other-childcare-facilities" rel="noopener">gov.uk — children and young people settings</a><span class="rd"> — no exclusion for shingles unless weeping and cannot be covered</span></li>'+
         '<li><b>NHS England — Pharmacy First: shingles clinical pathway (adults 18 and over)</b><br><a href="https://www.nhsbsa.nhs.uk/nhs-pharmacy-first-service-clinical-pathways-patient-group-directions-and-protocol" rel="noopener">nhsbsa.nhs.uk — Pharmacy First clinical pathways</a><span class="rd"> — the NHS England pathway 72-hour and one-week treatment criteria (not a universal evidence threshold)</span></li>'+
         '<li><b>College of Optometrists — Clinical Management Guideline: herpes zoster ophthalmicus</b><br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines/herpeszosterophthalmicus_hzo" rel="noopener">college-optometrists.org — HZO CMG</a><span class="rd"> — Hutchinson&#39;s sign as a risk marker, oral antiviral for ophthalmic zoster, referral urgency set by ocular symptoms and signs</span></li>'+
         '<li><b>NICE CG173 — Neuropathic pain in adults: pharmacological management in non-specialist settings (2013, updated 2020)</b><br><a href="https://www.nice.org.uk/guidance/cg173" rel="noopener">nice.org.uk/guidance/cg173</a><span class="rd"> — amitriptyline, duloxetine, gabapentin or pregabalin; switching; capsaicin cream; tramadol as rescue only (applies to neuropathic pain generally, not an acute-zoster protocol)</span></li>'+
         '<li><b>NICE NG153 — Impetigo: antimicrobial prescribing (2020)</b> and <b>NICE NG141 — Cellulitis and erysipelas: antimicrobial prescribing (2019)</b><br><a href="https://www.nice.org.uk/guidance/ng153" rel="noopener">nice.org.uk/guidance/ng153</a> · <a href="https://www.nice.org.uk/guidance/ng141" rel="noopener">nice.org.uk/guidance/ng141</a><span class="rd"> — secondary bacterial infection</span></li>'+
         '<li><b>BHIVA/BASHH/BIA — Adult HIV testing guidelines (2020)</b><br><a href="https://bhiva.org/clinical-guideline/hiv-testing-guidelines/" rel="noopener">bhiva.org — HIV testing 2020</a><span class="rd"> — multidermatomal or recurrent herpes zoster as an HIV indicator condition</span></li>'+
         '<li><b>SPCs — aciclovir 800 mg tablets, valaciclovir, famciclovir; BNF</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a> · <a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — zoster doses, renal adjustment, immunosuppressed courses</span></li>'+
         '<li><b>UKTIS — Use of aciclovir/valaciclovir in pregnancy</b><br><a href="https://uktis.org/monographs/use-of-aciclovir-in-pregnancy/" rel="noopener">uktis.org</a><span class="rd"> — no increased malformation risk</span></li>'+
         '<li><b>Dworkin RH et al. Recommendations for the management of herpes zoster. Clin Infect Dis 2007;44 Suppl 1:S1–S26</b> (international)<br><a href="https://academic.oup.com/cid/article-abstract/44/Supplement_1/S1/334966" rel="noopener">academic.oup.com — CID 2007</a><span class="rd"> — antiviral indications, PHN definition, diagnosis</span></li>'+
         '<li><b>Han Y et al. Corticosteroids for preventing postherpetic neuralgia. Cochrane Database Syst Rev 2013; updated Jiang X et al. 2023 (CD005582)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD005582.pub5/full" rel="noopener">cochranelibrary.com — CD005582</a><span class="rd"> — evidence that steroids prevent PHN remains insufficient; not for routine use</span></li>'+
         '<li><b>Uscategui T et al. Antiviral therapy for Ramsay Hunt syndrome (herpes zoster oticus with facial palsy) in adults. Cochrane Database Syst Rev 2008 (CD006851)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD006851.pub2/full" rel="noopener">cochranelibrary.com — CD006851</a><span class="rd"> — evidence for antivirals in Ramsay Hunt is limited</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Herpes zoster in primary care — aciclovir, valaciclovir and famciclovir SPCs and the BNF, UKHSA Green Book chapter 28a (2025), UKHSA VZV post-exposure prophylaxis guidance (updated March 2026), RCOG GTG 13 (2015), NHS England Pharmacy First shingles pathway, College of Optometrists HZO CMG and NICE CG173. Check every dose against the current BNF and adjust for renal function. Not a substitute for clinical judgement."
