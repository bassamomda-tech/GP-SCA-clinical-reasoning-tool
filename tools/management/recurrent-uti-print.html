  stemSub:"One page for the whole condition, from the first question to the 6-month review: confirm recurrence with cultures (2 or more in 6 months, or 3 or more in 12 months, NICE NG112), separate relapse from reinfection because they point to different causes, look for the structural or medical trigger — above all a significant post-void residual — decide who needs specialist referral, then work the prevention ladder in order, with vaginal oestrogen early in post-menopausal women and daily antibiotics last. Visible haematuria that persists or recurs after the infection has been treated is a suspected cancer referral at 45 and over (NICE NG12, updated April 2026).",

  meta:[
    {t:"NICE NG112 — recurrent UTI: antimicrobial prescribing (2018, updated 2024)"},

  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Sepsis · NG12 · structural</small></a><a href="#confirm"><b>Classify</b><small>Relapse vs reinfection</small></a><a href="#ddx"><b>Differentials</b><small>Is it really infection?</small></a><a href="#workup"><b>Investigate</b><small>PVR · USS · not ABU</small></a><a href="#ladder"><b>Prevent</b><small>Antibiotics last</small></a><a href="#monitor"><b>Monitor</b><small>6-month review</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"purple", h:"🟣 Haematuria and infection — the NG12 rule", html:"At 45 and over, <b>visible haematuria without a UTI, or visible haematuria that persists or recurs after the UTI has been successfully treated</b>, is a suspected cancer pathway referral for bladder and kidney cancer (NICE NG12, updated April 2026). So treat the infection, then <b>re-check the urine once it has cleared</b> — never let the antibiotic course close the question. At 60 and over, <b>recurrent or persistent unexplained UTI</b> is itself a reason to consider a non-urgent bladder cancer referral."},
    {tone:"amber", h:"Relapse and reinfection mean different things", html:"Relapse — the same organism returning within about 2 weeks of treatment — suggests inadequate treatment or a structural reservoir (stone, prostate, stricture, residual urine) and points towards imaging. Reinfection — a different organism, or a gap of more than about 2 weeks — suggests re-ascent from the periurethral and bowel flora, and is the usual pattern in women. Only cultures can tell you which."},
    {tone:"blue", h:"Scan the bladder — it takes 2 minutes", html:"A post-void residual under about 50 mL is normal and over about 100 mL is clinically significant in practice. Residual urine is a culture medium and undermines every other preventive step, so treat the cause — outflow obstruction, cystocoele, neurogenic bladder or dysfunctional voiding — before reaching for prophylaxis."},
    {tone:"green", h:"Vaginal oestrogen is the most underused step", html:"NICE NG112 asks you to consider vaginal oestrogen for post-menopausal women with recurrent UTI when behavioural measures are not enough, reviewing it within 12 months. In the landmark trial, estriol cream cut UTI episodes from 5.9 to 0.5 per patient-year (Raz and Stamm, NEJM 1993). With a history of breast cancer, NICE NG23 (2024) puts non-hormonal options first and asks for a discussion with the cancer specialist if the woman is on an aromatase inhibitor."},
    {tone:"blue", h:"Do not treat asymptomatic bacteriuria", html:"Men and non-pregnant women with asymptomatic bacteriuria should not be given antibiotics (NICE QS90, statement 3). A positive culture in an older person with confusion or falls but no urinary symptoms is not a diagnosis — look for the real cause. Pregnancy is the exception: bacteriuria is treated on the culture result (NICE NG109)."},
    {tone:"cream", h:"Methenamine before daily antibiotics", html:"NICE NG112 (updated 2024) lets you consider methenamine hippurate as an alternative to daily antibiotic prophylaxis once behavioural measures, vaginal oestrogen (where suitable) and single-dose prophylaxis have not helped enough — reviewed within 6 months, then every 12 months. The ALTAR trial found it non-inferior to daily antibiotics (Harding et al., BMJ 2022), and it selects no antibiotic resistance."}
  ],
  pathwaySub:"The whole consultation in six moves. The first step is where bladder cancers and septic patients are lost.",
  pathway:[
    {title:"Screen the emergencies and the cancer route", html:"<b>Sepsis, pyelonephritis in a vomiting or unwell patient, retention, cauda equina or cord symptoms</b> — and <b>visible haematuria at 45 and over that is not explained by a UTI or that outlasts it → suspected cancer referral (NG12)</b>. Men, and anyone with recurrent upper UTI, are always investigated.", alert:true},
    {title:"Confirm and classify", html:"<b>2 or more culture-supported UTIs in 6 months, or 3 or more in 12 months (NG112).</b> Then relapse versus reinfection from the organisms, and the host, structural, bacterial and drug factors behind them."},
    {title:"Check it really is infection", html:"Vaginal atrophy, STI urethritis, candidiasis, bladder pain syndrome, overactive bladder, stones and bladder cancer can all mimic cystitis — the negative cultures are the clue. See <a href='#ddx'>Differentials</a>."},
    {title:"Investigate for a treatable trigger", html:"MSU each episode with organism and sensitivities recorded, post-void residual, renal and bladder ultrasound where indicated, HbA1c, renal function. <b>Do not treat asymptomatic bacteriuria.</b> Refer men, recurrent upper UTI and unexplained recurrence in women (NG112)."},
    {title:"Work the prevention ladder in order", html:"Behavioural and hygiene measures → vaginal oestrogen if post-menopausal → methenamine or single-dose prophylaxis → daily antibiotic prophylaxis as the last rung. D-mannose and cranberry are patient choices with limited evidence."},
    {title:"Review with an exit plan", html:"Review any prophylaxis within 6 months: still needed, still working, any resistance on breakthrough cultures, can it stop? Nitrofurantoin long term needs respiratory and liver vigilance (MHRA, April 2023)."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — sepsis, malignancy and structural cause",
     sub:"Recurrent UTI means 2 or more episodes in 6 months or 3 or more in 12 months (NICE NG112). Before any prevention discussion, rule out the patient who needs to leave the room today or be referred on a cancer pathway.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["<b>UTI with fever, rigors, loin pain, tachycardia, hypotension or new confusion</b>","<b>Pyelonephritis with bacteraemia, or urosepsis</b>","<b>Assess with a structured sepsis tool (NICE NG253 for people 16 and over).</b> High-risk features → 999 / emergency admission. Pyelonephritis in someone vomiting, unable to take oral antibiotics or systemically unwell → hospital (NICE NG111)"],
         ["<b>Visible haematuria at 45 and over, with no UTI, or persisting or recurring after the UTI was successfully treated</b>","<b>Bladder or kidney cancer until proved otherwise</b>","<b>Suspected cancer pathway referral (2WW) — NICE NG12 (updated April 2026).</b> Record whether the haematuria cleared after treatment and re-test once the infection has resolved"],
         ["<b>Non-visible haematuria at 60 and over with dysuria or a raised white cell count</b>","<b>Bladder cancer</b>","<b>Suspected cancer pathway referral (NICE NG12)</b>"],
         ["<b>Recurrent or persistent unexplained UTI at 60 and over</b>","Bladder cancer presenting as infection","<b>Consider a non-urgent urology referral for bladder cancer (NICE NG12)</b>"],
         ["Recurrent UTI with new back pain, saddle anaesthesia, leg weakness or new incontinence","<b>Cauda equina or cord pathology — neurogenic bladder</b>","<b>Same-day emergency assessment and MRI</b>; the retention itself is a sepsis risk"],
         ["<b>Any UTI in a man, especially without a catheter or known cause</b>","Uncommon in men without an underlying cause — prostate, outflow obstruction, stone or stricture","Culture before treatment, consider STI testing, and <b>refer men with recurrent UTI to urology (NICE NG112)</b>"],
         ["Pyelonephritis in a person with diabetes not improving on antibiotics","<b>Emphysematous pyelonephritis or renal/perinephric abscess</b> — a surgical emergency","<b>Hospital, urgent cross-sectional imaging</b>"],
         ["<b>Recurrent UTI with poor stream, hesitancy, straining or a sense of incomplete emptying</b>","<b>Bladder outflow obstruction or retention</b> — BPH, stricture, cystocoele, neurogenic bladder","<b>Post-void residual; urology referral if significant.</b> Painful retention → same day"]
       ]},
       {b:"why", html:"The haematuria rule is the one this page exists to protect. NG12 is precise: for people aged 45 and over it asks for a suspected cancer referral when visible haematuria occurs <b>without</b> a UTI, <b>or</b> when it persists or recurs <b>after successful treatment</b> of the UTI. That wording deliberately lets you treat a genuine infection first — but only if you then check that the bleeding has stopped. The failure mode is haematuria attributed to infection, the antibiotic course finished, and no repeat test ever arranged. Bladder cancer can present as recurrent infection, which is why NG12 also asks you to consider a non-urgent referral for people aged 60 and over with recurrent or persistent unexplained UTI. A diabetic patient with pyelonephritis who is not getting better is the other trap: gas-forming infection and abscess need imaging and surgical input, not another antibiotic."},
       {b:"dl", rows:[
         ["<b>NG12 — the criteria that apply here</b>","<b>Suspected cancer pathway (2WW)</b>: aged 45 and over with unexplained visible haematuria without urinary tract infection, or visible haematuria that persists or recurs after successful treatment of urinary tract infection (bladder and kidney); aged 60 and over with unexplained non-visible haematuria and either dysuria or a raised white cell count (bladder). <b>Consider non-urgent referral</b>: aged 60 and over with recurrent or persistent unexplained urinary tract infection (bladder). Restated in <a href='#refer'>Refer</a>."]
       ]}
     ]},

    {id:"confirm", nav:"Classify", title:"Causes of recurrent UTI — and the relapse or reinfection split",
     sub:"Name the pattern and the driver before choosing any prevention.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Definition</b>","2 or more UTIs in 6 months, or 3 or more in 12 months (NICE NG112). Count only episodes with a convincing history and, ideally, a positive culture — a run of empirical prescriptions without cultures is not a diagnosis"],
         ["<b>Host factors</b>","Menopause (oestrogen loss → vaginal atrophy → fewer lactobacilli, higher pH → colonisation by gut organisms) · sexual intercourse (mechanical inoculation of the urethra) · spermicide use · low fluid intake and infrequent voiding · constipation · diabetes · a history of UTI in childhood or in the mother"],
         ["<b>Structural and functional</b>","Incomplete emptying (prostatic enlargement, urethral stricture, cystocoele, neurogenic bladder) · vesicoureteric reflux · stones — infection stones harbour bacteria that antibiotics cannot clear · colovesical fistula (pneumaturia, faecaluria, mixed bowel organisms — diverticular disease or Crohn's) · long-term catheter"],
         ["<b>Organism clues</b>","E. coli causes most episodes. Proteus mirabilis splits urea and alkalinises the urine, favouring struvite stones. Enterococci, mixed bowel flora or anaerobes raise the question of a fistula or a structural problem"],
         ["<b>Relapse or reinfection</b>","Relapse — the same organism within about 2 weeks of finishing treatment — means inadequate treatment or a persistent focus. Reinfection — a different organism, or a gap longer than about 2 weeks — means re-ascent and is the usual pattern in women"],
         ["<b>Drug-related</b>","SGLT2 inhibitors (glycosuria — genital and urinary infections are listed adverse effects in the SPCs) · immunosuppressants · anticholinergics or opioids that impair emptying"]
       ]},
       {b:"why", html:"<b>The relapse-versus-reinfection distinction decides whether you image.</b> A relapse suggests something is sheltering the organism — a stone, the prostate, a stricture or residual urine — so it warrants structural investigation and usually a specialist opinion. Reinfection with different organisms is re-ascent, the commonest pattern in women, and responds to the behavioural and hormonal measures further down the page. Two organism patterns deserve naming: a patient whose cultures repeatedly grow Proteus needs imaging for an infection stone, which antibiotics alone will not cure; and pneumaturia with mixed bowel organisms, typically in an older person with diverticular disease, means a colovesical fistula until CT says otherwise."}
     ]},

    {id:"ddx", nav:"Differentials", title:"Differential diagnosis — when recurrent cystitis is something else",
     sub:"Negative cultures during symptoms are the single most useful clue that the diagnosis is wrong.",
     blocks:[
       {b:"table", head:["Condition","Discriminating features","Next step"], rows:[
         ["<b>Genitourinary syndrome of menopause</b>","Post-menopausal; dryness, dyspareunia, frequency and dysuria with pale, thin mucosa; cultures often negative","Vaginal moisturiser or vaginal oestrogen (NICE NG23); still culture during flares"],
         ["<b>STI urethritis — chlamydia, gonorrhoea, Mycoplasma genitalium</b>","Sexually active, new partner, dysuria with discharge or intermenstrual bleeding; pyuria with sterile culture","NAAT testing per BASHH guidance; treat and partner-notify"],
         ["<b>Vulvovaginal candidiasis or herpes</b>","External dysuria (pain as urine touches inflamed skin), itch, discharge, ulcers","Examine; swab; see the <a href='recurrent-thrush.html'>recurrent thrush</a> protocol"],
         ["<b>Bladder pain syndrome / interstitial cystitis</b>","Pain related to bladder filling and relieved by voiding, persistent frequency, repeatedly negative cultures","Urology or urogynaecology; exclude carcinoma in situ first"],
         ["<b>Overactive bladder</b>","Urgency and frequency without dysuria or pyuria; bladder diary shows small frequent volumes","Bladder training; see female incontinence guidance"],
         ["<b>Bladder cancer or carcinoma in situ</b>","Aged 60 and over, smoker, occupational dye or rubber exposure; haematuria; irritative symptoms with sterile pyuria","<b>NG12 thresholds — see Red flags</b>; cystoscopy is a specialist test"],
         ["<b>Urinary stones</b>","Loin-to-groin pain, haematuria, Proteus on culture, relapse with the same organism","Imaging; urology"],
         ["<b>Colovesical fistula</b>","Pneumaturia, faecaluria, mixed bowel organisms, diverticular disease or Crohn's","CT abdomen and pelvis; surgical referral"],
         ["<b>Prostatitis (men)</b>","Perineal or rectal pain, fever, tender prostate, obstructive symptoms","Culture; treat as acute prostatitis (NICE NG110); urology if recurrent"],
         ["<b>Diabetes, new or poorly controlled</b>","Thirst, polyuria, weight loss, recurrent candidiasis alongside UTIs","HbA1c or glucose; optimise control"]
       ]}
     ]},

    {id:"workup", nav:"Investigate", title:"Assessment, investigations and what not to treat",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>History</b>","Number of episodes and the culture results (same organism = relapse; different = reinfection) · triggers, especially intercourse · fluid intake · voiding pattern (deferring, dribbling, straining, pneumaturia) · menopausal status and vaginal symptoms · sexual history and contraception (spermicide, diaphragm) · catheter · diabetes and SGLT2 inhibitors · previous imaging or cystoscopy · haematuria, and whether it cleared after treatment"],
         ["<b>Examination</b>","Temperature and observations if acutely unwell · loin and suprapubic tenderness · palpable bladder · in women, vaginal atrophy, cystocoele, urethral prolapse or caruncle · in men, a gentle rectal examination for prostatic size and tenderness (avoid vigorous examination if acute prostatitis is suspected) · neurological screen if emptying is poor"],
         ["<b>Urine</b>","MSU for culture with every episode, recording organism and sensitivities each time — this is the only way to see relapse, reinfection or emerging resistance · repeat urinalysis after an infection has been treated if blood was present"],
         ["<b>Bloods</b>","HbA1c · renal function (eGFR also decides whether nitrofurantoin is usable)"],
         ["<b>Imaging</b>","Renal and bladder ultrasound with post-void residual for men, relapse with the same organism, recurrent upper UTI, stones or obstruction suspected, haematuria, or when the cause is unknown. CT for suspected stones, fistula or complicated pyelonephritis"],
         ["<b>Post-void residual</b>","Under about 50 mL normal, 50–100 mL borderline, over about 100 mL clinically significant (practice thresholds). A bladder scan takes minutes and should be part of every recurrent-UTI assessment"],
         ["<b>Cystoscopy and cytology</b>","Specialist tests, arranged by urology for haematuria on NG12 criteria, men with recurrent UTI, or unexplained recurrence"],
         ["<b>Always investigate or refer further</b>","Any man with recurrent UTI · recurrent upper UTI · recurrent lower UTI in a woman when the cause is unknown (NICE NG112) · haematuria meeting NG12 · Proteus repeatedly (stone) · poor stream with UTI · pneumaturia · pyelonephritis not settling"]
       ]},
       {b:"warn", html:"<b>Do NOT give antibiotics for asymptomatic bacteriuria in men or non-pregnant women</b> (NICE QS90, statement 3; SIGN 160, 2020): it brings adverse effects and resistance without benefit. In older people, a positive culture with non-specific symptoms (confusion, falls, reduced intake) is not a UTI — look for the real cause. The exceptions are pregnancy (screen at booking and treat on the culture), before a urological procedure that breaches the mucosa, and specialist situations such as early after renal transplant, where the transplant team advises."},
       {b:"why", html:"Asymptomatic bacteriuria becomes more common with age and is very common in care homes and in people with long-term catheters. It is not a risk factor for harm, so screening and treating it only adds resistance, <i>C. difficile</i> risk and drug side effects. In pregnancy the balance flips: untreated bacteriuria is linked with pyelonephritis, so NICE NG109 asks for an antibiotic chosen on the culture result, with nitrofurantoin avoided at term and trimethoprim avoided in the first trimester."}
     ]},

    {id:"acute", nav:"Acute episode", title:"Treating the acute episode",
     sub:"Kept here because a back-up or self-start plan depends on it. The full acute pages are the <a href='uti-women.html'>UTI in women</a>, <a href='uti-men.html'>UTI in men</a> and <a href='uti-children.html'>UTI in children</a> protocols. Use the previous culture to choose, and check the local antibiogram.",
     blocks:[
       {b:"table", head:["Situation","Regimen (adult doses as stated in the guideline)"], rows:[
         ["<b>Lower UTI — non-pregnant women (NICE NG109)</b>","<b>Nitrofurantoin 100 mg modified-release twice daily for 3 days</b> if eGFR is 45 or more, <b>or trimethoprim 200 mg twice daily for 3 days</b> if the risk of resistance is low. Second choice: <b>pivmecillinam 400 mg initial dose then 200 mg three times daily for a total of 3 days</b>, or fosfomycin per NG109"],
         ["<b>Lower UTI — men (NICE NG109)</b>","<b>Trimethoprim 200 mg twice daily or nitrofurantoin 100 mg modified-release twice daily, for 7 days.</b> Culture before starting; consider STI testing and prostatitis"],
         ["<b>Lower UTI — pregnancy (NICE NG109)</b>","First choice <b>nitrofurantoin 100 mg modified-release twice daily for 7 days</b> (avoid at term). Second choice amoxicillin (only if culture-sensitive) or <b>cefalexin 500 mg twice daily for 7 days</b>. Culture before treatment. Trimethoprim is avoided in the first trimester"],
         ["<b>Acute pyelonephritis — adults well enough for oral treatment (NICE NG111)</b>","<b>Cefalexin 500 mg twice or three times daily for 7–10 days</b>; <b>co-amoxiclav 500/125 mg three times daily for 7–10 days</b> only if the culture shows sensitivity; <b>ciprofloxacin 500 mg twice daily for 7 days</b> with fluoroquinolone safety advice; trimethoprim 200 mg twice daily for 14 days only if sensitive. Culture first; hospital if vomiting, unable to take oral treatment or systemically unwell"],
         ["<b>Acute prostatitis (NICE NG110)</b>","<b>Ciprofloxacin 500 mg twice daily or ofloxacin 200 mg twice daily for 14 days, then review</b> — continue for a further 14 days or stop, depending on the assessment"]
       ]},
       {b:"why", html:"Nitrofurantoin works within the urine and reaches little systemic concentration, which makes it a good bladder drug but useless for the kidney; it is contraindicated in most people with an eGFR below 45 (MHRA). Trimethoprim resistance is common in many areas, which is why NG109 reserves it for people at low risk of resistance — the previous culture and the local antibiogram are the best guide. In recurrent UTI the last culture is usually the best predictor of the next organism's sensitivities, which is the practical reason to send an MSU every time."}
     ]},

    {id:"ladder", nav:"Prevent", title:"Prevention — in order, with daily antibiotics last",
     sub:"The order follows NICE NG112 (updated 2024). Every rung below daily antibiotics is worth exhausting first.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Everyone", title:"Behavioural and personal hygiene measures", when:"first, all patients", tone:"green",
          html:"Drink enough to keep the urine pale and void regularly through the day rather than deferring. Double-void (void, wait about 30 seconds, void again) where emptying is incomplete. Void soon after intercourse. Treat constipation actively. Avoid spermicide-containing contraceptives and consider an alternative to a diaphragm in a post-coital pattern. Wipe front to back; wash the vulva with water rather than perfumed products. These are low-cost, low-risk measures that NG112 asks you to discuss with everyone."},
         {step:"Post-menopausal", title:"Vaginal oestrogen", when:"behavioural measures not enough", tone:"cream",
          fromLabel:"before any antibiotic strategy",
          html:"Consider vaginal oestrogen (NICE NG112), reviewing within 12 months. Options include <b>estriol 0.01% cream, one applicatorful (0.5 mg estriol) daily for 2–3 weeks then twice weekly</b> (Gynest SPC), or <b>estradiol 10 microgram vaginal tablets daily for 2 weeks then twice weekly</b> (BNF). Raz and Stamm (NEJM 1993) found 0.5 versus 5.9 UTI episodes per patient-year with estriol against placebo. With a history of breast cancer, offer non-hormonal moisturisers and lubricants first and discuss vaginal oestrogen if they are not enough, involving the cancer specialist if she is on an aromatase inhibitor (NICE NG23, 2024)."},
         {step:"Single dose", title:"Single-dose antibiotic on exposure to a trigger", when:"clear trigger such as intercourse", tone:"cream",
          fromLabel:"minimal antibiotic exposure",
          html:"For a recognisable trigger, NG112 lets you consider a single dose taken after exposure: <b>trimethoprim 200 mg</b> (avoid in the first trimester of pregnancy), <b>nitrofurantoin 100 mg</b> (eGFR 45 or more), <b>amoxicillin 500 mg</b> or <b>cefalexin 500 mg</b>. Review within 6 months."},
         {step:"Non-antibiotic", title:"Methenamine hippurate", when:"measures above have not helped enough", tone:"cream",
          fromLabel:"no resistance selection",
          html:"NG112 (updated 2024): consider methenamine hippurate as an alternative to daily antibiotic prophylaxis in women, trans men and non-binary people with a female urinary system, reviewing within 6 months and then every 12 months. <b>Adult dose 1 g twice daily</b> (BNF). It works by releasing formaldehyde in acidic urine, so avoid urinary alkalinisers; it is contraindicated in severe renal or hepatic impairment, gout, severe dehydration and metabolic acidosis — check the BNF and SPC. Non-inferior to daily antibiotic prophylaxis in the ALTAR trial (Harding et al., BMJ 2022)."},
         {step:"Last resort", title:"Daily low-dose antibiotic prophylaxis", when:"all of the above have failed", tone:"amber",
          fromLabel:"with a review date",
          html:"NG112 choices: <b>trimethoprim 100 mg at night</b>, <b>nitrofurantoin 50–100 mg at night</b> (eGFR 45 or more), <b>amoxicillin 250 mg at night</b> or <b>cefalexin 125 mg at night</b>, chosen on previous cultures. Review within 6 months. Tell patients on long-term nitrofurantoin to report breathlessness, cough or jaundice, and follow local guidance on liver monitoring (MHRA, April 2023)."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🍬 D-mannose — patient choice", html:"NICE NG112 notes that some women try D-mannose and that the evidence is limited. The trial usually quoted (Kranjcec et al., World J Urol 2014) used 2 g daily in 200 mL of water in non-pregnant women and found fewer recurrences than no treatment. There are no trials in pregnancy, men or children, so do not present it as proven in those groups.", src:"NICE NG112 (2018); Kranjcec et al., World J Urol 2014"},
         {tone:"cream", h:"🍒 Cranberry — patient choice", html:"NG112 says some non-pregnant women may wish to try cranberry products, that the evidence of benefit is uncertain, and that there is none for older women. Warn about sugar content in juices, and about interactions (for example with warfarin).", src:"NICE NG112 (2018)"},
         {tone:"amber", h:"💊 On an SGLT2 inhibitor", html:"Genital and urinary infections are listed adverse effects of SGLT2 inhibitors. In someone with recurrent UTI on one, review the balance of benefit with the diabetes team rather than stopping it reflexively — the cardiorenal benefits may outweigh the infections.", src:"SGLT2 inhibitor SPC (for example dapagliflozin)"},
         {tone:"blue", h:"🧷 Long-term catheter", html:"Bacteriuria in a long-term catheter is expected and should not be treated unless the person is symptomatic. Keep closed drainage and good hydration, and consider intermittent self-catheterisation instead of an indwelling catheter where feasible.", src:"NICE QS90 (2015, updated 2023); NICE NG113 (2018)"},
         {tone:"cream", h:"📓 Bladder diary", html:"Voiding times and volumes, fluid intake, urgency and symptoms over 3 days. It separates overactive bladder and low intake from infection, and gives the specialist objective data.", src:"NICE NG123 (2019)"},
         {tone:"green", h:"🚿 Everyday habits, in the patient's words", html:"Drink enough that your urine is pale straw-coloured; do not hold on for hours; empty your bladder soon after sex; keep your bowels regular; use plain water rather than perfumed washes; choose a contraceptive without spermicide.", src:"NICE NG112 (2018)"}
       ]},
       {b:"why", html:"NG112 puts non-antibiotic steps first because every course of antibiotics selects resistance in the gut and urinary flora, and people with recurrent UTI accumulate a lot of courses. Vaginal oestrogen restores a lactobacillus-dominant, acidic vaginal environment that resists colonisation by bowel organisms — biologically coherent and supported by trial evidence, yet still not offered to many women because of misplaced breast-cancer anxiety; NG23 gives a clear route even for survivors. <b>Methenamine was added to NG112 in 2024</b> after the ALTAR trial, and is particularly useful where nitrofurantoin cannot be used (eGFR below 45), where organisms are multi-resistant, or where the patient simply wants to avoid long-term antibiotics. Single-dose prophylaxis around a clear trigger gives protection with a fraction of the antibiotic exposure of a nightly dose."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up and monitoring",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Any prophylaxis — review within 6 months (NG112)</b>","Number of episodes since starting, cultures from breakthrough infections (organism, sensitivities, emerging resistance), side effects, adherence. Is it still needed? Has vaginal oestrogen been tried where relevant? Can it stop, or step down to single-dose or methenamine?"],
         ["<b>Methenamine</b>","Review within 6 months, then every 12 months (NG112). Check renal function if it changes"],
         ["<b>Long-term nitrofurantoin</b>","Warn about breathlessness, cough, fever and jaundice; stop at once if new or worsening pulmonary symptoms appear; take pre-existing conditions and local guidance into account when scheduling liver monitoring (MHRA Drug Safety Update, April 2023). Recheck eGFR — it must stay at 45 or more"],
         ["<b>Long-term trimethoprim</b>","Blood counts on long-term therapy (BNF); watch potassium and renal function in older people and those on ACE inhibitors or ARBs"],
         ["<b>Vaginal oestrogen</b>","Review within 12 months (NG112), then as part of routine care. Any post-menopausal bleeding needs assessment under NICE NG12 (updated April 2026) — do not assume it is the cream"],
         ["<b>After structural investigation</b>","Results reviewed and actioned; structural problem treated before restarting prophylaxis; cystoscopy and cytology results documented"],
         ["<b>Treat the underlying cause</b>","Prostatic obstruction → see <a href='male-luts.html'>male LUTS</a> · cystocoele → urogynaecology · neurogenic bladder → intermittent self-catheterisation · dysfunctional voiding → pelvic floor physiotherapy and bladder retraining · stones → urology"]
       ]},
       {b:"warn", html:"<b>Nitrofurantoin lung and liver reactions:</b> acute pulmonary reactions tend to appear in the first week; chronic pulmonary fibrosis and hepatic reactions appear with long-term use, especially in older people. The MHRA (April 2023) asks prescribers to be alert, to warn patients what to look for, and to stop the drug immediately if pulmonary symptoms develop. That risk is one reason methenamine or a trigger-related single dose is often a better long-term option."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same-day / 999", html:"Fever with rigors, loin pain, vomiting, confusion or feeling very unwell → sepsis assessment and hospital · painful inability to pass urine → same day.", src:"NICE NG111 (2018); NICE NG253 (2025)"},
         {tone:"amber", h:"🟠 GP within 48 hours", html:"Not improving 48 hours into treatment → review the culture and sensitivities · new visible blood in the urine → re-test once the infection is treated and refer on the NG12 pathway if it persists · infections becoming more frequent despite prevention → specialist referral.", src:"NICE NG109 (2018); NICE NG12 (updated April 2026)"},
         {tone:"blue", h:"🔁 The 6-month question", html:"Is vaginal oestrogen in place where relevant? Has methenamine or single-dose prophylaxis been considered? Are the behavioural measures really happening? Can antibiotics be stepped down or stopped?", src:"NICE NG112 (2018, updated 2024)"},
         {tone:"green", h:"🩸 Blood in the urine", html:"“If you see blood in your urine, tell me even if you also have an infection. Once the infection is treated we'll check it has gone, and if it hasn't, you'll be seen quickly at the hospital.”", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"say", html:"Two things are worth being clear about. First, if you ever see blood in your urine, tell me even if you also have an infection. We'll treat the infection and then check the blood has gone — if it hasn't, I'll refer you for a bladder check quickly, because an infection can hide something else. Second, before we think about a daily antibiotic for months, there are steps that help without breeding resistance. If you're past the menopause, a small amount of oestrogen used in the vagina is one of the most effective, and very little of it reaches the rest of the body. There's also a non-antibiotic tablet called methenamine, and simple habits like emptying your bladder after sex. A nightly antibiotic is the last option, not the first, and if we do use one we'll review it within six months."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day", html:"Sepsis or pyelonephritis with vomiting or systemic illness · suspected emphysematous pyelonephritis or abscess · acute urinary retention · cauda equina symptoms.", src:"NICE NG111 (2018); NICE NG253 (2025)"},
         {tone:"purple", h:"2WW urology · NICE NG12 (updated April 2026)", html:"<b>Aged 45 and over with unexplained visible haematuria without UTI, or visible haematuria that persists or recurs after successful treatment of UTI.</b> Aged 60 and over with unexplained non-visible haematuria and either dysuria or a raised white cell count.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Urology — non-urgent bladder cancer referral to consider", html:"Aged 60 and over with recurrent or persistent unexplained UTI (NICE NG12).", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Urology — specialist advice", html:"<b>Men with recurrent UTI</b> · <b>recurrent upper UTI</b> · <b>recurrent lower UTI in women when the cause is unknown</b> (NICE NG112) · significant post-void residual · stones · outflow obstruction · relapse with the same organism · not controlled despite the prevention ladder.", src:"NICE NG112 (2018, updated 2024)"},
         {tone:"amber", h:"Pregnancy", html:"Recurrent UTI in pregnancy: seek specialist advice (NICE NG112).", src:"NICE NG112 (2018)"},
         {tone:"blue", h:"Urogynaecology", html:"Pelvic organ prolapse with incomplete emptying · urethral diverticulum or other anatomical concern · bladder pain syndrome.", src:"NICE NG123 (2019)"},
         {tone:"green", h:"Pelvic floor physiotherapy", html:"Voiding dysfunction without a structural cause · pelvic floor weakness · bladder retraining.", src:"NICE NG123 (2019)"},
         {tone:"cream", h:"GP management", html:"Cultures every episode, behavioural measures, vaginal oestrogen, single-dose or methenamine prophylaxis, daily prophylaxis with a 6-month review, and the post-treatment haematuria check.", src:"NICE NG112 (2018, updated 2024)"}
       ]},
       {b:"why", html:"NG112 names three groups for specialist advice: men with recurrent UTI, anyone with recurrent upper UTI, and women with recurrent lower UTI whose cause is unknown. Relapse with the same organism and a significant post-void residual both point to a structural focus, and <b>a large residual undermines every other preventive step</b> because bacteria multiply in stagnant urine — so treat the cause first. The NG12 thresholds sit separately: a cancer referral is not cancelled by a positive culture if the bleeding outlasts the infection."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 63-year-old woman with her fourth UTI this year asks for “something to stop them”. She mentions that with the last one her urine was pink for a day, which settled with the antibiotics; nobody re-tested it. She has vaginal dryness, holds her urine at work, and has never been offered oestrogen. She read online that she should take a daily antibiotic.", src:"NICE NG112 (2018, updated 2024); NICE NG12 (updated April 2026)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Picks up the haematuria and asks whether it has been re-checked since the infection cleared — arranges a repeat test and refers on the NG12 pathway if it persists, and notes that at 60 and over recurrent unexplained UTI is itself a reason to consider referral; confirms recurrence with <b>culture history and separates relapse from reinfection</b>; checks a <b>post-void residual</b>; offers <b>vaginal oestrogen</b> and deals with any breast-cancer worry using NG23; discusses <b>behavioural measures</b>, and <b>methenamine or single-dose prophylaxis before a daily antibiotic</b>; does not treat asymptomatic bacteriuria; and — the step candidates miss — sets a review within 6 months with an explicit exit plan.", src:"NICE NG112 (2018, updated 2024); NICE NG23 (2024)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG112 — Urinary tract infection (recurrent): antimicrobial prescribing (2018, updated 2024)</b><br><a href="https://www.nice.org.uk/guidance/ng112" rel="noopener">nice.org.uk/guidance/ng112</a><span class="rd"> — definition (2 in 6 months or 3 in 12 months), referral of men, recurrent upper UTI and unexplained recurrence in women, behavioural measures, vaginal oestrogen, methenamine hippurate (2024), D-mannose and cranberry evidence, single-dose and daily prophylaxis doses, review within 6 months</span></li>'+
         '<li><b>NICE NG109 — Urinary tract infection (lower): antimicrobial prescribing (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng109" rel="noopener">nice.org.uk/guidance/ng109</a><span class="rd"> — acute treatment in non-pregnant women, men and pregnancy, including pivmecillinam and cefalexin doses, and treatment of bacteriuria in pregnancy</span></li>'+
         '<li><b>NICE NG111 — Pyelonephritis (acute): antimicrobial prescribing (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng111" rel="noopener">nice.org.uk/guidance/ng111</a><span class="rd"> — oral options and durations, and when to send to hospital</span></li>'+
         '<li><b>NICE NG110 — Prostatitis (acute): antimicrobial prescribing (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng110" rel="noopener">nice.org.uk/guidance/ng110</a><span class="rd"> — 14 days then review</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — visible haematuria at 45 and over without UTI or persisting or recurring after successful treatment; non-visible haematuria at 60 and over with dysuria or raised white cell count; consider non-urgent referral at 60 and over with recurrent or persistent unexplained UTI</span></li>'+
         '<li><b>NICE QS90 — Urinary tract infections in adults (2015, updated 2023), statement 3</b><br><a href="https://www.nice.org.uk/guidance/qs90" rel="noopener">nice.org.uk/guidance/qs90</a><span class="rd"> — no antibiotics for asymptomatic bacteriuria in men and non-pregnant women</span></li>'+
         '<li><b>SIGN 160 — Management of suspected bacterial lower urinary tract infection in adult women (2020)</b><span class="rd"> — asymptomatic bacteriuria</span></li>'+
         '<li><b>NICE NG23 — Menopause: identification and management (updated 2024)</b><br><a href="https://www.nice.org.uk/guidance/ng23" rel="noopener">nice.org.uk/guidance/ng23</a><span class="rd"> — vaginal oestrogen after breast cancer</span></li>'+
         '<li><b>NICE NG253 — Suspected sepsis in people aged 16 or over (2025)</b><br><a href="https://www.nice.org.uk/guidance/ng253" rel="noopener">nice.org.uk/guidance/ng253</a></li>'+
         '<li><b>NICE NG123 — Urinary incontinence and pelvic organ prolapse in women (2019)</b> and <b>NICE NG113 — Urinary tract infection (catheter-associated): antimicrobial prescribing (2018)</b></li>'+
         '<li><b>MHRA Drug Safety Update — Nitrofurantoin: reminder of the risks of pulmonary and hepatic adverse drug reactions (April 2023)</b><br><a href="https://www.gov.uk/drug-safety-update/nitrofurantoin-reminder-of-the-risks-of-pulmonary-and-hepatic-adverse-drug-reactions" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — and the MHRA eGFR 45 contraindication</span></li>'+
         '<li>Raz R, Stamm WE. A controlled trial of intravaginal estriol in postmenopausal women with recurrent urinary tract infections. <em>NEJM</em> 1993<span class="rd"> — 0.5 versus 5.9 episodes per patient-year</span></li>'+
         '<li>Kranjčec B, Papeš D, Altarac S. D-mannose powder for prophylaxis of recurrent urinary tract infections in women. <em>World J Urol</em> 2014</li>'+
         '<li>Harding C et al. Alternative to prophylactic antibiotics for the treatment of recurrent urinary tract infections in women (ALTAR). <em>BMJ</em> 2022<span class="rd"> — methenamine non-inferior to daily antibiotic prophylaxis</span></li>'+
         '<li><b>BNF</b> and <b>Gynest 0.01% cream SPC</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — methenamine, estradiol vaginal tablet and estriol doses; trimethoprim monitoring; methenamine cautions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Recurrent urinary tract infection — NICE NG112 (updated 2024), NICE NG109, NICE NG111, NICE NG110, NICE NG12 (updated April 2026), NICE QS90, NICE NG23, MHRA Drug Safety Update (April 2023), Raz and Stamm NEJM 1993, the ALTAR trial (BMJ 2022) and the BNF. Visible haematuria that persists after the infection is treated is a suspected cancer referral at 45 and over. The acute episode is covered by the <a href=\"uti-women.html\">UTI in women</a>, <a href=\"uti-men.html\">UTI in men</a> and <a href=\"uti-children.html\">UTI in children</a> protocols. Verify all doses and local resistance data before prescribing."
