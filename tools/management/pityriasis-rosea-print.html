<script>
MG.render({
  icon:"🧴",
  title:"Pityriasis Rosea",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Pityriasis rosea — recognise the pattern, rule out syphilis, ask about pregnancy, then let it run its course",
  stemSub:"A self-limiting eruption of children and young adults, thought to be linked to reactivation of human herpesviruses 6 and 7. One larger scaly herald patch is followed days later by smaller oval patches along the skin lines of the trunk. The consultation has three jobs: be sure it is pityriasis rosea (secondary syphilis and tinea are the look-alikes that matter), ask whether the patient could be pregnant, and relieve itch while explaining that the rash will clear by itself within about three months. Sources: PCDS pityriasis rosea guidance · BAD patient information (June 2023) · BASHH syphilis guideline 2024 · Cochrane review 2019 · Drago et al. JAAD 2008 and 2014 · Manduca et al. 2025.",
  guideline:"PCDS pityriasis rosea clinical guidance · BAD patient information leaflet (June 2023) · BASHH UK syphilis guideline 2024 · Cochrane review (Contreras-Ruiz 2019)",
  meta:[
    {t:"PCDS clinical guidance · PCDS patient leaflet Dec 2023"},
    {t:"BAD patient information Jun 2023"},
    {t:"BASHH syphilis 2024 · secondary syphilis mimic"},
    {t:"Cochrane 2019 · interventions for pityriasis rosea"},
    {t:"Pregnancy: Drago JAAD 2008, 2014 · Manduca IJWD 2025"},
    {t:"No NG12 criterion applies"}
  ],
  lead:"<div class='mg-layers'><a href='#flags'><b>Red flags</b><small>Syphilis, pregnancy</small></a><a href='#recognise'><b>Recognise</b><small>Herald patch, fir-tree</small></a><a href='#treat'><b>Treat</b><small>Itch relief only</small></a><a href='#refer'><b>Refer</b><small>Rarely needed</small></a></div>",
  quickSub:"Five cards cover almost every consultation. Each point traces to a source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"The pattern", html:"A single <b>herald patch</b> — larger than what follows, typically 2–5 cm, bright pink-red with fine scale and a sharp edge — then a few days later many smaller oval pink patches with a fine inner collar of scale, lying along the skin creases of the trunk like the branches of a <b>fir tree</b>. Mild itch at most; the face, palms and soles are usually spared."},
    {tone:"amber", h:"Secondary syphilis is the look-alike that matters", html:"BASHH 2024: secondary syphilis produces a widespread rash (maculopapular in 50–70%) that <b>involves the palms and soles in 11–70%</b>, often with generalised lymphadenopathy, and usually does not itch. Palm or sole lesions, mouth or genital lesions, lymph nodes, systemic upset, no herald patch, or sexual risk → <b>syphilis serology</b>."},
    {tone:"amber", h:"Ask about pregnancy", html:"In small case series, pityriasis rosea starting in the <b>first 15 weeks of pregnancy</b> was associated with miscarriage (Drago, JAAD 2008). A 2025 review of 177 pregnant patients found unfavourable outcomes in 41% when onset was before 15 weeks, but a matched study found no increased risk. Tell the patient honestly, and let the midwife or obstetric team know."},
    {tone:"green", h:"It clears by itself", html:"No treatment changes the natural course. BAD: there is no need to treat the rash if it is not causing symptoms, and it clears within a few months. The Cochrane review describes a duration of 2–12 weeks. Pigment change can take longer to fade, particularly in darker skin."},
    {tone:"cream", h:"Treat only the itch", html:"PCDS: an emollient, or a mild to moderately potent topical steroid, if the rash is itchy. A sedating antihistamine at night if itch disturbs sleep (dose per BNF). Antivirals, antibiotics and phototherapy are not routine primary-care treatments."}
  ],
  pathwaySub:"Five steps. The first is the one that prevents harm.",
  pathway:[
    {title:"Exclude secondary syphilis", html:"Look at the palms, soles, mouth and genitals, and feel for lymph nodes. Ask about new sexual partners, genital sores in the last few months, fever or sore throat. If anything fits, or the pattern is atypical, request syphilis serology or refer to sexual health.", alert:true},
    {title:"Ask about pregnancy", html:"In anyone who could be pregnant, ask. Early-pregnancy pityriasis rosea is uncommon, but if it happens it should be discussed openly and the maternity team informed."},
    {title:"Confirm the pattern", html:"Herald patch, then oval patches with collarette scale along skin lines on the trunk and upper limbs. If the herald patch is the only lesion, scrape it for fungus before calling it anything. Ask about new medicines — some drugs cause a pityriasis rosea-like eruption."},
    {title:"Relieve itch and explain the course", html:"Emollient, mild topical steroid for itchy areas, lukewarm washing, soap substitute, and a sedating antihistamine at night if needed. Explain that it clears on its own, usually within about 12 weeks, and that marks may take longer to fade."},
    {title:"Plan follow-up", html:"Return if the rash is still present after about 3 months, spreads to the palms or soles, becomes blistered or very itchy, or the person feels unwell. Reconsider the diagnosis at that point."}
  ],
  sections:[
    {id:"flags", nav:"Red flags", title:"Red flags — when it may not be pityriasis rosea", sub:"Pityriasis rosea itself is harmless. The risk lies in missing the condition it resembles.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Palms, soles or mucosa involved", html:"Secondary syphilis commonly affects the palms and soles, and may cause mouth ulcers, split papules at the mouth corners, condylomata lata or patchy hair loss. Request syphilis serology and refer to sexual health.", src:"BASHH UK syphilis guideline 2024"},
         {tone:"amber", h:"Lymphadenopathy, fever or feeling unwell", html:"Generalised lymphadenopathy with a widespread rash suggests secondary syphilis, HIV seroconversion or another systemic infection rather than pityriasis rosea. Offer syphilis and HIV testing.", src:"BASHH UK syphilis guideline 2024"},
         {tone:"amber", h:"Pregnancy — especially under 15 weeks", html:"Small studies link onset in the first 15 weeks with miscarriage; larger matched data are reassuring. Discuss openly and inform the maternity team for closer follow-up. Keep a low threshold for syphilis serology — a negative booking screen does not exclude infection acquired later in pregnancy.", src:"BASHH syphilis in pregnancy and children guideline 2024 · Drago et al. 2008"},
         {tone:"amber", h:"No herald patch, confluent and very itchy, on a new drug", html:"A pityriasis rosea-like drug eruption tends to lack a herald patch and prodrome, and forms larger, more confluent, itchier patches. Review medicines started in the preceding weeks."},
         {tone:"blue", h:"Single patch only", html:"BAD notes that the herald patch can be confused with ringworm. In practice a skin scraping for fungal tests settles it; do not start a topical steroid on an undiagnosed annular patch.", src:"BAD pityriasis rosea leaflet (June 2023)"},
         {tone:"blue", h:"Persisting beyond about 3 months", html:"Consider guttate psoriasis, discoid eczema, pityriasis lichenoides chronica, a drug eruption, or rarely early mycosis fungoides in an adult. Dermatology if the diagnosis remains uncertain."},
         {tone:"blue", h:"NG12 — no criterion applies", html:"Pityriasis rosea does not map to any NICE NG12 suspected-cancer criterion, so there is no purple 2WW card on this page. A separate suspicious lesion found during the examination is assessed on its own merits.", src:"NICE NG12 (2015, last updated April 2026)"}
       ]},
       {b:"why", html:"Secondary syphilis is uncommon in general practice but rising in the UK, and it is easily treated once recognised — while missing it risks onward transmission, neurological and eye complications, and congenital syphilis if the patient is pregnant. Pityriasis rosea spares the palms and soles and has a herald patch; syphilis often involves the palms and soles and has none. When the picture is not textbook, a blood test costs little and the diagnosis is worth being sure of."}
     ]},

    {id:"recognise", nav:"Recognise", title:"Recognising pityriasis rosea", sub:"The diagnosis is clinical. The herald patch and the distribution make it.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Who</b>","Mainly children and young adults. PCDS describes it as an acute, self-limiting disease, probably infective in origin, with minimal constitutional symptoms."],
         ["<b>Prodrome</b>","Some people describe a mild viral-type illness — tiredness, headache, sore throat — before or around the time the rash appears."],
         ["<b>Herald patch</b>","The first lesion, usually on the trunk: larger than those that follow (about 2–5 cm), bright red with fine scale and a sharp border. It appears a few days, occasionally a few weeks, before the rest of the rash."],
         ["<b>Secondary eruption</b>","Many smaller oval dull-pink patches, some with a fine peripheral collar of scale, lying along the lines of cleavage parallel to the ribs — the ‘Christmas tree’ or ‘fir-tree’ pattern on the back. The upper arms and thighs may be involved; the face, palms and soles usually are not."],
         ["<b>Symptoms</b>","Often none; some itch, which can be worse after hot baths or exercise."],
         ["<b>Skin of colour</b>","Patches may look grey, violet or darker brown rather than pink, and more papular forms occur. Post-inflammatory pigment change is more noticeable and lasts longer."],
         ["<b>Variants</b>","Inverse pityriasis rosea affects the flexures (armpits, groin) rather than the trunk; papular, vesicular and purpuric forms occur, and occasionally there is more than one herald patch. Atypical forms need a lower threshold for testing."]
       ]},
       {b:"say", html:"This is pityriasis rosea. It’s a rash that usually starts with one larger patch and then spreads as smaller ones across the body. It’s thought to be triggered by a common virus most of us met as children. It isn’t serious, it doesn’t scar, and it goes away by itself."}
     ]},

    {id:"differential", nav:"Differentials", title:"Look-alikes and how to tell them apart", sub:"The two you must think about in every case are secondary syphilis and tinea.",
     blocks:[
       {b:"table", head:["Condition","Distinguishing features","Action"], rows:[
         ["<b>Secondary syphilis</b>","No herald patch; palms and soles often involved; mucosal lesions, lymphadenopathy, systemic symptoms; rash usually not itchy; history of a genital or oral sore weeks earlier","Syphilis serology; sexual health referral; offer HIV testing"],
         ["<b>Tinea corporis</b>","Fewer, larger annular patches with an active scaly edge; asymmetric; spreads outwards","Skin scraping for mycology; topical antifungal"],
         ["<b>Guttate psoriasis</b>","Small ‘raindrop’ scaly papules, thicker silvery scale; often 2–3 weeks after a streptococcal sore throat","Different management — see psoriasis"],
         ["<b>Drug eruption (pityriasis rosea-like)</b>","No herald patch or prodrome; larger, more confluent, itchier patches; recent new medicine","Review and, where possible, stop the drug"],
         ["<b>Discoid eczema</b>","Coin-shaped, very itchy, often crusted or weeping plaques, usually on the limbs","Emollient plus potent topical steroid"],
         ["<b>Pityriasis versicolor</b>","Fine scale on the upper trunk, pale or brown, no herald patch, recurrent in warm weather","Antifungal wash"],
         ["<b>Pityriasis lichenoides chronica</b>","Crops of small scaly papules lasting months, with a mica-like scale","Dermatology if suspected"]
       ]}
     ]},

    {id:"syphilis", nav:"Syphilis check", title:"Excluding secondary syphilis", sub:"A short, focused sexual history and a blood test when in doubt.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"When to test", html:"Palm or sole lesions; oral, genital or perianal lesions; generalised lymphadenopathy; patchy hair loss; fever or malaise; no identifiable herald patch; a new sexual partner or other sexual risk; or pregnancy. If in doubt, test — the rash of secondary syphilis can closely resemble pityriasis rosea on the trunk.", src:"BASHH UK syphilis guideline 2024 · PCDS pityriasis rosea guidance"},
         {tone:"blue", h:"What the rash of secondary syphilis looks like", html:"Maculopapular in 50–70%, papular in about 12%, macular in about 10%, occasionally ulceronodular. It may itch but usually does not. Palms and soles are affected in 11–70%, and hair follicles can be involved, causing alopecia.", src:"BASHH UK syphilis guideline 2024"},
         {tone:"blue", h:"Which test", html:"A treponemal antibody test (EIA or CLIA) is the usual screening test, with a non-treponemal test such as RPR used to stage and monitor. Use your local laboratory request.", src:"BASHH UK syphilis guideline 2024"},
         {tone:"cream", h:"Where to send them", html:"Refer to sexual health for confirmation, staging, treatment and partner notification, and offer a full screen including HIV. Partner notification should be discussed with everyone diagnosed.", src:"BASHH UK syphilis guideline 2024"}
       ]},
       {b:"say", html:"There’s one other rash that can look like this, which is caused by an infection called syphilis. It’s much less likely, but it’s treatable and important not to miss, so I’d like to do a simple blood test to be sure. We offer this to anyone with a rash like yours, it isn’t a judgement about you."}
     ]},

    {id:"pregnancy", nav:"Pregnancy", title:"Pityriasis rosea in pregnancy", sub:"The evidence is small, mixed and uncertain. Share that uncertainty honestly.",
     blocks:[
       {b:"table", head:["Study","What it found"], rows:[
         ["<b>Drago et al. J Am Acad Dermatol 2008</b>","38 women with pityriasis rosea in pregnancy: 13% miscarried overall, but the rate was 62% in those whose rash began in the first 15 weeks. HHV-6 was found in placental and fetal tissue in one case. The authors recommended closer follow-up when it develops in the first 15 weeks, particularly with atypical forms."],
         ["<b>Drago et al. J Am Acad Dermatol 2014</b>","61 women with pityriasis rosea in pregnancy; evidence of HHV-6 and HHV-7 reactivation in women who miscarried."],
         ["<b>Ong, White, Lipner. J Am Acad Dermatol 2024</b>","Retrospective matched study at a New York academic centre: no increased risk of birth complications or spontaneous abortion compared with matched controls."],
         ["<b>Manduca et al. Int J Womens Dermatol 2025 (review)</b>","11 studies, 177 patients: 81% favourable outcomes overall. Onset before 15 weeks: 41% unfavourable outcomes, including 27% spontaneous abortion."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"What to do", html:"Ask about pregnancy in anyone who could be pregnant. If pregnant, explain that the evidence is uncertain, inform the midwife or obstetric team so they can decide on follow-up, and have a low threshold for syphilis serology (routine antenatal screening does not exclude a new infection). Any antiviral treatment is a specialist decision.", src:"Drago et al. J Am Acad Dermatol 2008 · BASHH UK syphilis guideline 2024"},
         {tone:"green", h:"Keep it proportionate", html:"Most pregnancies affected by pityriasis rosea, especially after 15 weeks, have normal outcomes, and one matched study found no excess risk. Avoid alarming language; give the facts and a plan."}
       ]}
     ]},

    {id:"treat", nav:"Treatment", title:"Treatment — itch relief and reassurance", sub:"The rash settles on its own. Treatment is for comfort.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", when:"everyone", tone:"green", title:"Explain and reassure", html:"Self-limiting, not scarring, low risk of passing it on. No treatment is needed if it is not causing symptoms (BAD, June 2023)."},
         {step:"2", when:"dry or itchy skin", tone:"cream", title:"Emollient and gentle skin care", fromLabel:"if symptomatic", html:"An emollient applied as often as needed, used as a soap substitute; lukewarm rather than hot showers; loose cotton clothing. PCDS advises an emollient for itch or discomfort."},
         {step:"3", when:"itchy patches", tone:"cream", title:"Mild topical corticosteroid", fromLabel:"itch persists", html:"PCDS suggests an emollient or a mild to moderately potent topical steroid (for example hydrocortisone 1% or clobetasone butyrate 0.05%) for itchy areas, used for short periods. It eases itch but does not shorten the rash."},
         {step:"4", when:"sleep disturbed", tone:"cream", title:"Sedating antihistamine at night", fromLabel:"night itch", html:"Short course at bedtime, dose per BNF or BNFC. Warn about drowsiness the next morning."},
         {step:"5", when:"severe, extensive or prolonged", tone:"amber", title:"Specialist options", fromLabel:"uncommon", html:"The Cochrane review (2019, 14 trials, 761 participants) found low-certainty evidence that aciclovir may help rash and itch; macrolide antibiotics such as erythromycin are not recommended. Phototherapy is sometimes used by dermatologists. None of these is routine in primary care."}
       ]},
       {b:"warn", html:"The rash can look worse for a week or two before it settles, and new patches may keep appearing for a few weeks. Tell the patient this at the start so a crop of new patches does not feel like treatment failure."}
     ]},

    {id:"course", nav:"Course", title:"Natural course and follow-up", sub:"What to expect, and when to look again.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Day 0", title:"Herald patch", html:"One larger scaly patch, often mistaken for ringworm."},
         {n:"2", when:"Days to 2 weeks", title:"Secondary eruption", html:"Smaller oval patches appear over the trunk and upper limbs; further crops may follow for several weeks."},
         {n:"3", when:"Up to about 12 weeks", title:"Resolution", html:"Most rashes clear within 12 weeks (Cochrane: 2–12 weeks; PCDS patient leaflet: usually within 12 weeks). BAD: clears within a few months."},
         {n:"4", when:"Afterwards", title:"Colour change fades", html:"Pale or dark marks can persist for months, especially in darker skin, and fade without treatment."},
         {n:"5", when:"Still present after about 3 months", title:"Review the diagnosis", html:"Re-examine, test for syphilis if not already done, consider the look-alikes, and refer to dermatology if still uncertain."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Recurrence", html:"Most people have it only once; a second episode is uncommon."},
         {tone:"green", h:"School and work", html:"There is no need to stay off school or work. The risk of passing it on is very low.", src:"BAD pityriasis rosea leaflet (June 2023)"}
       ]},
       {b:"say", html:"It usually clears completely within about three months without any treatment. New spots can keep coming for a few weeks, and some marks may take a bit longer to fade. If it’s still there after three months, or you get spots on your palms or soles or in your mouth, or you feel unwell, come back and I’ll look again."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — rarely, and for a reason", sub:"Nearly all pityriasis rosea is managed in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Sexual health — suspected secondary syphilis", html:"Palm or sole involvement, mucosal lesions, lymphadenopathy, systemic symptoms, sexual risk, or reactive serology → sexual health for confirmation, treatment and partner notification.", src:"BASHH UK syphilis guideline 2024"},
         {tone:"amber", h:"Maternity team — pityriasis rosea in pregnancy", html:"Inform the midwife or obstetric team, particularly if onset is before 15 weeks, so they can plan follow-up."},
         {tone:"blue", h:"Dermatology — diagnostic uncertainty", html:"Atypical, extensive or blistering forms; rash persisting beyond about 3 months; severe symptoms not controlled with emollient, topical steroid and antihistamine; or doubt about an alternative diagnosis.", src:"PCDS pityriasis rosea guidance"},
         {tone:"blue", h:"No 2-week-wait pathway applies", html:"No NICE NG12 suspected-cancer criterion maps to pityriasis rosea, so there is no purple 2WW card on this page.", src:"NICE NG12 (2015, last updated April 2026)"},
         {tone:"green", h:"Manage in primary care", html:"Typical pityriasis rosea with syphilis excluded where indicated: reassurance, itch relief and a safety-net.", src:"PCDS pityriasis rosea guidance · BAD pityriasis rosea leaflet (June 2023)"}
       ]},
       {b:"say", html:"This doesn’t need a specialist. It will settle on its own, and we can make the itch easier in the meantime. The blood test is just to make sure we’re not missing something that looks similar. If anything changes — the rash on your hands or feet, sores in your mouth, feeling unwell, or it’s still there at three months — come back and we’ll take another look."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 26-year-old woman has a spreading rash on her back and chest for 10 days, which started with ‘a ringworm patch’ that did not respond to clotrimazole. She is worried it is contagious because she works in a nursery. On direct questioning she has a new partner, and her period is two weeks late.", src:"PCDS pityriasis rosea guidance · BAD leaflet (June 2023)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the herald patch and fir-tree distribution; examines the palms, soles and mouth and asks about lymph nodes; explains why syphilis serology is sensible, without judgement; asks about pregnancy and arranges a test; shares the uncertain early-pregnancy evidence honestly and involves the maternity team if pregnant; reassures about work; offers itch relief; safety-nets at 3 months.", src:"BASHH UK syphilis guideline 2024 · Drago et al. 2008"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:"<div class='card'><h3>Evidence panel</h3><ul class='evlist'>"+
         "<li><b>PCDS — Pityriasis rosea clinical guidance</b> (Primary Care Dermatology Society; web guidance, accessed September 2026) and <b>PCDS patient information leaflet (December 2023)</b><br><a href='https://www.pcds.org.uk/clinical-guidance/pityriasis-rosea' rel='noopener'>pcds.org.uk/clinical-guidance/pityriasis-rosea</a><span class='rd'> — herald patch 2–5 cm, collarette scale along cleavage lines, children and young adults, secondary syphilis as the key differential, emollient or mild to moderately potent topical steroid for itch, usually better within 12 weeks</span></li>"+
         "<li><b>BAD — Pityriasis rosea patient information leaflet</b> (updated June 2023)<br><a href='https://cdn.bad.org.uk/uploads/2021/12/19174051/Pityriasis-rosea-PIL-June-2023.pdf' rel='noopener'>bad.org.uk — pityriasis rosea leaflet</a><span class='rd'> — herald patch can be confused with ringworm, no need to treat if asymptomatic, clears within a few months, low risk of passing it on</span></li>"+
         "<li><b>BASHH UK guidelines for the management of syphilis 2024</b> (Kingston et al., Int J STD AIDS 2024)<br><a href='https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf' rel='noopener'>bashh.org — syphilis 2024</a><span class='rd'> — secondary syphilis rash types and frequencies, palm and sole involvement 11–70%, lymphadenopathy, serology</span></li>"+
         "<li><b>Contreras-Ruiz J et al. Interventions for pityriasis rosea.</b> Cochrane Database Syst Rev 2019, Issue 10 (CD005068.pub3)<br><a href='https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD005068.pub3/full' rel='noopener'>cochranelibrary.com — CD005068</a><span class='rd'> — 14 RCTs, 761 participants; duration 2–12 weeks; low-certainty evidence for aciclovir; macrolides not recommended</span></li>"+

         "<li><b>Drago F et al. Evidence of human herpesvirus-6 and -7 reactivation in miscarrying women with pityriasis rosea.</b> J Am Acad Dermatol 2014<br><a href='https://pubmed.ncbi.nlm.nih.gov/24947696/' rel='noopener'>pubmed.ncbi.nlm.nih.gov/24947696</a></li>"+
         "<li><b>Ong M, White H, Lipner SR. No increased risk of birth complications and spontaneous abortion in pregnant patients with pityriasis rosea compared to matched controls.</b> J Am Acad Dermatol 2024;90(1):168–170<br><a href='https://pubmed.ncbi.nlm.nih.gov/37714219/' rel='noopener'>pubmed.ncbi.nlm.nih.gov/37714219</a></li>"+
         "<li><b>Manduca S et al. The risks of pityriasis rosea in pregnancy: a review.</b> Int J Womens Dermatol 2025;11(1)<br><a href='https://pubmed.ncbi.nlm.nih.gov/39822983/' rel='noopener'>pubmed.ncbi.nlm.nih.gov/39822983</a><span class='rd'> — 11 studies, 177 patients; onset before 15 weeks 41% unfavourable, 27% spontaneous abortion</span></li>"+
         "<li><b>BASHH UK guidelines for the management of syphilis in pregnancy and children 2024</b> (Kingston et al., Int J STD AIDS 2024)<br><a href='https://pubmed.ncbi.nlm.nih.gov/39308221/' rel='noopener'>pubmed.ncbi.nlm.nih.gov/39308221</a><span class='rd'> — syphilis serology at booking for all, re-screening later in pregnancy offered</span></li>"+
         "<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, last updated April 2026)<br><a href='https://www.nice.org.uk/guidance/ng12' rel='noopener'>nice.org.uk/guidance/ng12</a><span class='rd'> — checked: no criterion applies to pityriasis rosea</span></li>"+
         "<li><b>BNF / BNFC</b><br><a href='https://bnf.nice.org.uk' rel='noopener'>bnf.nice.org.uk</a><span class='rd'> — topical steroid potency and sedating antihistamine doses</span></li>"+
         "</ul></div>"}
     ]}
  ],
  foot:"Pityriasis rosea in primary care — PCDS clinical guidance, BAD patient information (June 2023), BASHH UK syphilis guideline 2024, the Cochrane review of interventions (2019), and pregnancy data from Drago et al. (J Am Acad Dermatol 2008, 2014), Ong et al. (2024) and Manduca et al. (2025). Self-limiting; exclude secondary syphilis and ask about pregnancy."
});
