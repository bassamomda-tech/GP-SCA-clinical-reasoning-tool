<script>
MG.render({
  icon:"🫁",
  title:"Adult acute cough, CAP and COPD exacerbation in primary care — the complete guide",
  eyebrow:"Protocol · adults only · severity is the diagnosis that matters",
  stemTitle:"Naming it a \u201cchest infection\u201d is not a diagnosis — the decisive judgement is severity, and the elderly decompensate atypically with confusion rather than fever",
  stemSub:"One page for the whole condition group, <b>for adults only</b> — children need a separate paediatric pathway. Separate self-limiting viral bronchitis from pneumonia and from a COPD exacerbation using history, vital signs and examination — which help estimate, but cannot reliably exclude, pneumonia — stratify CAP with CRB-65 and clinical judgement while assessing for sepsis with structured observations, then treat across the spectrum — no or back-up antibiotic with real safety-netting for the uncomplicated, severity-guided antibiotics when indicated, oxygen to the right target (88–92% only if at risk of hypercapnic respiratory failure), and 999 transfer with a pre-alert for suspected sepsis. Then the part most often dropped: a selective 6-week chest X-ray after pneumonia for those at risk of underlying lung disease. Local pathways supersede this educational summary.",
  guideline:"NICE NG250 · NG120 · NG253 · NG115 · NG114 · NG12 · NHS Greater Manchester antimicrobial guidance",
  reviewed:"10 September 2026",
  nextReview:"10 March 2027",
  meta:[
    {t:"NICE NG250 (2025) — pneumonia diagnosis &amp; management"},
    {t:"NICE NG120 — acute cough · NG253 — sepsis"},
    {t:"NICE NG115 — COPD · NG114 — COPD exacerbation antimicrobials"},
    {t:"NG12: unexplained symptoms at 40+ → urgent CXR", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Sepsis first</b><small>Observations · CRB-65</small></a><a href="#confirm"><b>Which is it?</b><small>Bronchitis · CAP · COPD</small></a><a href="#workup"><b>Examine</b><small>Full obs · mimics</small></a><a href="#ladder"><b>Treat</b><small>Stewardship to transfer</small></a><a href="#monitor"><b>Follow up</b><small>Selective 6-week CXR</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Severity is the diagnosis, not the label", html:"<b>\u201cChest infection\u201d is not a formulation — grade it.</b> Sepsis features from a chest source: confusion, raised respiratory rate, hypotension, tachycardia, hypoxia, mottling, temperature extremes, reduced urine output. Take a structured set of observations and assess for clinical concern, organ dysfunction and alternative diagnoses. Use NEWS2 only if adopted within the local community/ambulance pathway — it is a risk-stratification aid, not a diagnostic test for sepsis, and a low NEWS2 or an apparently reassuring temperature does not exclude sepsis. Suspected high-risk sepsis is time-critical: call 999, arrange emergency transfer and pre-alert the receiving service. Oral antibiotics and home for a septic patient is the single worst outcome of this consultation."},
    {tone:"red", h:"CRB-65 stratifies CAP", html:"Confusion · Respiratory rate ≥30 · BP &lt;90 systolic or ≤60 diastolic · age ≥65. <b>Score 0: low risk — primary-care management may be appropriate with safety-netting. Score 1: intermediate risk — individualised decision: primary-care-led supported care, virtual ward, SDEC, hospital at home or hospital. Score 2: intermediate risk — consider hospital referral. Score 3–4: high risk — urgent hospital assessment/admission is usually required (NICE NG250).</b> Sepsis, cardiorespiratory failure, significant hypoxia or inability to take oral treatment → hospital assessment at any score. <b>CRB-65 is not an admission rule in isolation — use clinical judgement and read oxygen saturations alongside it</b> — CRB-65 does not include hypoxia, so a saturation of 90% matters even at a low score."},
    {tone:"amber", h:"The elderly present atypically and decompensate fastest", html:"The elderly, frail, immunosuppressed and those with comorbidity or lung disease may present with confusion, falls and no fever or classic focal signs. <b>Lower the threshold to examine, investigate and admit</b> — in this group the absence of fever is not reassurance, and new confusion is a presenting feature of pneumonia."},
    {tone:"blue", h:"Examination helps — but cannot exclude pneumonia", html:"History, vital signs and chest examination help estimate the likelihood of pneumonia but do not reliably exclude it. Focal chest signs, tachypnoea, hypoxia, fever and systemic illness increase concern; wheeze or scattered crackles may occur with acute bronchitis and do not establish pneumonia. In older, frail or immunosuppressed patients, pneumonia may occur without fever or classic focal signs. A remote assessment cannot safely exclude pneumonia, significant hypoxia or sepsis when the history suggests a potentially serious lower respiratory tract infection — arrange face-to-face assessment where severity or diagnosis is uncertain."},
    {tone:"green", h:"Don't reflex-prescribe — but do safety-net properly", html:"NICE NG120 supports no antibiotic or a back-up (delayed) prescription for uncomplicated acute cough and bronchitis, with clear safety-netting. Offer antibiotics once CAP is clinically diagnosed; for acute bronchitis, consider an immediate or back-up antibiotic only if the person is systemically very unwell or at higher risk of complications. Explain that an acute cough commonly lasts 3–4 weeks. Stewardship without a specific safety-net is not stewardship — it is under-treatment with no fallback."},
    {tone:"amber", h:"Selective 6-week chest X-ray after pneumonia", html:"Do not arrange a routine resolution chest X-ray for every patient. Consider one at about 6 weeks after discharge for those who smoke, are over 50, have persistent or deteriorating symptoms, unexplained weight loss or other risk factors for underlying respiratory disease — and record who arranges and reviews it. A follow-up film can identify persistent consolidation or other underlying lung pathology, but a normal film does not exclude lung cancer if suspicion remains. Assess persistent symptoms against the NG12 criteria rather than automatically using the lung-cancer pathway, and consider TB."}
  ],
  pathwaySub:"The whole consultation in five moves. The first one is not a diagnosis, it is a severity judgement.",
  pathway:[
    {title:"Screen for sepsis and grade severity", html:"Full observations: RR, oxygen saturation, HR, BP, temperature, consciousness. Assess clinical concern and organ dysfunction (NEWS2 only if locally adopted — not a diagnostic test). CRB-65 with clinical judgement if pneumonia is likely. Suspected high-risk sepsis, respiratory failure or high-risk CAP → 999 emergency transfer with a pre-alert; oxygen if indicated.", alert:true},
    {title:"Decide which of the three it is", html:"Bronchitis (usually clear chest, well) · pneumonia (focal signs, fever, tachypnoea, hypoxia, systemic upset — but a clear chest does not exclude it) · COPD exacerbation (acute worsening of breathlessness and/or cough and/or sputum from baseline). Consider the mimics — PE, heart failure, pneumothorax."},
    {title:"Examine, and take the persistent-symptom history", html:"<b>Chest examination is not optional.</b> Then: total cough duration, haemoptysis, weight loss, night sweats, smoking pack-years — the cancer and TB screen that outlasts the acute episode."},
    {title:"Treat to the severity", html:"Suspected high-risk sepsis → 999, pre-alert, oxygen if indicated; do not delay transfer. Low-severity CAP → amoxicillin 500 mg three times daily for 5 days (per local guidance); moderate/high severity → hospital or a formal supported-care pathway. COPD exacerbation → bronchodilators ± prednisolone 30 mg daily for 5 days ± antibiotics by sputum change and risk; rescue pack only for selected patients. Bronchitis → usually no antibiotic, or a back-up prescription."},
    {title:"Safety-net, follow up, prevent", html:"Specific warning signs with who to call · selective 6-week CXR after pneumonia (smokers, over 50, persistent symptoms, weight loss) · COPD and spirometry review · flu, pneumococcal and COVID vaccination · smoking cessation."}
  ],
  sections:[

    {id:"severe", nav:"Sepsis first", title:"Severity, sepsis and the admission decision",
     sub:"A chest infection can be the source of sepsis. Grade every presentation before treating it.",
     blocks:[
       {b:"table", head:["Finding","Meaning","Action"], rows:[
         ["New confusion, severe breathlessness, cyanosis, shock, raised respiratory rate, hypotension, tachycardia, marked hypoxia, mottling, very high or very low temperature, reduced urine output, or a rapidly deteriorating patient","<b>Possible sepsis from a chest source (NICE NG253), respiratory failure or other emergency</b> — time-critical; a low NEWS2 or normal temperature does not exclude sepsis","999/emergency transfer and pre-alert. Oxygen if indicated. Do not delay transfer for investigations or treatment; pre-hospital antibiotics or fluids only per the local ambulance/sepsis pathway"],
         ["<b>CRB-65 3–4</b>","<b>High-risk community-acquired pneumonia</b>","<b>Urgent hospital assessment/admission (NICE NG250)</b>"],
         ["<b>CRB-65 2</b>","<b>Intermediate risk with increased mortality risk</b>","<b>Consider hospital referral (NICE NG250)</b> — lower threshold with frailty, comorbidity or hypoxia; same-day admission if septic, hypoxic or clinically unwell"],
         ["<b>CRB-65 1</b>","<b>Intermediate risk</b>","<b>Individualised decision: primary-care-led supported care, virtual ward, SDEC, hospital at home or hospital (NICE NG250)</b> — weigh comorbidity, frailty, social support and oxygen saturation; a shared decision"],
         ["<b>CRB-65 0</b>, clinically stable, adequate oral intake and no major vulnerability","<b>Low-risk CAP</b>","Home management may be appropriate with safety-netting"],
         ["<b>CRB-65 0 but oxygen saturation 90–92% on air</b>","<b>CRB-65 does not include hypoxia</b>","<b>Do not be falsely reassured by a low score</b> — read saturations alongside it"],
         ["<b>New confusion or falls in an older patient with cough</b>","Atypical presentation of pneumonia — the elderly, frail, immunosuppressed and comorbid decompensate fastest and present without fever","<b>Lower the threshold to examine, investigate and admit</b>"],
         ["<b>Rising CO₂, drowsiness or headache on oxygen in someone at risk of hypercapnic respiratory failure</b>","<b>Type 2 respiratory failure</b>","<b>Target saturation 88–92%; urgent blood-gas assessment and admission</b>"],
         ["<b>COPD with purulent sputum, significant breathlessness or high-risk history</b>","Possible bacterial exacerbation","Consider antibiotics and prednisolone according to NICE/local pathway"],
         ["<b>Pneumonia not resolving, persistent or recurrent infection, weight loss, haemoptysis or abnormal CXR</b>","<b>Possible underlying disease — obstructing lesion, empyema, pleural effusion or bronchiectasis</b>","<b>Urgent CXR, respiratory pathway or NG12 as appropriate</b>"]
       ]},
       {b:"warn", html:"The failure mode of this consultation is a septic patient sent home with oral antibiotics because the label \u201cchest infection\u201d felt routine. Naming the infection is not the clinically decisive judgement — severity is. A 72-year-old with COPD and diabetes, confused, RR 28, saturations 90%, HR 112, BP 104/62 and reduced urine output has <b>CAP (CRB-65 2) with possible sepsis and hypoxia</b> — 999 transfer with a pre-alert — whatever the family expected when they arrived."},
       {b:"dl", rows:[
         ["<b>NG12 — the criterion that applies here</b>","Age 40 or over with unexplained haemoptysis: suspected lung-cancer pathway referral. Age 40 or over with persistent or recurrent chest infection: consider an urgent direct-access chest X-ray. Age 40 or over with two or more unexplained symptoms — cough, fatigue, breathlessness, chest pain, weight loss or appetite loss — or one of these if the person has ever smoked: urgent direct-access chest X-ray. Abnormal chest X-ray suggestive of lung cancer: suspected-cancer pathway referral. A cough persisting beyond 3 weeks does not automatically require the lung-cancer pathway — assess against the NG12 criteria with clinical judgement. Consider TB in parallel: cough of 3 weeks or more, fever, night sweats, weight loss, haemoptysis and risk factors. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"Which is it?", title:"Bronchitis, pneumonia, COPD exacerbation — and the mimics",
     blocks:[
       {b:"table", head:["Diagnosis","Discriminating features"], rows:[
         ["<b>Acute bronchitis</b>","Cough with or without sputum, systemically well — usually viral and self-limiting; wheeze or scattered crackles may occur and do not establish pneumonia. Cough commonly lasts 3–4 weeks; antibiotics shorten it by only about half a day on average"],
         ["<b>Community-acquired pneumonia</b>","<b>Focal chest signs, fever, tachypnoea, hypoxia, systemic upset.</b> A clear chest does not reliably exclude it — particularly in older, obese, dehydrated or immunosuppressed patients, in early disease, or with reduced air entry or poor examination conditions. Severity graded by <b>CRB-65</b> with clinical judgement"],
         ["<b>COPD exacerbation</b>","Acute worsening over several days of breathlessness and/or cough and/or sputum compared with the usual baseline, requiring a change in treatment. Many are non-bacterial. New focal chest signs, persistent fever, pleuritic pain, hypoxia, confusion, marked tachycardia or disproportionate breathlessness → consider pneumonia or another serious diagnosis rather than an uncomplicated exacerbation"],
         ["<b>Sepsis from a chest source</b>","Systemic dysfunction — confusion, hypotension, hypoxia, low urine output"],
         ["<b>Mimics to consider</b>","<b>Pulmonary embolism</b> (pleuritic pain, risk factors) · <b>heart failure</b> (orthopnoea, oedema) · <b>lung cancer or TB</b> (persistent symptoms) · <b>pneumothorax</b>"]
       ]},
       {b:"why", html:"The distinction drives treatment intensity. History, vital signs and chest examination together help estimate the likelihood of pneumonia but do not reliably exclude it. A dry cough in a systemically well patient with a clear chest is usually viral bronchitis and needs stewardship; focal signs with fever, tachypnoea and systemic upset are pneumonia and need active treatment; an acute worsening from baseline in COPD is an exacerbation with its own management — first exclude pneumonia, pulmonary embolism, heart failure and pneumothorax. In COPD, have a lower threshold throughout, ensure a written self-management plan is in place, and consider a rescue pack only for selected patients."}
     ]},

    {id:"workup", nav:"Examine", title:"Examination, observations and the persistent-symptom screen",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Full observations — narrate them</b>","Respiratory rate, oxygen saturation, heart rate, blood pressure, temperature, level of consciousness. These are the severity assessment; a consultation without them cannot grade the illness"],
         ["<b>Chest examination</b>","Focal crackles or consolidation versus a clear chest — this helps estimate the likelihood of pneumonia but does not reliably exclude it; wheeze or scattered crackles can occur in acute bronchitis. Wheeze in COPD exacerbation"],
         ["<b>Severity scoring</b>","<b>CRB-65 with clinical judgement for CAP; structured observations and clinical concern for sepsis</b> — NEWS2 only if adopted within the local community/ambulance pathway; it is not a diagnostic test for sepsis"],
         ["<b>Baseline and vulnerability</b>","Usual health and function, COPD, diabetes, other comorbidity, immunosuppression, frailty, and how far this represents deterioration from baseline. Vaccination status (flu, pneumococcal, COVID)"],
         ["<b>Persistent-symptom screen</b>","Total duration of cough, haemoptysis, fever, weight loss, night sweats, smoking history in pack-years — the cancer and TB screen. TB risk: previous TB, country of birth and travel, homelessness, overcrowded accommodation, imprisonment, healthcare exposure and immunosuppression"],
         ["<b>Investigations</b>","Chest X-ray where pneumonia is suspected and the diagnosis or severity is uncertain, for non-resolving symptoms, and as a selective 6-week follow-up film. CRP is not routinely required for pneumonia assessment in primary care. If, after clinical assessment, pneumonia has not been diagnosed but it remains unclear whether an antibiotic is indicated for an acute lower respiratory tract infection, consider point-of-care CRP where available (NICE NG250): &lt;20 mg/L do not routinely offer antibiotics, 20–100 mg/L consider a delayed/back-up prescription, &gt;100 mg/L offer an antibiotic — these thresholds do not rule out pneumonia or sepsis and must not override clinical judgement, hypoxia, confusion, respiratory failure or rapid deterioration; if septic, blood cultures and other tests follow the local sepsis pathway in hospital — do not delay transfer for investigations"]
       ]},
       {b:"say", html:"I can see you were hoping for antibiotics, and I understand why. But your dad is more unwell than a chest infection we would treat at home — he is confused, and his breathing and his oxygen are affected. That combination needs hospital assessment today rather than tablets. You did exactly the right thing bringing him in; the confusion is the part that tells me this is serious, and I am glad you noticed it. I am arranging an ambulance now, I will call ahead so they are expecting him, and I will give him some oxygen while we wait."}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment across the spectrum",
     blocks:[
       {b:"table", head:["Situation","Management"], rows:[
         ["<b>Sepsis or severe CAP</b>","Call 999, arrange emergency transfer and pre-alert the receiving service. Give oxygen if indicated, targeting 94–98% unless the person is at risk of hypercapnic respiratory failure, in which case target 88–92%. Do not delay transfer for routine investigations. Give pre-hospital antibiotics or fluids only where this is supported by the local ambulance/sepsis pathway, transfer is substantially delayed, and the clinician is trained and equipped to do so — fluids need caution in heart failure, renal failure, frailty, pulmonary oedema and severe hypoxia. AKI and glucose derangement are assessed in hospital"],
         ["<b>CAP — antibiotics</b>","Offer antibiotics once a clinical diagnosis of CAP is made. Low-severity CAP suitable for home treatment: amoxicillin 500 mg three times daily for 5 days, orally if the person can take oral medication and does not need IV therapy. If penicillin-allergic or amoxicillin unsuitable: doxycycline 200 mg on day 1 then 100 mg once daily for 4 further days, or clarithromycin, per the current NICE/local antimicrobial guideline. Stop at 5 days if clinically stable; review if worsening or not improving as expected. Do not manage moderate/high-severity CAP at home solely with oral antibiotics unless part of a formal supported-care pathway (hospital at home, virtual ward or SDEC) with senior advice — high-severity CAP needs urgent hospital assessment and hospital antimicrobial therapy (NICE NG250). This page covers adults only"],
         ["<b>COPD exacerbation</b>","First exclude pneumonia, pulmonary embolism, heart failure and pneumothorax. Increase bronchodilators. Consider prednisolone 30 mg once daily for 5 days when increased breathlessness interferes with usual activities, unless contraindicated (NICE NG115). Consider antibiotics after assessing sputum colour change/purulence, increased volume or thickness, severity, risk of complications, previous exacerbations or admissions, previous sputum cultures and recent antibiotic exposure — many exacerbations are non-bacterial. Adult regimens (NICE NG114): amoxicillin 500 mg three times daily for 5 days; doxycycline 200 mg on day 1 then 100 mg once daily for a total of 5 days; or clarithromycin 500 mg twice daily for 5 days — subject to allergy, pregnancy, interactions, severity and local guidance. Consider a rescue pack only for selected patients at risk of exacerbations who can recognise deterioration, understand the written action plan and will notify the practice after use — not issued automatically or as a substitute for review; in Greater Manchester, suitable patients normally receive steroids alone, with antibiotics only on clinical need"],
         ["<b>Oxygen</b>","Give oxygen to patients who are hypoxic or clinically unstable. Target 94–98% in most adults. Initially target 88–92% in people at risk of hypercapnic respiratory failure, including previous hypercapnic respiratory failure, oxygen-related hypercapnia or severe COPD where this is clinically suspected — not every person with COPD. Arrange urgent blood-gas assessment if hypercapnic respiratory failure is possible"],
         ["<b>Acute bronchitis — stewardship</b>","<b>No antibiotic, or a back-up (delayed) prescription (NICE NG120).</b> Self-care: fluids, analgesia, rest. Explain the natural history — an acute cough commonly lasts 3–4 weeks; antibiotics do not improve the overall clinical condition in uncomplicated acute bronchitis and shorten cough by only about half a day on average. Consider an immediate or back-up antibiotic only if systemically very unwell or at higher risk of complications (NICE NG120)"],
         ["<b>Safety-netting — specific, not generic</b>","Seek help for rapid deterioration, new breathlessness, confusion, persistent fever, poor intake, or failure to improve by 3–4 weeks — with <b>when to act and who to call</b>"],
         ["<b>Prevention</b>","Flu, pneumococcal and COVID vaccination; smoking cessation; COPD optimisation"]
       ]},
       {b:"why", html:"Most acute cough and bronchitis is viral, and antibiotic stewardship is a clinical intervention rather than a rationing exercise — reducing resistance while keeping the patient safe. But NICE NG120 pairs the no-antibiotic or delayed-prescription approach with clear safety-netting, and the two are not separable: withholding an antibiotic without telling the patient exactly what to watch for and who to contact is not stewardship. Equally, stewardship must not be applied dismissively — a patient who feels fobbed off will simply attend elsewhere, so the explanation of why antibiotics may not help is part of the treatment."},
       {b:"say", html:"For a cough like yours the evidence is that antibiotics make very little difference — most of these infections are viral, and the cough itself commonly takes 3 to 4 weeks to settle even when everything is healing normally. So I am not going to start antibiotics today, but I am not simply sending you away either. I will give you a prescription to keep at home and only use it if things change — and this is what I want you to watch for: getting breathless, feeling confused or muddled, a fever that will not settle, or simply getting worse rather than slowly better. If any of that happens, use the prescription and contact us the same day."}
     ]},

    {id:"monitor", nav:"Follow up", title:"Follow-up, the resolution CXR and prevention",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Follow-up chest X-ray — selective</b>","Do not arrange a routine resolution chest X-ray for every patient. Consider a chest X-ray at approximately 6 weeks after discharge for patients who smoke, are aged over 50, have persistent or deteriorating symptoms, unexplained weight loss or other risk factors for underlying respiratory disease. Record who is responsible for arranging and reviewing the result. A normal film does not exclude lung cancer if clinical suspicion remains"],
         ["<b>Non-resolving or recurrent same-site infection</b>","<b>Safety-net explicitly for it, and investigate</b> — CXR plus respiratory referral"],
         ["<b>Recovery review</b>","Confirm symptom resolution, review COPD control and spirometry, and reassess inhaler technique and the self-management plan"],
         ["<b>Prevention</b>","Flu, pneumococcal and COVID vaccination; smoking cessation support; COPD optimisation. Protect the vulnerable — the elderly, frail, immunosuppressed, comorbid and the very young"],
         ["<b>Persistent symptoms</b>","Assess against the NG12 criteria (see the lung cancer card) — a cough beyond 3 weeks does not automatically mean the lung-cancer pathway. Consider TB with cough of 3 weeks or more, fever, night sweats, weight loss or haemoptysis"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 / same-day", html:"Suspected sepsis · high-risk CAP (CRB-65 3–4), or CRB-65 2 with concern · respiratory failure · new confusion in an older patient with cough — 999 transfer with a pre-alert."},
         {tone:"amber", h:"🟠 Same-day review", html:"Not improving or worsening on treatment · new breathlessness · persistent fever · poor oral intake."},
         {tone:"purple", h:"🟣 Lung cancer · NG12", html:"Unexplained haemoptysis at 40 and over, or chest X-ray findings suggesting lung cancer → suspected cancer pathway referral. At 40 and over, two or more unexplained symptoms — cough, fatigue, breathlessness, chest pain, weight loss or appetite loss — or one if ever smoked → urgent direct-access chest X-ray (within 2 weeks). Consider an urgent chest X-ray for persistent or recurrent chest infection, finger clubbing, supraclavicular or persistent cervical lymphadenopathy, chest signs consistent with lung cancer, or thrombocytosis. Follow an abnormal or non-resolving CXR to resolution — particularly in a smoker aged 40 or over."},
         {tone:"green", h:"📋 Don't drop the follow-up", html:"A selective 6-week chest X-ray after pneumonia — smokers, over 50, persistent or deteriorating symptoms, unexplained weight loss — is the step most often forgotten; record who arranges and reviews it. A normal film does not exclude lung cancer if suspicion remains."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency admission", html:"Suspected sepsis, high-risk CAP (CRB-65 3–4), respiratory failure, or an alternative emergency diagnosis. 999/emergency transfer with a pre-alert call; oxygen if indicated, to the correct target; do not delay transfer for investigations or treatment."},
         {tone:"purple", h:"Lung cancer · NICE NG12", html:"Unexplained haemoptysis at 40 and over, or chest X-ray findings suggesting lung cancer → suspected cancer pathway referral. At 40 and over, two or more unexplained symptoms — cough, fatigue, breathlessness, chest pain, weight loss or appetite loss — or one if ever smoked → urgent direct-access chest X-ray (within 2 weeks). Consider an urgent chest X-ray for persistent or recurrent chest infection, finger clubbing, supraclavicular or persistent cervical lymphadenopathy, chest signs consistent with lung cancer, or thrombocytosis. A persistent cough alone does not automatically mean the lung-cancer pathway. Follow an abnormal or non-resolving chest X-ray to resolution, especially in a smoker aged 40 or over."},
         {tone:"amber", h:"TB service — urgent", html:"Suspected TB: cough of 3 weeks or more, fever, night sweats, weight loss, haemoptysis. Ask about previous TB, country of birth and travel, homelessness, overcrowded accommodation, imprisonment, healthcare exposure and immunosuppression. Seek urgent advice from the local respiratory/TB service; avoid unnecessary exposure of other patients in the waiting room — mask, ventilation and rooming per local infection-control policy. A normal chest X-ray does not exclude TB."},
         {tone:"blue", h:"Respiratory medicine", html:"Recurrent or non-resolving infection, complex COPD, bronchiectasis, empyema."},
         {tone:"green", h:"Community or virtual ward", html:"Selected CRB-65 1–2 cases suitable for a formal supported-care pathway — virtual ward, SDEC or hospital at home — with senior advice and per local criteria, where available. Not routine GP oral management of moderate or high-severity CAP."},
         {tone:"cream", h:"GP management", html:"Acute bronchitis with stewardship and safety-netting · low-severity CAP (CRB-65 0) at home on oral antibiotics with review · COPD exacerbation, with a rescue pack only for selected patients · selective follow-up CXR, vaccination and cessation. Adults only — children need a separate paediatric pathway. Use the local NHS Greater Manchester antimicrobial guideline, ambulance/sepsis pathway, virtual ward/SDEC/hospital-at-home criteria, respiratory/TB referral route and urgent cancer pathway; local pathways supersede this summary. The undifferentiated symptom belongs to the <a href='../algorithms/acute-cough.html'>acute cough pathway</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 72-year-old man with COPD (40 pack-years) and type 2 diabetes is brought by his daughter with 5 days of productive cough, fever and worsening breathlessness — and since yesterday he is confused and unsteady, \u201cnot himself at all\u201d. RR 28, saturations 90% on air, HR 112, BP 104/62, temperature 38.6°C, focal crackles at the right base, reduced urine output. His daughter expected \u201cjust some antibiotics\u201d, and says he hates hospitals."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Takes and narrates full observations, screens for sepsis and calculates CRB-65 — recognising CAP (CRB-65 2) with possible sepsis and hypoxia rather than \u201ca chest infection\u201d; <b>does NOT prescribe oral antibiotics for home</b>; <b>arranges 999 emergency transfer with a pre-alert and oxygen to target</b>; recognises atypical severity in the elderly — confusion and falls, not fever; distinguishes this from bronchitis and from a COPD exacerbation; <b>targets 88–92% only if at risk of hypercapnic respiratory failure</b>; addresses the \u201cjust antibiotics\u201d expectation honestly and <b>validates the daughter for bringing him in</b>; and — the step candidates miss — plans a 6-week follow-up CXR (smoker, over 50), COPD review and vaccination for after recovery."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG250 — Pneumonia: diagnosis and management (September 2025; replaced NG138 and NG139, partly replaced CG191)</b><br><a href="https://www.nice.org.uk/guidance/ng250" rel="noopener">nice.org.uk/guidance/ng250</a><span class="rd"> — CRB-65 0 low, 1–2 intermediate, 3–4 high risk, with clinical judgement for place of care; point-of-care CRP thresholds only when pneumonia is not diagnosed and antibiotic need is unclear; amoxicillin 5 days (doxycycline or clarithromycin alternatives) in low-severity adult CAP; selective, not routine, 6-week follow-up chest X-ray</span></li>'+
         '<li><b>NICE NG120 — Cough (acute): antimicrobial prescribing (2019)</b><br><a href="https://www.nice.org.uk/guidance/ng120" rel="noopener">nice.org.uk/guidance/ng120</a><span class="rd"> — no antibiotic or a back-up (delayed) prescription for uncomplicated acute cough, with safety-netting; acute cough commonly lasts 3–4 weeks; antibiotics shorten acute bronchitis cough by about half a day</span></li>'+
         '<li><b>NICE NG253 — Suspected sepsis in people aged 16 or over: recognition, assessment and early management (November 2025; replaces the earlier adult sepsis guideline)</b><br><a href="https://www.nice.org.uk/guidance/ng253" rel="noopener">nice.org.uk/guidance/ng253</a><span class="rd"> — sepsis features; NEWS2 for acute hospitals, acute mental-health settings and ambulances, structured observations in the community; emergency transfer and pre-alert for high-risk suspected sepsis; oxygen targets 94–98% or 88–92% if at risk of hypercapnic respiratory failure; fluid boluses for high-risk adults needing resuscitation</span></li>'+
         '<li><b>NICE NG115 — COPD in over 16s (2018, updated 2019)</b><br><a href="https://www.nice.org.uk/guidance/ng115" rel="noopener">nice.org.uk/guidance/ng115</a><span class="rd"> — exacerbation management; prednisolone 30 mg daily for 5 days; rescue packs for selected patients at risk of exacerbations</span></li>'+
         '<li><b>NICE NG114 — Chronic obstructive pulmonary disease (acute exacerbation): antimicrobial prescribing</b><br><a href="https://www.nice.org.uk/guidance/ng114" rel="noopener">nice.org.uk/guidance/ng114</a><span class="rd"> — antibiotic decision factors; amoxicillin, doxycycline or clarithromycin 5-day regimens</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — antimicrobial and COPD rescue-pack guidance</b><br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — rescue packs normally steroids alone, antibiotics only on clinical need; local antimicrobial choices</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — lung cancer: suspected-cancer pathway for unexplained haemoptysis at 40 and over or chest X-ray findings suggesting cancer; urgent direct-access chest X-ray for unexplained symptoms at 40 and over</span></li>'+
         '</ul></div>'},
       {b:"why", html:"This is an educational summary for adults; local pathways supersede it. Before clinical use, link each statement to the specific NICE recommendation (CRB-65 categories, CRP thresholds, follow-up chest X-ray and COPD antibiotic criteria), add the current NHS Greater Manchester antimicrobial guideline, local ambulance/sepsis pathway, virtual ward/SDEC/hospital-at-home criteria, respiratory/TB referral route and urgent cancer pathway, and obtain practice/PCN/ICB governance approval."}
     ]}
  ],
  foot:"Adult acute cough, CAP and COPD exacerbation — NICE NG250, NG120 (acute cough), NG253 (sepsis), NG115 and NG114 (COPD) and NG12. Adults only. Severity is the diagnosis that matters: assess for sepsis with structured observations, stratify CAP with CRB-65 and clinical judgement (0 low, 1–2 intermediate, 3–4 high risk), and never send a septic patient home on oral antibiotics — call 999 and pre-alert. Local pathways supersede this summary. The undifferentiated symptom belongs to the <a href=\"../algorithms/acute-cough.html\">acute cough pathway</a>. Verify all antibiotic choices against current local guidance before prescribing."
});
