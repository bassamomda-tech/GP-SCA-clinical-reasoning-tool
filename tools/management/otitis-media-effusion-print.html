MG.render({

  stemTitle:"Fluid without infection — so no antibiotics, no steroids, nothing from the pharmacy shelf: no hearing loss → reassure and safety-net; hearing loss → observe actively and reassess at 3 months, then decide WITH the family from the options available locally",
  stemSub:"One page for the whole condition: recognise that a young child rarely complains about their ears and presents instead with behaviour, attention, clumsiness or falling behind at school; perform otoscopy where feasible and arrange formal audiology assessment (age-appropriate hearing test and tympanometry); give children with Down's syndrome, cleft palate or other craniofacial anomalies an individualised specialist surveillance plan rather than routine primary-care observation alone; for OME with hearing loss, run 3 months of active observation because most resolve; then use the NG233 decision table — monitoring and support, auto-inflation, hearing aids, bone-conduction devices or grommets — rather than channelling every child straight to surgery.",

  nextReview:"9 March 2027",
  meta:[
    {t:"NICE NG233 — otitis media with effusion in under 12s (Aug 2023)"},
    {t:"NICE CG60 (2008) — replaced by NG233; historical 25–30 dBHL threshold only"},
    {t:"BNFC — intra-operative ciprofloxacin (off-label)"},
    {t:"Under 12s only — adult effusion out of scope", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#redflags"><b>Red flags</b><small>Discharge · special groups · atypical loss</small></a><a href="#severe"><b>Not OME?</b><small>AOM · Down\'s · cleft · cholesteatoma</small></a><a href="#confirm"><b>Recognise</b><small>Two feature groups</small></a><a href="#workup"><b>Confirm</b><small>Formal audiology pathway</small></a><a href="#ladder"><b>Observe then decide</b><small>3 months · decision table</small></a><a href="#refer"><b>Refer</b><small>Specialist · safety-net</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Down's syndrome, cleft palate, craniofacial anomalies: individualised specialist plan", html:"Children with Down's syndrome, cleft palate or other craniofacial anomalies should not be managed solely through routine primary-care observation. <b>Arrange formal audiology and ensure an individualised specialist surveillance plan</b>, in conjunction with the relevant cleft, ENT or paediatric service — this does not mean every child needs immediate surgery. Their OME is more prevalent, more persistent and higher-stakes for speech and language. <b>Learning disability</b> should also prompt an individualised plan because hearing loss may be missed, but is not automatically an indication for surgery."},
    {tone:"amber", h:"The child may never mention their ears", html:"NG233 deliberately broadens the presenting picture beyond hearing loss. Common features: hearing difficulty, ear discomfort, tinnitus, delayed speech and language. Associated features: behavioural problems, poor concentration or attention, clumsiness, balance difficulties, poor educational progress. A concern raised by a parent, teacher or health visitor is itself a valid trigger to assess."},
    {tone:"blue", h:"OME with no hearing loss needs no treatment at all", html:"Children with OME but no hearing loss do not need treatment — but explain WHY it is not needed, and safety-net. The explanation is the intervention: it prevents both unnecessary anxiety and the assumption that nothing was found."},
    {tone:"green", h:"OME with hearing loss: active observation, reassess at 3 months", html:"For confirmed OME with hearing loss, use active observation and <b>reassess hearing after 3 months in bilateral disease; consider reassessment in unilateral disease</b> — a large proportion resolve in that window. Active observation is not doing nothing: support at home and school, review of speech, language and educational impact, follow-up and safety-netting, and auto-inflation if the child can cooperate. Consider intervention before the 3-month reassessment if hearing difficulty is significantly affecting communication, speech and language, behaviour, education or day-to-day functioning."},
    {tone:"amber", h:"Nothing from the pharmacy shelf works", html:"Do NOT offer antibiotics, oral or nasal steroids, decongestants, antihistamines, leukotriene receptor antagonists, mucolytics, or PPI and anti-reflux drugs. <b>Nor homeopathy, cranial osteopathy or acupuncture.</b> Do not offer these <b>specifically to treat OME or OME-related hearing loss</b> — an existing PPI prescribed for another indication need not be stopped. NICE NG233 found no evidence of benefit, or (for PPIs and anti-reflux medicines) insufficient evidence."},
    {tone:"blue", h:"The 2023 headline: a decision table, not a dB cut-off", html:"Under the 2008 guideline (NICE CG60), persistent bilateral OME documented over 3 months with a better-ear hearing level of 25–30 dBHL or worse prompted consideration of surgery. NG233 now frames this as a shared decision using the OME decision table — monitoring and support, auto-inflation, hearing aids, bone-conduction devices or grommets — rather than a single decibel threshold channelling every child to surgery. Discuss the options relevant to the child's hearing level, laterality, developmental needs, family preference and local service availability."}
  ],
  pathwaySub:"The whole pathway in five moves. The red step is the one that must precede any observation.",
  pathway:[
    {title:"Check this is OME, and that the child is not a special group", html:"Acute symptoms (ear pain and/or fever) with a bulging or newly inflamed drum and effusion is acute otitis media, not OME — a red or dull drum alone is not enough. Down's syndrome, cleft palate or other craniofacial anomaly → formal audiology and an individualised specialist plan; learning disability → individualised plan. Foul discharge, a retraction pocket or attic crust → urgent ENT. See the <a href=\"#redflags\">red flags</a>.", alert:true},
    {title:"Recognise it from either feature group", html:"Hearing difficulty, ear discomfort, tinnitus, delayed speech and language — or <b>behaviour, attention, clumsiness, balance, poor educational progress</b>. Often <b>bilateral and fluctuating</b>."},
    {title:"Confirm and quantify", html:"Perform otoscopy in primary care where feasible and document the findings; if OME is suspected, refer to the local paediatric audiology pathway for formal assessment, including age-appropriate hearing testing and tympanometry. Consider co-existing sensorineural, non-organic and permanent conductive causes. Document laterality, hearing level and impact."},
    {title:"Manage by hearing status: observe, reassess, then use the decision table", html:"No hearing loss → no treatment, explain and safety-net. Bilateral OME with hearing loss → reassess hearing at 3 months (unilateral → consider reassessing at 3 months); consider intervening sooner if hearing difficulty is significantly affecting communication, speech and language, behaviour, education or day-to-day functioning. Then discuss the relevant options with the family."},
    {title:"Support, then follow up", html:"<b>Support strategies at home and school throughout</b>; <b>post-grommet hearing test at 6 weeks and water precautions for 2 weeks</b>; safety-net for recurrence."}
  ],
  sections:[

    {id:"severe", nav:"Differential", title:"Differential diagnosis — what OME is, and when this pathway does not apply",
     sub:"Otitis media with effusion is fluid in the middle ear in the ABSENCE of infection. First separate it from the conditions that need a different route.",
     blocks:[
       {b:"table", head:["Condition","Discriminating features","Next step"], rows:[
         ["<b>Acute otitis media (AOM)</b>","Acute symptoms — usually ear pain and/or fever — with a bulging or newly inflamed drum and middle-ear effusion. A red or dull drum alone is not sufficient: do not prescribe antibiotics for an erythematous or opaque drum in an otherwise well child with an OME picture","<b>Use the current AOM antimicrobial pathway (NICE NG91)</b> — see the <a href='otitis-media-externa.html'>ear pain and otitis protocol</a>. <b>OME is the non-infected effusion that often follows</b>"],
         ["<b>Down's syndrome</b>","<b>Higher OME prevalence and persistence</b>","Formal audiology and an individualised specialist surveillance plan (paediatric audiology, ENT or Down syndrome service) — not routine primary-care observation alone"],
         ["<b>Cleft palate</b>","<b>Strongly associated with OME</b>","<b>Individualised plan with the cleft team, ENT and audiology — not routine primary-care observation alone</b>"],
         ["<b>Cholesteatoma or chronic perforation</b>","<b>Foul discharge, attic crust or retraction pocket, persistent discharge</b>","<b>Urgent ENT referral — not simple glue ear</b>"],
         ["<b>Suspected sensorineural or permanent loss</b>","Co-existing sensorineural, non-organic or permanent conductive hearing loss changes management","<b>Audiology and ENT assessment</b>"],
         ["<b>Otitis externa</b>","Canal pain, tenderness on moving the pinna or tragus, canal oedema and debris; the drum (if seen) is not the problem","Treat the canal — see the <a href='otitis-media-externa.html'>ear pain and otitis protocol</a>; reassess the drum once the canal is clean"],
         ["<b>Impacted wax</b>","Drum not visible; hearing improves once the canal is cleared","Manage the wax, then re-examine the drum and re-test hearing if concern persists"],
         ["<b>Adult with a unilateral effusion</b>","Outside this under-12s pathway — a persistent unilateral middle-ear effusion in an adult needs exclusion of nasopharyngeal disease","<b>Adult ENT pathway — outside the scope of NG233</b>"]
       ]},
       {b:"why", html:"OME is defined by middle-ear fluid without the signs of acute infection — distinguishing it from acute otitis media is the first step, because the management (observe versus treat infection) is completely different. Children with Down's syndrome, cleft palate and other craniofacial anomalies are identified in NICE NG233 as needing formal assessment and an individualised specialist plan, because their OME is more prevalent, more persistent and higher-stakes for speech and language. And although this guideline is for under-12s, an unexplained unilateral effusion in an adult is a recognised presentation of nasopharyngeal cancer."},
       {b:"dl", rows:[
         ["<b>Scope</b>","This protocol applies only to children under 12. Persistent unilateral middle-ear effusion in an adult requires an adult ENT pathway to exclude nasopharyngeal disease; this is outside the scope of NG233"]
       ]}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — stop, this is not routine glue ear",
     sub:"Check these before offering 3 months of active observation.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Foul or persistent discharge, attic crust or retraction pocket", html:"Suggests cholesteatoma or chronic suppurative otitis media, not a simple effusion. Refer urgently to ENT; do not observe.", src:"Clinical practice; ENT pathway outside the scope of NICE NG233 (2023)"},
         {tone:"red", h:"Acutely unwell child with ear pain and fever", html:"A bulging red drum with systemic upset is acute otitis media. Think of mastoiditis if there is post-auricular swelling, tenderness or a pushed-forward pinna — same-day paediatric or ENT assessment.", src:"NICE NG91 (2018) acute otitis media — mastoiditis or other serious complication needs hospital referral"},
         {tone:"amber", h:"Down's syndrome, cleft palate, craniofacial anomaly or learning disability", html:"Should not be managed solely through routine primary-care observation. Arrange formal audiology and ensure an individualised specialist surveillance plan with the relevant cleft, ENT or paediatric service (the regional cleft team for cleft palate). Learning disability prompts an individualised plan because hearing loss may be missed — not automatically surgery.", src:"NICE NG233 (2023) — children at increased risk of OME"},
         {tone:"amber", h:"Hearing loss that does not fit an effusion", html:"A loss that is sensorineural, asymmetric, progressive, non-organic or persists after the effusion clears. Refer to audiology and ENT rather than attributing it to glue ear.", src:"NICE NG233 (2023) — consider co-existing causes of hearing loss"},
         {tone:"amber", h:"Adult (outside this pathway) with a persistent unilateral effusion", html:"Needs ENT examination of the post-nasal space to exclude a nasopharyngeal tumour. This is an adult ENT pathway, outside the scope of NG233.", src:"Clinical practice; outside the scope of NICE NG233 (2023)"},
         {tone:"blue", h:"Speech or language delay, or significant impact at school", html:"Not an emergency, but a reason not to wait out the full 3 months — consider intervening earlier (earlier audiology/ENT review, hearing aids or grommets, depending on the decision-table discussion) and involve the health visitor, school and speech and language therapy as needed.", src:"NICE NG233 (2023) — intervene earlier if hearing difficulties significantly affect daily living"}
       ]},
       {b:"why", html:"Active observation is safe only once you have excluded the conditions that look like glue ear but behave differently: cholesteatoma and chronic suppurative otitis media erode the middle ear if left, acute otitis media can progress to mastoiditis, and a fixed sensorineural loss will not wait for an effusion to clear. Children with Down's syndrome and cleft palate have OME that starts earlier and lasts longer, so they need formal assessment and an individualised plan with services that have the right expertise, rather than routine observation alone."}
     ]},

    {id:"confirm", nav:"Recognise", title:"How glue ear presents — two feature categories",
     sub:"NG233 splits the presenting features into two groups. The child may not complain about their ears at all.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Common features</b>","Hearing difficulties · ear discomfort · tinnitus · delayed speech and language development"],
         ["<b>Associated features</b>","Behavioural problems · lack of concentration or attention · clumsiness · balance difficulties · poor educational progress"],
         ["<b>Who raises it</b>","Concerns from parents or carers, or from professionals such as teachers and health visitors, are a valid trigger to assess"],
         ["<b>Often bilateral and fluctuating</b>","Hearing can fluctuate and effusions are frequently bilateral. A child may \u201cignore\u201d instructions or turn the TV up rather than report deafness"],
         ["<b>Peaks in early childhood</b>","Very common in pre-school children; most episodes are self-limiting — which is why active observation comes first"],
         ["<b>Who this pathway is for</b>","<b>A child &lt;12 (under 12) with suspected glue ear.</b> Suspect it from hearing difficulty, ear discomfort, tinnitus, delayed speech or language, or behaviour, balance or educational concerns"]
       ]},
       {b:"why", html:"The 2023 update deliberately broadens the presenting picture beyond \u201chearing loss\u201d to include behaviour, attention, clumsiness, balance and educational progress — because young children rarely articulate hearing difficulty, and OME is often first noticed as a developmental or behavioural concern. Recognising these softer signs is what prevents glue ear from being missed during the critical speech-and-language window."}
     ]},

    {id:"workup", nav:"Confirm", title:"Assessment and confirming the diagnosis",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Clinical examination</b>","Otoscopy (a dull or retracted drum, fluid level or bubbles, reduced mobility), general development, and general upper respiratory health"],
         ["<b>Objective tests</b>","Tympanometry — a flat or type B trace supports an effusion — and hearing testing appropriate to the child's age, usually performed within the formal audiology assessment rather than in every GP practice"],
         ["<b>Refer for formal hearing assessment</b>","If OME is suspected, arrange referral to the local paediatric audiology pathway for formal assessment, including age-appropriate hearing testing and tympanometry, to confirm OME and quantify any hearing loss. Perform otoscopy in primary care where feasible and document the findings"],
         ["<b>Consider co-existing causes</b>","Where there is hearing loss, consider sensorineural, non-organic and permanent conductive causes — do not assume all loss is from the effusion"],
         ["<b>Document the baseline</b>","Record laterality (unilateral or bilateral), hearing levels, and the impact on day-to-day living, speech and language, and schooling — this drives the management decision"],
         ["<b>Confirmed OME</b>","A middle-ear effusion on examination or tympanometry, with or without a confirmed conductive hearing loss on audiometry. The presence or absence of hearing loss then splits the pathway"]
       ]},
       {b:"why", html:"OME is confirmed through formal assessment — otoscopy, age-appropriate hearing testing and tympanometry — and a dull or retracted drum alone is not definitive; the management hinges on audiology — whether there is a hearing loss, how big it is, and whether it is affecting the child. Actively considering sensorineural, non-organic and permanent conductive causes prevents the error of attributing a fixed or progressive loss to a transient effusion and missing a more serious diagnosis."}
     ]},

    {id:"ladder", nav:"Observe then decide", title:"Active observation, the do-not-offer list, and the decision table",
     sub:"Most OME resolves spontaneously, so the first-line approach is a period of active observation — the term that replaced \u201cwatchful waiting\u201d.",
     blocks:[
       {b:"table", head:["Situation","Action"], rows:[
         ["<b>OME with NO hearing loss</b>","No treatment needed. Explain why it is not needed — which avoids confusion and anxiety — and that they can return if hearing concerns arise"],
         ["<b>Bilateral OME + hearing loss</b>","Reassess hearing after 3 months of active observation — a large proportion resolve in this window without intervention"],
         ["<b>Unilateral OME + hearing loss</b>","Consider reassessing hearing after 3 months. Persistent unilateral loss that affects daily living or communication warrants the same options discussion as bilateral loss"],
         ["<b>Significant impact on daily living</b>","Consider intervention before the 3-month reassessment if hearing difficulty is significantly affecting communication, speech and language, behaviour, education or day-to-day functioning — for example earlier audiology/ENT review, hearing aids or grommets, depending on the decision-table discussion"],
         ["<b>During observation</b>","Active observation is not doing nothing: hearing support at home and school (face the child when speaking, minimise background noise, seat nearer the teacher), review of speech, language, communication and educational impact, appropriate follow-up and safety-netting, and consider auto-inflation if the child can cooperate"]
       ]},
       {b:"warn", html:"<b>Do NOT offer for OME or OME-related hearing loss: antibiotics</b> (it is not an active infection), oral or nasal steroids, decongestants, antihistamines, leukotriene receptor antagonists, mucolytics, or PPI and anti-reflux medications. Nor homeopathy, cranial osteopathy or acupuncture. Do not offer these specifically for OME — an existing PPI prescribed for a separate indication need not be stopped. NICE NG233 found no evidence of benefit, or (for PPIs and anti-reflux medicines) insufficient evidence — and prescribing them exposes children to side effects and antimicrobial resistance for no benefit. The only measures with a role are support strategies, auto-inflation, hearing aids or bone-conduction devices, and surgery."},
       {b:"table", head:["The NG233 OME decision table — five options","Detail"], rows:[
         ["<b>Monitoring and support</b>","Continue active monitoring plus the support strategies if the family prefers to avoid devices or surgery"],
         ["<b>Auto-inflation</b>","Consider as a non-invasive option if the child can cooperate, particularly as a bridge while deciding"],
         ["<b>Hearing aids</b>","Consider hearing aids — especially where surgery is unsuitable or declined, or for bilateral loss; reversible and non-surgical"],
         ["<b>Bone-conduction devices</b>","Consider bone-conduction devices, which transmit sound via skull vibration, bypassing the middle ear — useful where conventional aids are not suitable"],
         ["<b>Grommets (ventilation tubes)</b>","Consider grommets only where there is OME-related hearing loss, not persistent fluid without hearing loss — the main surgical option"],
         ["<b>How to decide</b>","Cover the benefits, risks and practical considerations of each option, plus support strategies, tailored to the child and family — this is the decision table conversation. Options are not all equivalent or available in every service: discuss those relevant to the child's hearing level, laterality, developmental needs, family preference and local service availability"]
       ]},
       {b:"why", html:"The 3-month active-observation period reflects the strong natural-history evidence that most OME resolves on its own, sparing children unnecessary surgery. The crucial nuances are that OME without hearing loss needs no treatment at all — just explanation and a safety-net — and that a child whose hearing loss is materially harming their daily life or development should not be made to wait the full three months. Then: the 2023 guideline's headline change is the OME decision table. Instead of channelling every child with persistent loss straight to grommets, it lays out monitoring and support, auto-inflation, hearing aids, bone-conduction devices and grommets as legitimate options to weigh together with the family — recognising that hearing aids are a reasonable, reversible alternative to surgery for many children, and that the right choice depends on the child's circumstances and the family's preferences."},
       {b:"table", head:["If surgery is chosen","Detail"], rows:[
         ["<b>Grommets</b>","Insertion of temporary grommets to ventilate the middle ear is recommended for OME-related hearing loss. Discuss the risks — perforation, localised atrophy, tympanosclerosis, infection — as a shared decision"],
         ["<b>Adjuvant adenoidectomy</b>","When planning grommets, consider adjuvant adenoidectomy — unless assessment indicates a palate abnormality. Discuss its risks (haemorrhage, velopharyngeal insufficiency)"],
         ["<b>Adenoidectomy alone</b>","NOT recommended in the absence of persistent and/or frequent upper respiratory tract symptoms"],
         ["<b>Intra-operative ciprofloxacin</b>","Consider a single dose of ciprofloxacin given intraoperatively during grommet insertion (off-label as at August 2023) to reduce post-operative otorrhoea. This is an ENT peri-operative decision, not a GP prescribing recommendation"],
         ["<b>Water precautions</b>","Keep the ear dry — avoid swimming, and take care bathing and washing hair, for 2 weeks after surgery. Lifelong water precautions are not needed; if otorrhoea recurs with water exposure, consider ear plugs or headbands"],
         ["<b>Post-operative hearing test</b>","<b>Perform a postoperative hearing test 6 weeks after surgery</b>"]
       ]},
       {b:"why", html:"Grommets ventilate the middle ear and reliably restore hearing while in place, which is why they remain the main surgical option — but the 2023 guidance stresses shared decision-making about their real risks. Adjuvant adenoidectomy is considered alongside grommets (unless the palate is abnormal) because removing the adenoids reduces the chance of OME recurrence and repeat surgery; adenoidectomy on its own is reserved for children who also have significant upper-airway symptoms."}
     ]},

    {id:"lifestyle", nav:"Support", title:"Hearing-loss support strategies",
     sub:"Whatever the management decision, these help the child function while the effusion is present — at home, in all settings, and in education.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"👀 Be close and face the child", html:"Get the child's attention before speaking, get down to their level and face them, so they can use visual cues.", src:"NICE NG233 (2023) — hearing-loss support strategies"},
         {tone:"blue", h:"🔇 Minimise background noise", html:"Turn off the TV or radio when talking; choose quieter settings for conversations.", src:"NICE NG233 (2023) — hearing-loss support strategies"},
         {tone:"green", h:"🖼️ Use visual aids", html:"<b>Gestures, pictures and demonstration to back up spoken instructions.</b>", src:"NICE NG233 (2023) — hearing-loss support strategies"},
         {tone:"amber", h:"🏫 Inform school staff", html:"Tell staff about the OME and the related hearing loss so they can adapt, and ask whether classroom adjustments can be made — for example favourable seating near the front of the class.", src:"NICE NG233 (2023) — support in education settings"},
         {tone:"blue", h:"🎈 Consider auto-inflation", html:"A simple, low-risk measure — for example a nasal balloon device — that can be offered during observation. Modest evidence but low risk, which is why NICE NG233 makes it a \"consider\" option.", src:"NICE NG233 (2023) — auto-inflation"},
         {tone:"cream", h:"🗣️ Prepare the child, and tailor the information", html:"<b>Explain interventions and what to expect in age-appropriate terms.</b> Give OME information tailored to the child's age, development and the family's needs, format and language.", src:"NICE NG233 (2023) — information for families"},
         {tone:"amber", h:"🚭 Avoid passive smoke exposure", html:"<b>A modifiable risk factor for OME</b> — worth raising directly with the family, with an offer of stop-smoking support for the adults.", src:"Clinical practice; NICE NG209 (2021) stop-smoking support"},
         {tone:"green", h:"📈 Reassure and monitor", html:"Reassure parents that most OME resolves spontaneously, and monitor speech and language.", src:"NICE NG233 (2023) — active observation"}
       ]},
       {b:"why", html:"Support strategies are the part of OME care that helps every child immediately, regardless of whether they go on to devices or surgery — and they are cheap, safe and empowering for families and schools. Auto-inflation has modest evidence but is low-risk, so NG233 lists it as something to consider during the observation period."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Review, follow-up and safety-netting",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>After the 3-month observation</b>","Re-test hearing and review speech, behaviour, education and the impact on daily living"],
         ["<b>Post-grommet, at 6 weeks</b>","Hearing test. If the hearing loss has resolved → discharge, with advice to seek reassessment if concerns recur. If hearing loss persists → investigate further and manage appropriately"],
         ["<b>Follow-up options</b>","Advise parents and carers to seek reassessment if worried about recurrence; or consider a 1-year follow-up hearing test if recurrence could be missed; or an individualised plan for children at higher risk of unrecognised hearing loss, such as those with learning disability or a craniofacial anomaly"],
         ["<b>After grommet extrusion</b>","<b>Review for recurrence</b>"],
         ["<b>Otorrhoea post-grommet</b>","Consider non-ototoxic topical antibiotic drops, such as ciprofloxacin, for 5–7 days; avoid oral antibiotics unless there is systemic illness or another indication. Otorrhoea that persists and does not respond to topical antibiotics → ENT may consider grommet removal"],
         ["<b>If hearing does not recover</b>","<b>Reconsider sensorineural or permanent conductive loss</b>"],
         ["<b>Safety-net</b>","Tell families OME can recur, and to return if hearing, speech, behaviour or school progress deteriorates — re-refer for hearing assessment as needed"]
       ]},
       {b:"why", html:"The 6-week post-operative test closes the loop: it confirms the grommets worked, and any continuing loss is investigated rather than assumed resolved. Higher-risk groups — Down's syndrome, cleft palate, craniofacial anomalies, learning disability — get specialist pathways and individualised follow-up because their OME is more likely to be persistent and to be missed, with bigger consequences for speech, language and learning if it is."},
       {b:"say", html:"What your child has is glue ear — fluid sitting behind the eardrum. It is not an infection, which is why antibiotics, steroids and decongestants genuinely do not help; the national guideline looked at all of them. The good news is that most cases clear up by themselves, so the plan for the next three months is to watch it properly rather than do nothing: I will arrange a hearing test now and repeat it, and meanwhile there are things that make a real difference at home and at school — face her when you talk, turn the telly off during conversations, and let the school know so she can sit near the front. If the hearing is still affected after three months, we sit down together and go through the options — and grommets are only one of them; hearing aids are a perfectly reasonable choice too. Come back sooner if you feel her hearing is really holding her back."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral, special groups and unilateral loss",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent ENT", html:"Foul discharge, attic crust or retraction pocket, or persistent discharge — suspected cholesteatoma or chronic perforation. <b>Post-auricular swelling, tenderness or a protruding pinna in an acutely unwell child → same-day assessment for mastoiditis.</b> Also, in an <b>adult</b> (outside this pathway), a persistent <b>unilateral</b> middle-ear effusion, to exclude a nasopharyngeal tumour.", src:"Clinical practice; outside the scope of NICE NG233 (2023)"},
         {tone:"amber", h:"Specialist / audiology — individualised plan", html:"Down's syndrome, cleft palate or other craniofacial anomalies → formal audiology and an individualised specialist surveillance plan with the relevant cleft, ENT or paediatric service, not routine primary-care observation alone. Learning disability → individualised follow-up (higher risk of unrecognised OME-related loss), not automatically surgery. Also <b>diagnostic uncertainty</b>.", src:"NICE NG233 (2023) — children at increased risk of OME"},
         {tone:"blue", h:"Audiology — formal hearing assessment", html:"<b>If OME is suspected, refer to the local paediatric audiology pathway for formal assessment</b>, including age-appropriate hearing testing and tympanometry, to confirm the effusion and quantify any hearing loss.", src:"NICE NG233 (2023) — assessment"},
         {tone:"blue", h:"ENT / audiology after observation", html:"Persistent hearing loss after 3 months, significant impact on development or schooling, or diagnostic uncertainty.", src:"NICE NG233 (2023) — reassessment at 3 months and the decision table"},
         {tone:"blue", h:"Persistent unilateral loss", html:"Persistent unilateral OME-related hearing loss impacting daily living or communication warrants the same options discussion as bilateral loss — do not dismiss it because the other ear hears.", src:"NICE NG233 (2023) — unilateral OME"},
         {tone:"green", h:"Local referral routes (Bolton)", html:"Use the local Bolton paediatric audiology and paediatric ENT referral pathways — check the current referral forms and criteria on the local referral guidance before referring.", src:"Local pathway"},
         {tone:"cream", h:"GP management", html:"An otherwise healthy child under 12: otoscopy where feasible, and referral to paediatric audiology for formal assessment (hearing test and tympanometry). No hearing loss → reassure, no treatment, safety-net. Hearing loss → active observation with support strategies, reassess at 3 months (bilateral; consider in unilateral), then hold the decision-table conversation.", src:"NICE NG233 (2023)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 4-year-old is brought in because nursery have raised concerns: she is not following instructions, seems clumsy, and her speech is behind her peers. Her mother has noticed she turns the television up. There is no earache and she has never had a discharging ear. Otoscopy shows dull, retracted drums bilaterally.", src:"NICE NG233 (2023) — presenting features"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the associated features — behaviour, attention, clumsiness, nursery concern — as an OME presentation rather than waiting for a complaint about hearing; suspects OME clinically and arranges formal audiology assessment including hearing testing and tympanometry, rather than treating a dull or retracted drum as definitive confirmation; does not prescribe antibiotics, steroids or a decongestant, and can say why; commits to 3 months of ACTIVE observation with a hearing re-test, not \u201ccome back if worse\u201d; <b>gives the support strategies and offers to inform nursery</b>; asks about <b>passive smoke exposure</b>; and — the step candidates miss — frames the eventual decision as a shared one across the options relevant to her and available locally, so the family are not expecting grommets to be automatic.", src:"NICE NG233 (2023)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG233 — Otitis media with effusion in under 12s (August 2023)</b><br><a href="https://www.nice.org.uk/guidance/ng233" rel="noopener">nice.org.uk/guidance/ng233</a><span class="rd"> — the two presenting-feature categories, the 3-month active observation period, the do-not-offer list, the OME decision table, and the surgical and aftercare recommendations. <b>NG233 replaced the 2008 guideline (CG60)</b></span></li>'+
         '<li><b>NICE NG233 (2023) — the OME decision table</b><br><a href="https://www.nice.org.uk/guidance/ng233/evidence/supplement-2-decision-table-pdf-13133202590" rel="noopener">NG233 supplement 2: decision table</a><span class="rd"> — monitoring and support, auto-inflation, hearing aids, bone-conduction devices and grommets, presented as options to weigh with the family rather than a single decibel threshold</span></li>'+
         '<li><b>NICE NG233 \u2014 Otitis media with effusion in under 12s</b><br><a href="https://www.nice.org.uk/guidance/ng233" rel="noopener">nice.org.uk/guidance/ng233</a><span class="rd"> — primary-care assessment, the Down\u2019s syndrome and cleft palate individualised specialist pathways, and the referral thresholds</span></li>'+
         '<li><b>NICE CG60 — Surgical management of otitis media with effusion in children (2008; replaced by NG233 in 2023)</b><br><a href="https://www.nice.org.uk/guidance/cg60" rel="noopener">nice.org.uk/guidance/cg60</a><span class="rd"> — historical only: persistent bilateral OME over 3 months with a better-ear hearing level of 25\u201330 dBHL or worse, the threshold the NG233 decision table superseded</span></li>'+
         '<li><b>NICE NG91 — Otitis media (acute): antimicrobial prescribing (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng91" rel="noopener">nice.org.uk/guidance/ng91</a><span class="rd"> — the antimicrobial pathway for acute otitis media (used instead of this protocol) and when to refer for suspected mastoiditis or other serious complications</span></li>'+

         '<li><b>NICE NG209 — Tobacco: preventing uptake, promoting quitting and treating dependence (2021)</b><br><a href="https://www.nice.org.uk/guidance/ng209" rel="noopener">nice.org.uk/guidance/ng209</a><span class="rd"> — stop-smoking support for parents and carers</span></li>'+
         '<li><b>BNF for Children</b><br><a href="https://bnfc.nice.org.uk" rel="noopener">bnfc.nice.org.uk</a><span class="rd"> — intra-operative ciprofloxacin (off-label as at August 2023), and confirmation that no oral or topical drug treatment is indicated for OME</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Otitis media with effusion (glue ear) in under 12s — NICE NG233 (August 2023) and its OME decision table, with NICE CG60 (2008) for the historical threshold only. No drug treatment has a role. Refer for formal audiology assessment, and arrange an individualised specialist plan for children with Down's syndrome, cleft palate or other craniofacial anomalies rather than routine primary-care observation alone. OME without hearing loss needs reassurance and safety-netting, not treatment. Ear pain and the acute infections are covered by the <a href=\"otitis-media-externa.html\">ear pain and otitis protocol</a>. Always individualise to the child and family."
