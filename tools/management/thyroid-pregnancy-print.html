  lead:'<div class="mg-layers"><a href="#severe"><b>Emergencies</b><small>Storm · hyperemesis · suspected cancer</small></a><a href="#confirm"><b>Physiology</b><small>Trimester ranges</small></a><a href="#ladder"><b>Treat</b><small>Levothyroxine ↑ · antithyroid drugs</small></a><a href="#ppt"><b>Postpartum</b><small>PPT · step down</small></a><a href="#refer"><b>Refer</b><small>By risk</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Two emergencies and one cancer route", html:"Thyroid storm — fever, tachyarrhythmia, agitation, vomiting → emergency admission. Hyperemesis gravidarum with intractable vomiting → emergency admission for rehydration and assessment. An unexplained thyroid lump should prompt consideration of a suspected cancer pathway referral (NICE NG12), with ultrasound and specialist assessment according to the pathway — pregnancy does not remove the need for urgent investigation."},
    {tone:"amber", h:"A low TSH in the first trimester is normal", html:"hCG cross-stimulates the TSH receptor, so TSH falls in the first trimester — but do not interpret it in isolation: FT4/FT3, symptoms, gestation, antibody status and clinical context matter. Rising oestrogen raises thyroxine-binding globulin, so total T4 rises predictably; free hormone assays are method-dependent and may be less reliable in pregnancy. Interpret TSH and FT4 using laboratory-, method- and trimester-specific pregnancy reference ranges; if local ranges are unavailable, discuss with the laboratory or endocrinology team."},
    {tone:"blue", h:"Levothyroxine goes UP, early — the opposite of the instinct", html:"Women already taking levothyroxine should check TFTs as soon as pregnancy is confirmed and usually increase the dose empirically by approximately 25–30% while awaiting results, unless an individual specialist plan says otherwise — for example two extra usual doses per week, or a daily dose increase. Do not wait for booking. Further adjustment is guided by TSH and FT4; some women need 30–50%, depending on the cause, pre-pregnancy TSH and residual thyroid function."},
    {tone:"amber", h:"Antithyroid treatment is specialist-led", html:"PTU is generally preferred during early pregnancy because carbimazole is associated with congenital malformations (MHRA). If a woman conceives while taking carbimazole, contact endocrinology/obstetric medicine urgently regarding switching, ideally before 10 weeks. <b>PTU and carbimazole both cross the placenta; use the lowest effective dose.</b> PTU carries a risk of serious liver injury, and the later-pregnancy choice of antithyroid drug requires specialist review. Block-and-replace is not used in pregnancy."},
    {tone:"green", h:"Refer according to risk", html:"Urgent antenatal/endocrinology discussion for overt hypo- or hyperthyroidism, TSH above 10 mU/L, suspected Graves', current antithyroid drugs, or previous Graves' treated with radioiodine or thyroidectomy. Specialist advice or pathway referral for milder subclinical hypothyroidism, TPOAb positivity with normal TFTs, or stable disease with an existing plan. Check TSH and FT4 — adding FT3 if hyperthyroid — immediately; do not delay levothyroxine in overt hypothyroidism."},
    {tone:"cream", h:"Step the dose back down after delivery", html:"The pregnancy-driven rise in requirement reverses after birth, so a woman left on her pregnancy dose becomes over-replaced. If the dose was increased in pregnancy, reduce to the pre-pregnancy dose after delivery if that was the established plan, and check TFTs at approximately 6 weeks postpartum. If levothyroxine was started during pregnancy, do not automatically stop or reduce it without reviewing the indication."}
  ],
  pathwaySub:"The whole pathway in five moves. The red step comes before any interpretation of the numbers.",
  pathway:[
    {title:"Screen for emergency and cancer", html:"Thyroid storm or intractable vomiting → emergency admission. An unexplained thyroid lump → consider a thyroid suspected cancer pathway referral (NG12), with ultrasound and specialist assessment according to the pathway.", alert:true},
    {title:"Test and interpret correctly", html:"TSH and FT4 (add FT3 if hyperthyroid) immediately, read against laboratory-, method- and trimester-specific ranges. A low first-trimester TSH may be physiological but is not interpreted in isolation. TRAb in current or previous Graves' disease."},
    {title:"Refer according to risk", html:"Urgent antenatal/endocrinology discussion for overt disease, TSH above 10 mU/L, hyperthyroidism, current antithyroid drugs or previously treated Graves'. Specialist advice or pathway referral for milder or stable disease. Do not delay levothyroxine in overt hypothyroidism while awaiting assessment."},
    {title:"Treat by pattern", html:"Hypothyroid → empirical levothyroxine increase of about 25–30% on a positive test, then titrate to TSH and FT4. Hyperthyroid → specialist-led antithyroid drug (PTU usually preferred in early pregnancy) at the lowest effective dose. Postpartum thyroiditis → differentiate from Graves', then treat the phase."},
    {title:"Monitor across the pregnancy and after it", html:"TSH and FT4 at pregnancy confirmation, then every 4–6 weeks until 20 weeks and again at around 28 weeks — more often when treatment is started or adjusted. After delivery, step the dose back down and recheck at about 6 weeks."}
  ],
  sections:[

    {id:"severe", nav:"Emergencies", title:"Emergencies, the cancer flag, and why control matters",
     sub:"Pregnancy lowers the threshold for harm from thyroid disease. Screen first for what needs emergency or cancer-pathway action.",
     blocks:[
       {b:"table", head:["Situation","Features","Action"], rows:[
         ["<b>Thyroid storm</b>","Severe signs and symptoms of hyperthyroidism — fever, tachyarrhythmia, agitation, vomiting","<b>Emergency admission</b>"],
         ["<b>Hyperemesis gravidarum</b>","Intractable vomiting — can overlap with gestational transient thyrotoxicosis","<b>Emergency admission for rehydration and assessment</b>"],
         ["<b>Suspected thyroid malignancy</b>","<b>Unexplained thyroid lump</b>","<b>Consider a thyroid suspected cancer pathway referral (NICE NG12), with ultrasound and specialist assessment according to the pathway, independent of pregnancy</b>"],
         ["<b>Inadequately-controlled hyperthyroidism</b>","Raises miscarriage, pre-eclampsia, IUGR, preterm delivery, low birth weight and fetal death","<b>Urgent control</b>"],
         ["<b>Undetected or under-treated hypothyroidism</b>","May adversely affect fetal neuropsychological development and survival; associated with ovulatory dysfunction and infertility","<b>Treat promptly; refer according to risk</b>"],
         ["<b>Adrenergic symptoms</b>","Tremor or tachycardia needing symptomatic treatment while awaiting specialist assessment","<b>Seek endocrinology advice — a beta-blocker may be used short-term</b>"]
       ]},
       {b:"warn", html:"<b>Inadequately-controlled disease harms mother and fetus.</b> Undetected or under-treated hypothyroidism impairs fetal neurodevelopment; poorly-controlled hyperthyroidism raises miscarriage, pre-eclampsia, intrauterine growth restriction, preterm delivery and fetal death. <b>Treat promptly and refer according to risk.</b>"},
       {b:"why", html:"Maternal thyroid hormone is critical for fetal brain development, especially in the first trimester before the fetal thyroid is functional — which is why both under-treated hypothyroidism and poorly-controlled hyperthyroidism carry serious fetal risks and demand prompt action. Thyroid storm and hyperemesis are the genuine emergencies, and an unexplained thyroid lump still prompts consideration of the suspected cancer pathway in pregnancy."},
       {b:"dl", rows:[
         ["<b>NG12 — the criterion that applies here</b>","NICE NG12: consider a suspected cancer pathway referral (for an appointment within 2 weeks) for thyroid cancer in people with an unexplained thyroid lump. <b>Pregnancy does not remove the need for urgent investigation</b> — arrange ultrasound and specialist assessment according to the pathway, alongside whatever thyroid function management is needed. Not every palpable thyroid nodule automatically needs a 2-week suspected-cancer referral: referral depends on the NG12 features and clinical assessment. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"Physiology", title:"Pregnancy thyroid physiology and trimester-specific ranges",
     sub:"Pregnancy rewrites the reference ranges. Misreading them is the commonest error in this area.",
     blocks:[
       {b:"dl", rows:[
         ["<b>TBG and thyroid hormones</b>","Increased oestrogen production raises thyroxine-binding globulin (TBG), so total T4 rises predictably. Free hormone assays are method-dependent and may be less reliable in pregnancy; total T4 or an FT4 index may be useful in selected circumstances"],
         ["<b>TSH falls in the first trimester</b>","A fall in TSH is normal in the first trimester, because hCG cross-stimulates the TSH receptor. Do not misread a low first-trimester TSH as pathological hyperthyroidism — but do not interpret it in isolation: FT4/FT3, symptoms, gestation, antibody status and clinical context matter"],
         ["<b>Use pregnancy ranges</b>","Interpret TSH and FT4 using laboratory-, method- and trimester-specific pregnancy reference ranges — non-pregnant ranges mislead. If local pregnancy-specific ranges are unavailable, discuss interpretation with the laboratory or endocrinology team"],
         ["<b>Immune changes</b>","Altered immune function can change the course of existing autoimmune thyroid disease — it may improve during pregnancy and relapse postpartum"],
         ["<b>After delivery</b>","Thyroid hormone and TSH levels normally return to the pre-pregnant state postpartum — but watch for postpartum thyroiditis"],
         ["<b>What to request</b>","TSH plus FT4 for hypothyroid pictures; add FT3 for hyperthyroid pictures. Check immediately and send the results to the specialist"],
         ["<b>TRAb (TSH-receptor antibodies)</b>","Measure TRAb in women with current or previous Graves' disease, including those previously treated with radioiodine or thyroidectomy, because antibodies can cross the placenta even when the mother is euthyroid or hypothyroid. Elevated TRAb requires specialist obstetric/endocrine surveillance for fetal tachycardia, fetal goitre, growth restriction or fetal/neonatal thyrotoxicosis"],
         ["<b>TPO antibodies</b>","Useful in selected women with thyroid dysfunction or previous thyroid disease. Routine TPOAb testing of all euthyroid pregnant women is not recommended; women already known to be TPOAb positive need closer TFT monitoring"]
       ]},
       {b:"why", html:"Pregnancy physiology rewrites the reference ranges: hCG suppresses TSH in the first trimester and rising TBG lifts total thyroid hormones, so laboratory-, method- and trimester-specific ranges are essential to avoid both over-diagnosing hyperthyroidism and missing genuine hypothyroidism. This is the single most common interpretive error in pregnancy thyroid testing."}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment by pattern",
     sub:"The treatment threshold is lower than outside pregnancy, and the direction of dose change is counter-intuitive.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"At a positive pregnancy test", html:"1. Check TSH and FT4 promptly. 2. If already taking levothyroxine, advise an empirical increase of approximately 25–30% unless an individual specialist plan says otherwise. 3. Separate levothyroxine from iron/calcium supplements by at least 4 hours. 4. Arrange pregnancy/endocrine monitoring according to the severity and existing diagnosis."},
         {tone:"amber", h:"If hyperthyroidism is suspected", html:"1. Check TSH, FT4 and FT3. 2. Assess symptoms and severity. 3. Ask about Graves' disease, previous radioiodine/surgery and antithyroid drugs. 4. Arrange TRAb where Graves' disease is possible or has previously been treated. 5. Refer promptly to endocrinology and obstetric medicine. 6. Do not independently switch or titrate PTU/carbimazole unless covered by a local specialist protocol. 7. Safety-net fever, sore throat, jaundice and severe deterioration."},
         {tone:"green", h:"After delivery", html:"1. Reduce levothyroxine to the pre-pregnancy dose if it was increased during pregnancy, unless the specialist plan says otherwise. 2. Check TFTs at approximately 6 weeks. 3. Screen for postpartum thyroiditis if symptomatic or high risk. 4. Check TFTs at 3 and 6 months in women with type 1 diabetes or according to the local high-risk pathway. 5. Continue to monitor women with previous Graves' disease because relapse is common postpartum."}
       ]},
       {b:"table", head:["Hypothyroidism — overt or subclinical","Action"], rows:[
         ["<b>Refer according to risk</b>","Urgent antenatal/endocrinology discussion for overt hypothyroidism or TSH markedly elevated or above 10 mU/L. Specialist advice or pathway referral for milder subclinical hypothyroidism, TPOAb positivity with normal TFTs, or known disease with a pre-existing specialist plan. A euthyroid woman with stable Hashimoto's on levothyroxine does not necessarily need an urgent endocrine referral if an established pregnancy monitoring pathway exists — antenatal notification and early TFTs remain appropriate"],
         ["<b>Increase the dose early</b>","An empirical increase of approximately 25–30% immediately after a positive pregnancy test, followed by TFT-guided adjustment — for example doubling the usual dose on two days each week, or adding 25–50 micrograms daily according to the existing dose. Some women need 30–50%, depending on the cause of hypothyroidism, pre-pregnancy TSH and residual thyroid function — this is not a universal mandatory increase"],
         ["<b>Already on levothyroxine?</b>","Check TFTs as soon as pregnancy is confirmed and usually increase the dose empirically by approximately 25–30% while awaiting results, unless an individual specialist plan says otherwise — do not wait for booking. Further adjustment is guided by TSH and FT4"],
         ["<b>Newly diagnosed?</b>","Start levothyroxine promptly in overt hypothyroidism and severe subclinical hypothyroidism (TSH above 10 mU/L), using the local pregnancy protocol and specialist advice where needed. Do not delay treatment solely while waiting for an outpatient appointment. Treatment of milder subclinical hypothyroidism depends on TSH, TPO antibody status, gestation and local specialist guidance"],
         ["<b>Target</b>","Keep TSH within the trimester-specific range (specialist-led). Recheck TSH and FT4 every 4–6 weeks until 20 weeks, then at around 28 weeks, and 4–6 weeks after any dose change"],
         ["<b>How to take it</b>","Take levothyroxine consistently, either 30–60 minutes before breakfast or at bedtime several hours after food. Separate from iron, calcium and antacid-containing pregnancy supplements by at least 4 hours. Record the brand/formulation if she reports problems after switching. Do not use liothyronine or desiccated thyroid extract in pregnancy"]
       ]},
       {b:"why", html:"Thyroxine requirements commonly rise early in pregnancy, because of increased binding-globulin and transplacental transfer to a fetus that cannot yet make its own hormone. An empirical increase of about 25–30% on a positive test — often by simply adding two extra usual doses per week — followed by TFT-guided titration keeps TSH in range and protects fetal neurodevelopment. <b>Under-treatment is the harm to avoid</b>, and the rising demand means the dose usually needs to go <em>up</em> in the first trimester — the opposite of the instinct to minimise medication in pregnancy."},
       {b:"table", head:["Hyperthyroidism — overt or subclinical","Action"], rows:[
         ["<b>Refer promptly</b>","Urgent antenatal/endocrinology discussion for overt hyperthyroidism, symptoms, high FT4/FT3 or suspected Graves' disease, current antithyroid-drug treatment, severe disease, or previous Graves' treated with radioiodine or thyroidectomy (TRAb may persist). Euthyroid previous Graves' → specialist advice or pathway referral for TRAb assessment and fetal monitoring. Check TSH, FT3 and FT4 immediately and send to the specialist"],
         ["<b>Drug of choice</b>","Antithyroid treatment is specialist-led. Propylthiouracil (PTU) is generally preferred during early pregnancy, particularly the first trimester, because carbimazole is associated with congenital malformations (see the MHRA alert). If a woman conceives while taking carbimazole, contact endocrinology/obstetric medicine urgently regarding switching to PTU, ideally before 10 weeks. After the first trimester the choice is specialist-led and may involve switching back to carbimazole to reduce cumulative PTU liver toxicity"],
         ["<b>Risk–benefit</b>","Carbimazole should only be used in pregnancy after an individual benefit–risk assessment and at the lowest effective dose (MHRA). Both PTU and carbimazole cross the placenta; PTU carries a risk of serious hepatotoxicity. Block-and-replace treatment should not be used in pregnancy"],
         ["<b>Treatment target</b>","Titrate antithyroid drugs to maintain FT4 in the upper half of the trimester-specific reference range, or according to the specialist pregnancy protocol. TSH may remain suppressed for some time and should not be used in isolation to increase the dose. Over-treatment can cause fetal hypothyroidism and goitre"],
         ["<b>TRAb and fetal surveillance</b>","Measure TRAb in current or previous Graves' disease, including after radioiodine or thyroidectomy. Elevated TRAb → specialist obstetric/endocrine surveillance for fetal tachycardia, fetal goitre, growth restriction or fetal/neonatal thyrotoxicosis"],
         ["<b>Antithyroid-drug safety-net</b>","Stop the antithyroid drug and seek urgent medical assessment for fever, sore throat, mouth ulcers or other symptoms of infection (risk of agranulocytosis) — check an FBC urgently rather than waiting for a routine TFT. Seek urgent advice for jaundice, dark urine, pale stools, severe pruritus, abdominal pain or marked nausea, because PTU can cause serious liver injury"],
         ["<b>Already on treatment</b>","<b>Ongoing blood monitoring is arranged and managed in secondary care</b> — do not independently switch or titrate PTU/carbimazole unless covered by a local specialist protocol"],
         ["<b>Symptom control</b>","For adrenergic symptoms (tremor, tachycardia) while awaiting specialist review, seek endocrinology advice — a beta-blocker may be used short-term"],
         ["<b>Aetiology</b>","Distinguish Graves' disease from gestational transient thyrotoxicosis (hCG-driven, often with hyperemesis) — endocrinology-led, because management differs. Gestational transient thyrotoxicosis is usually managed supportively; antithyroid drugs are generally not required. Graves' disease is suggested by goitre, ophthalmopathy, positive TRAb, previous Graves' disease or more marked/persistent biochemical hyperthyroidism"],
         ["<b>Radioiodine and surgery</b>","Radioiodine is contraindicated during pregnancy and breastfeeding. If definitive surgery is necessary, the second trimester is generally preferred; thyroidectomy requires specialist obstetric/endocrine/anaesthetic planning"]
       ]},
       {b:"why", html:"Carbimazole, and its active metabolite methimazole, is associated with a recognised embryopathy, so the MHRA advises effective contraception and specialist-guided use; PTU is generally preferred in the first trimester despite its own hepatic risks, and later in pregnancy the specialist may switch back to carbimazole. Because the agent choice, dose and timing are a fine specialist balance — and TRAb can cross the placenta and affect the fetus — hyperthyroidism is referred promptly, and women with current or previous Graves' need TRAb assessment even when the mother is currently euthyroid."}
     ]},

    {id:"ppt", nav:"Postpartum", title:"Postpartum thyroiditis, and stepping the dose back down",
     sub:"Postpartum thyroiditis is common and classically biphasic. It usually resolves spontaneously in &lt;1 year.",
     blocks:[
       {b:"table", head:["Aspect","Detail"], rows:[
         ["<b>Thyrotoxic pattern</b>","Usually destructive thyroiditis rather than increased hormone synthesis, so antithyroid drugs are not useful; a beta-blocker may be considered for troublesome symptoms, subject to breastfeeding and clinical status. If initial TFTs show a thyrotoxic pattern → refer to a specialist for further tests to differentiate from relapsed or new Graves' disease. After the thyrotoxic phase resolves, recheck TFTs at 4–8 weeks (or if new symptoms) to screen for the hypothyroid phase"],
         ["<b>Hypothyroid pattern</b>","If TFTs show a hypothyroid pattern → seek specialist advice. Levothyroxine may be required if symptoms are significant, TSH is substantially elevated, the woman is breastfeeding, or another pregnancy is planned. Consider a trial of withdrawal after around 6–12 months if clinically appropriate; permanent hypothyroidism is possible"],
         ["<b>Who to suspect</b>","Check TFTs after delivery — particularly with a goitre, non-specific symptoms suggestive of thyroiditis, a history of PPT or autoimmune thyroid disease, or TPOAb positivity"],
         ["<b>When to check</b>","<b>Check TFTs at approximately 6–8 weeks postpartum in women at risk of postpartum thyroiditis, and earlier if symptoms are significant.</b> Women with type 1 diabetes or known TPOAb positivity need additional monitoring, commonly at 3 and 6 months postpartum according to the specialist pathway"],
         ["<b>History of resolved PPT</b>","Offer annual TFT monitoring; screen before a future pregnancy and at 6–8 weeks after any pregnancy — there is a high risk of permanent hypothyroidism and of recurrence"],
         ["<b>Relapse risk</b>","There is a significant risk of relapse — do not discharge from follow-up too early"]
       ]},
       {b:"why", html:"PPT typically runs a thyrotoxic phase — destructive release of stored hormone — followed by a hypothyroid phase before recovery. Distinguishing the thyrotoxic phase from new Graves' disease matters, because Graves' needs antithyroid drugs whereas PPT thyrotoxicosis does not — a beta-blocker for troublesome symptoms is the usual extent of treatment. The high rate of eventual permanent hypothyroidism and recurrence is why resolved PPT earns annual monitoring and pre-pregnancy screening."},
       {b:"table", head:["Postpartum — dose and follow-up","Detail"], rows:[
         ["<b>Was on levothyroxine before pregnancy</b>","If the dose was increased during pregnancy, reduce to the pre-pregnancy dose after delivery if that was the established plan, unless the specialist plan says otherwise. Check TFTs at approximately 6 weeks postpartum"],
         ["<b>Started levothyroxine in pregnancy</b>","Do not automatically stop or reduce it without reviewing the indication. Discuss with the specialist whether any dose changes are required postpartum, and the frequency of TFT monitoring"],
         ["<b>Hyperthyroidism postpartum</b>","Relapse of Graves' disease is common postpartum — check TFTs after delivery and continue specialist-led monitoring"],
         ["<b>Breastfeeding</b>","Levothyroxine is safe; PTU and carbimazole are used at the lowest effective dose under specialist guidance — do not stop thyroid treatment to breastfeed without advice. Radioiodine is contraindicated while breastfeeding"],
         ["<b>PPT hypothyroid phase</b>","If levothyroxine was started for PPT-related hypothyroidism, the specialist will advise on duration and a trial of withdrawal after around 6–12 months — many recover, but permanent hypothyroidism is possible"],
         ["<b>Document the plan</b>","Record the postpartum dose change, the 6-week TFT, and the ongoing monitoring interval"]
       ]},
       {b:"why", html:"The pregnancy-driven rise in thyroxine requirement reverses after delivery, so a woman left on her pregnancy dose will become over-replaced — hence the prompt step back to the pre-pregnancy dose and a 6-week TFT check. Graves' disease characteristically relapses postpartum, which is why hyperthyroid women stay under specialist monitoring after delivery."}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Monitoring schedule and higher-risk groups",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>Positive pregnancy test in a woman on levothyroxine</b>","Measure TSH and FT4 immediately — the earliest window for dose adjustment"],
         ["<b>After a dose change</b>","<b>Approximately every 4–6 weeks until stable</b>"],
         ["<b>Stable treated hypothyroidism</b>","Every 4–6 weeks until 20 weeks, then around 28 weeks"],
         ["<b>New or treated hyperthyroidism</b>","Specialist-led; commonly every 2–4 weeks initially, then every 4–8 weeks"],
         ["<b>Postpartum levothyroxine dose reduction</b>","<b>Approximately 6 weeks after delivery</b>"],
         ["<b>Risk of postpartum thyroiditis</b>","Around 6–8 weeks postpartum, and earlier if symptomatic"],
         ["<b>Type 1 diabetes — 3× PPT risk</b>","Check TSH, FT4 and TPOAb prior to pregnancy and at diagnosis of pregnancy; additional postpartum testing, commonly at 3 and 6 months, according to the specialist pathway"],
         ["<b>TPOAb-positive women</b>","Higher risk of PPT and of progression — closer TFT monitoring in pregnancy, and additional postpartum testing, commonly at 3 and 6 months. Routine TPOAb testing of all euthyroid pregnant women is not recommended"],
         ["<b>Pre-conception optimisation</b>","In known thyroid disease, optimise TFTs and adjust levothyroxine before conception where possible"],
         ["<b>Coordinate care</b>","Keep antenatal, endocrinology and primary care aligned on targets, doses and the monitoring plan"]
       ]},
       {b:"why", html:"Frequent, scheduled TFTs — at confirmation, every 4–6 weeks until 20 weeks, around 28 weeks, after each dose change and postpartum — are what keep a moving target in range as requirements change through pregnancy and fall again after delivery. Women with type 1 diabetes carry a threefold PPT risk, so their antibody and TFT screening is more intensive and extends to 3 and 6 months postpartum."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📋 Preconception counselling", html:"For known thyroid disease — optimise control and adjust treatment before conceiving. Hypothyroid women often need an immediate dose increase once pregnant."},
         {tone:"blue", h:"🧂 Iodine and absorption", html:"Aim for adequate iodine intake during pregnancy and breastfeeding, generally around 200–250 micrograms daily from diet and/or an appropriate pregnancy supplement; RCOG advises considering 150 micrograms iodine as potassium iodide, depending on dietary intake and local practice. Avoid high-dose iodine or kelp preparations, particularly in thyroid disease. Take levothyroxine consistently 30–60 minutes before breakfast or at bedtime, at least 4 hours from iron, calcium and antacid-containing supplements. Adherence is critical."},
         {tone:"blue", h:"⚖️ The drug conversation", html:"Discuss the carbimazole and PTU teratogenicity balance with the specialist rather than making the switch alone."},
         {tone:"cream", h:"🚭 Smoking", html:"<b>Support smoking cessation</b> as part of routine antenatal care."}
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same-day / admit", html:"Thyroid storm (fever, tachyarrhythmia, agitation), intractable vomiting or dehydration suggesting hyperemesis, or fetal concerns. On an antithyroid drug: fever, sore throat or mouth ulcers (urgent FBC for agranulocytosis), or jaundice, dark urine, pale stools, severe pruritus, abdominal pain or marked nausea (PTU liver injury)."},
         {tone:"amber", h:"🟠 Bring testing forward", html:"Symptoms worsen, vomiting becomes intractable, or TFTs drift out of the trimester range — re-test early and re-discuss with the specialist."},
         {tone:"blue", h:"🔁 After delivery", html:"If levothyroxine was increased in pregnancy, drop to the pre-pregnancy dose (unless the specialist plan says otherwise) and recheck at about 6 weeks. Review for postpartum thyroiditis and screen high-risk (type 1 diabetes, TPOAb-positive) women at 3 and 6 months. Keep monitoring previous Graves' — relapse is common postpartum."},
         {tone:"green", h:"📝 Document and coordinate", html:"Record the diagnosis, dose plan, monitoring schedule and referrals; keep antenatal, endocrine and primary care aligned."}
       ]},
       {b:"say", html:"Two things change now that you are pregnant, and both are counter-intuitive. First, your thyroid blood tests get read against different ranges — a lower TSH in the first three months is normal and does not mean anything is wrong. Second, your levothyroxine dose usually needs to go up, not down: the baby cannot make its own thyroid hormone early on and relies entirely on yours. So I want to arrange the blood test today rather than waiting for your booking appointment, and increase your dose by about a quarter straight away — usually by taking two extra tablets a week — then adjust it once the results are back. After the baby is born we drop it back to your old dose and check again at six weeks."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and emergency criteria",
     sub:"Risk-stratified: urgent discussion for significant disease, specialist advice or pathway referral for milder or stable disease.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency admission", html:"Severe hyperthyroidism or thyroid storm, or intractable vomiting suggesting hyperemesis gravidarum."},
         {tone:"purple", h:"Thyroid suspected cancer referral · NICE NG12", html:"An unexplained thyroid lump should prompt consideration of a suspected cancer pathway referral, with ultrasound and specialist assessment according to the pathway. Pregnancy does not remove the need for urgent investigation, but not every palpable nodule automatically needs a 2-week referral — it depends on the NG12 features and clinical assessment."},
         {tone:"amber", h:"Urgent antenatal + endocrinology discussion", html:"Overt hypothyroidism; TSH markedly elevated or above 10 mU/L; overt hyperthyroidism; hyperthyroidism with symptoms, high FT4/FT3 or suspected Graves' disease; current antithyroid-drug treatment; thyroid storm or severe disease; previous Graves' treated with radioiodine or thyroidectomy (TRAb may persist); abnormal TFTs with significant symptoms or obstetric complications. Check TSH and FT4 (plus FT3 if hyperthyroid) immediately."},
    {tone:"blue", h:"Specialist advice or pathway referral", html:"Milder subclinical hypothyroidism; positive TPO antibodies with normal TFTs; known thyroid disease with a pre-existing specialist plan; euthyroid previous Graves' disease needing TRAb assessment and fetal monitoring. Stable Hashimoto's on levothyroxine with an established pathway → antenatal notification and early TFTs."},
         {tone:"blue", h:"New diagnosis", html:"New hypo- or hyperthyroidism in pregnancy → contact endocrinology for advice and guidance. Start levothyroxine promptly in overt or severe subclinical hypothyroidism — do not delay treatment solely while waiting for an appointment."},
         {tone:"green", h:"Postpartum thyroiditis", html:"Refer to endocrinology if TFTs are abnormal — urgency by clinical judgement."},
         {tone:"cream", h:"Pre-conception", html:"Known thyroid disease planning pregnancy → optimise and refer for pre-pregnancy counselling and dose planning."}
       ]},
       {b:"why", html:"Thyroid disease in pregnancy is shared antenatal–endocrine–primary-care territory, and referral is stratified by risk — urgent for significant or Graves' disease, advice or pathway referral for milder or stable disease — because the stakes for mother and fetus are high and the management is specialist: trimester targets, antithyroid drug choice, and TRAb surveillance. Thyroid storm and hyperemesis are the emergencies; an unexplained thyroid lump still prompts consideration of the suspected cancer pathway."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 31-year-old on levothyroxine 100 micrograms for Hashimoto's rings the surgery having just had a positive pregnancy test at about 5 weeks. She feels well, her last TSH three months ago was normal, and she asks whether she should stop or reduce the tablet \u201cnow that I'm pregnant\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Corrects the assumption immediately — the dose goes UP, not down, and explains why (the fetus cannot make its own hormone in the first trimester); <b>arranges TFTs now rather than waiting for booking</b>; advises an <b>empirical increase of about 25–30% now (for example two extra doses a week), then titrates to TSH and FT4</b>; notifies antenatal care and <b>arranges monitoring or referral according to risk and the local pathway</b>; covers absorption — empty stomach, 4 hours from iron and calcium in her prenatal vitamins; sets out the <b>trimester monitoring schedule</b>; and — the step candidates miss — flags the postpartum step-down and the 6-week check at this first consultation, so she is not left over-replaced after delivery."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>RCOG Green-top Guideline No. 76 — Management of Thyroid Disorders in Pregnancy (2025).</b> BJOG 2025<br><a href="https://doi.org/10.1111/1471-0528.18088" rel="noopener">doi:10.1111/1471-0528.18088</a><span class="rd"> — the key UK pregnancy-specific source: empirical 25–30% levothyroxine increase, PTU in early pregnancy and switching from carbimazole before 10 weeks, TSH and FT4 every 4–6 weeks until 20 weeks then around 28 weeks, no routine TPOAb testing in euthyroid pregnancy, and iodine supplementation</span></li>'+
         '<li>NW London Outpatient Pathways — Thyroid dysfunction in pregnancy (Issue 1, March 2021)<span class="rd"> — the postpartum thyroiditis pathway and the postpartum step-down</span></li>'+
         '<li><b>NICE NG145 — Thyroid disease: assessment and management</b><br><a href="https://www.nice.org.uk/guidance/ng145" rel="noopener">nice.org.uk/guidance/ng145</a><span class="rd"> — background only: diagnosis and management of thyroid disease outside pregnancy; NG145 explicitly does not cover thyroid disease in pregnancy and is not the principal pregnancy-management guideline</span></li>'+
         '<li><b>Alexander EK et al. — 2017 Guidelines of the American Thyroid Association for the diagnosis and management of thyroid disease during pregnancy and the postpartum.</b> Thyroid 2017;27:315–89 (international)<br><a href="https://pubmed.ncbi.nlm.nih.gov/28056690/" rel="noopener">pubmed 28056690</a><span class="rd"> — levothyroxine increase as soon as pregnancy is confirmed, PTU preferred in the first trimester, postpartum thyroiditis course and follow-up, and TSH screening at 3 and 6 months postpartum in type 1 diabetes</span></li>'+
         '<li><b>MHRA Drug Safety Update — Carbimazole: increased risk of congenital malformations; strengthened advice on contraception (February 2019)</b><br><a href="https://www.gov.uk/drug-safety-update/carbimazole-increased-risk-of-congenital-malformations-strengthened-advice-on-contraception" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — the carbimazole embryopathy risk (especially first trimester and higher doses), effective contraception during treatment, and use in pregnancy only after an individual benefit–risk assessment at the lowest effective dose</span></li>'+
         '<li><b>De Groot L et al. — Management of thyroid dysfunction during pregnancy and postpartum: an Endocrine Society clinical practice guideline.</b> J Clin Endocrinol Metab 2012;97:2543–65 (international)<span class="rd"> — trimester-specific reference ranges, and Graves\u2019 antibody surveillance in pregnancy</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — consider a suspected cancer pathway referral for thyroid cancer in people with an unexplained thyroid lump; pregnancy does not alter this</span></li>'+
         '<li><b>British Thyroid Association — UK Guidelines for the Use of Thyroid Function Tests (2006)</b><span class="rd"> — TRAb assessment in women with previous Graves’ disease</span></li>'+
         '<li><b>GMMMG Formulary — Endocrine system</b><br><a href="https://www.greatermanchesterformulary.nhs.uk/" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — levothyroxine first choice; thyroid extract and combination products not routinely prescribed</span></li>'+
         '<li><b>Product information (SPC) for levothyroxine, propylthiouracil and carbimazole, local Greater Manchester endocrine/obstetric referral arrangements, and local laboratory pregnancy reference ranges</b><span class="rd"> — verify doses, product-specific contraindications, referral routes and trimester-specific ranges locally</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Thyroid disease in pregnancy — NW London Outpatient Pathways (Issue 1, March 2021), the MHRA Drug Safety Update on carbimazole (February 2019), ATA (2017) and Endocrine Society (2012) pregnancy guidance (international), NICE NG12 (updated April 2026), and NICE NG145 for thyroid disease outside pregnancy. Antithyroid drugs and antenatal thyroid care are specialist-led: always apply laboratory-, method- and trimester-specific reference ranges and refer according to risk. Key UK source: RCOG Green-top Guideline No. 76 (2025). The non-pregnant conditions are covered by the <a href=\"hypothyroidism.html\">hypothyroidism</a> and <a href=\"hyperthyroidism.html\">hyperthyroidism</a> protocols. Verify doses and product-specific contraindications against the current SPC, the local Greater Manchester formulary and the specialist pregnancy protocol."
});
